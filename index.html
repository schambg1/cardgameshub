<div id="app"></div>

<script>
const SUITS=["♠︎","♥︎","♦︎","♣︎"];
const RANKS={1:"A",11:"J",12:"Q",13:"K"};
const CHANCES={1:4,13:3,12:2,11:1};
const RNAME={1:"Ace",13:"King",12:"Queen",11:"Jack"};
const COLORS=["#e8c35a","#4fc9c0","#f08a6c","#b9a1f0","#9fd46b","#f28fb6"];
const label=r=>(RANKS[r]||r);
const royal=r=>r===1||r>=11;
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const rid=n=>Array.from({length:n},()=>"abcdefghjkmnpqrstuvwxyz23456789"[Math.floor(Math.random()*31)]).join("");

/* ---------- chips ---------- */
const START_CHIPS=500, STAKES=[0,25,50,100,250];
const wallet={get(){const v=store.get("hub-chips");return Number.isFinite(v)?v:START_CHIPS},set(v){const n=Math.max(0,Math.round(v));store.set("hub-chips",n);try{stDay(n);}catch(e){}}};
const localChips={all(){return store.get("hub-local-chips")||{}},get(name){const v=this.all()[name.trim().toLowerCase()];return Number.isFinite(v)?v:START_CHIPS},
  set(name,v){const a=this.all();a[name.trim().toLowerCase()]=Math.max(0,Math.round(v));store.set("hub-local-chips",a)},reset(names){const a=this.all();names.forEach(n=>a[n.trim().toLowerCase()]=START_CHIPS);store.set("hub-local-chips",a)}};
const DAY=864e5, BONUS=50;
const bonus={
  wait(last){return last?Math.max(0,last+DAY-Date.now()):0},
  myWait(){return this.wait(store.get("hub-bonus-at"))},
  claimMine(){if(this.myWait())return;wallet.set(wallet.get()+BONUS);store.set("hub-bonus-at",Date.now());},
  localWait(name){return this.wait((store.get("hub-local-bonus")||{})[name.trim().toLowerCase()])},
  claimLocal(name){if(this.localWait(name))return;localChips.set(name,localChips.get(name)+BONUS);
    const a=store.get("hub-local-bonus")||{};a[name.trim().toLowerCase()]=Date.now();store.set("hub-local-bonus",a);},
  text(ms){const h=Math.floor(ms/36e5),m=Math.ceil((ms%36e5)/6e4);return h?`${h}h ${m}m`:`${m}m`;}
};
function settled(gid){return(store.get("hub-settled")||[]).includes(gid)}
function markSettled(gid){const a=(store.get("hub-settled")||[]).slice(-40);a.push(gid);store.set("hub-settled",a)}
const fmt=n=>Number(n).toLocaleString("en-US");

/* ---------- turn clock: 15 seconds per turn, enforced by whichever device runs the game ---------- */
const TURN_MS=15000;
const _seen=new Map();
function turnDeadline(key,tl){
  if(tl==null)return null;
  if(!_seen.has(key)){_seen.set(key,Date.now()+tl);if(_seen.size>80)_seen.delete(_seen.keys().next().value);}
  return _seen.get(key);
}
function clockHTML(key,tl,mine){
  const dl=turnDeadline(key,tl);if(!dl)return"";
  const r=Math.max(0,dl-Date.now());
  return`<span class="tsec ${r<=5000?"low":""} ${mine?"mine":""}" data-dl="${dl}" aria-label="Time left">${Math.ceil(r/1000)}s</span>`;
}
let lastTickSec=-1,buzzedFor=0;
setInterval(()=>{
  document.querySelectorAll(".tsec[data-dl]").forEach(e=>{const r=Math.max(0,+e.dataset.dl-Date.now()),sec=Math.ceil(r/1000);
    const t=sec+"s";if(e.textContent!==t)e.textContent=t;e.classList.toggle("low",r<=5000);
    if(e.classList.contains("mine")&&r>0&&r<=5000){if(sec!==lastTickSec){lastTickSec=sec;sfx("tick");}
      const dl=+e.dataset.dl;if(buzzedFor!==dl){buzzedFor=dl;buzz(80);}}});
  document.querySelectorAll(".rfg[data-dl]").forEach(e=>e.classList.toggle("low",+e.dataset.dl-Date.now()<=5000));
},250);
const clockLeft=(at,ms)=>at?Math.max(0,at+(ms||TURN_MS)-Date.now()):null;
/* turn clock: the host picks 15s, 30s, 60s or no clock. Run out of time and your clock is shorter
   (60%, then 40%, never under 8s) until you take 3 turns in time. */
const TM_OPTS=[15,30,60,0];
const TMS=()=>{const v=store.get("hub-turnsec");return TM_OPTS.includes(v)?v:15;};
function tmFor(p){const b=TMS()*1000;if(!b)return 0;const n=p&&p.tm?p.tm.n:0;return n?Math.max(8000,Math.round(b*(n===1?.6:.4))):b;}
function tmEnd(T){const c=T._tc;if(c&&!c.out){const p=T.players[c.i];if(p&&p.tm&&p.tm.n&&++p.tm.ok>=3){p.tm.n=0;p.tm.ok=0;}}T._tc=null;}
function tmStart(T,i){
  const c=T._tc;if(!(c&&c.i===i))tmEnd(T);   // the same player carrying on keeps their turn record
  if(!T._tc)T._tc={i,out:false};
  const ms=i>=0?tmFor(T.players[i]):0;T.turnMs=ms||null;T.turnAt=ms?Date.now():null;return ms;
}
function tmOut(T){const c=T._tc;if(!c)return"";if(c.out)return"";c.out=true;const p=T.players[c.i];if(!p||p.bot)return"";p.tm=p.tm||{n:0,ok:0};p.tm.n=Math.min(2,p.tm.n+1);p.tm.ok=0;return" · shorter clock for a few turns";}
function tmPick(){const v=TMS();
  return`<div class="tmpick"><div class="betrow"><span class="label">Turn clock</span><div class="count-pick" style="flex:0 1 260px">${TM_OPTS.map(x=>`<button data-act="turn-sec" data-v="${x}" aria-pressed="${v===x}">${x?x+"s":"Off"}</button>`).join("")}</div></div>
    <p class="note">${v?"Run out of time and your clock gets shorter until you take 3 turns in time.":"No clock: everyone takes as long as they need."}</p></div>`;}

/* ---------- app state ---------- */
const APP={screen:"hub",mode:"local",count:4,names:["Player 1","Player 2","Player 3","Player 4","Player 5","Player 6"],
  myName:(store.get("ew-name")||""),joinCode:"",sheet:null,err:"",buyIn:0,lastResult:null,bj:"local",bjCount:2,bc:"local",bcCount:2,jb:"mine",jbCount:2,hm:"local",om:"off",omBuy:0,omNew:null,omMsg:"",rm:"off",rmBuy:0,rmSel:[],rmSort:"suit",hmCount:3,hmBlinds:0,hmRaise:0,hmRB:false,hmKey:"",peek:false};
let G=null;            // engine state (same-phone, or host)
let V=null, prevV=null;// what's on screen
const CID=store.get("ew-cid")||(()=>{const c=rid(10);store.set("ew-cid",c);return c})();
const NET={room:undefined,nr:null,code:"",seats:[],seen:{},buyIn:0,info:{},agree:null,my:{flip:0,slap:0,nonce:rid(6)},started:false,host:null,hostGone:false,connected:true,mySeat:-1,searchTimer:null};
let timer=null;const toastSeen={};

window.claude?.use?.("room").then(r=>{NET.room=wrapRoom(r)||null;lobbyHook();render();pendingJoin();}).catch(()=>{NET.room=null;render();pendingJoin();});
setTimeout(()=>{if(NET.room===undefined){NET.room=null;render();pendingJoin();}},11000);

/* ---------- engine ---------- */
function newGame(names,buyIn){
  const deck=[];for(let s=0;s<4;s++)for(let r=1;r<=13;r++)deck.push([r,s]);
  for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]];}
  const n=names.length;
  const players=names.map((nm,i)=>({name:nm,color:COLORS[i],hand:[],out:false}));
  deck.forEach((c,i)=>players[i%n].hand.push(c));  // seat 0 sits left of the dealer and goes first
  clearTimeout(timer);
  return{players,pile:[],turn:0,challenge:null,pending:null,lastFlip:0,toast:null,slapLock:0,winner:null,seq:0,
    stake:{buyIn:buyIn|0,gid:rid(8),n}};
}
function nextWithCards(p){
  const n=G.players.length;
  for(let i=1;i<=n;i++){const q=(p+i)%n,pl=G.players[q];if(!pl.out&&pl.hand.length)return q;}
  return -1;
}
function startPending(to){
  G.pending={to};clearTimeout(timer);
  timer=setTimeout(()=>{collect(to,`${G.players[to].name} wins the pile`);changed();},1400);
}
function collect(to,why){
  clearTimeout(timer);
  const pl=G.players[to];
  pl.hand.push(...G.pile);
  G.pile=[];G.challenge=null;G.pending=null;G.turn=to;
  toast(`${why} · starts next round`,pl.color);
  if(pl.hand.length===52)G.winner=to;
}
function fixTurn(){
  if(G.pending)return;
  const cur=G.players[G.turn];
  if(cur&&cur.hand.length&&!cur.out)return;
  const d=nextWithCards(G.turn);
  if(G.challenge){if(d===-1||d===G.challenge.by)startPending(G.challenge.by);else G.turn=d;}
  else{if(d===-1)startPending(G.lastFlip);else G.turn=d;}
}
function flip(p){
  if(!G||G.winner!=null||G.pending||p!==G.turn)return;
  const pl=G.players[p];if(!pl||!pl.hand.length)return;
  const c=pl.hand.shift();G.pile.push(c);G.lastFlip=p;G.pileAt=Date.now();
  if(royal(c[0])){
    G.challenge={by:p,left:CHANCES[c[0]],r:c[0]};
    const d=nextWithCards(p);
    if(d===-1||d===p)startPending(p);else G.turn=d;
  }else if(G.challenge){
    G.challenge.left--;
    if(G.challenge.left<=0)startPending(G.challenge.by);
    else if(!pl.hand.length)fixTurn();
  }else{
    const d=nextWithCards(p);
    if(d===-1)startPending(p);else G.turn=d;
  }
  changed();
}
function combo(zero){
  const P=G.pile,n=P.length,a=P[n-1],b=P[n-2],c=P[n-3];
  if(b&&a[0]===b[0])return"double";
  if(c&&a[0]===c[0])return"sandwich";
  if(!zero&&b&&a[0]<=10&&b[0]<=10&&a[0]+b[0]===10)return"ten";
  return null;
}
function slap(p){
  if(!G||G.winner!=null)return;
  const pl=G.players[p];if(!pl||pl.out)return;
  const now=Date.now();
  if(now-G.slapLock<600){ // someone just won a slap; near-ties aren't punished, but a close one gets a replay
    const L=G.lastWin;if(L&&L.p!==p&&!L.rp&&now-L.at<350){L.rp=1;const a=G.players[L.p];
      G.replay={id:rid(5),a:{n:a.name,col:a.color,ms:L.ms},b:{n:pl.name,col:pl.color,ms:L.ms!=null?L.ms+(now-L.at):null},gap:now-L.at};changed();}
    return;}
  const zero=pl.hand.length===0,k=combo(zero);
  if(k){G.slapLock=now;G.lastWin={p,at:now,ms:G.pileAt?now-G.pileAt:null};
    if(APP.mode!=="local"&&p===NET.mySeat)dcHit("ew","slap");
    if(APP.mode!=="local"&&p===NET.mySeat&&G.pileAt){const ms=now-G.pileAt;if(ms>80&&ms<5000){stSet(s=>{if(!s.slap||ms<s.slap)s.slap=ms;});if(ms<500)achAdd("ewQuick",1,"set");}}
    collect(p,`${pl.name} slapped a ${k}!${zero?" Back in the game":""}`);}
  else if(zero){pl.out=true;toast(`${pl.name} false-slapped with no cards and is eliminated`,pl.color);fixTurn();}
  else{const b=pl.hand.shift();G.pile.unshift(b);toast(`${pl.name} false slap · burned a ${label(b[0])} to the bottom`,pl.color);fixTurn();}
  changed();
}
function toast(text,color){G.toast={id:rid(5),text,color};}
let ewReplaySeen=null;
function ewShowReplay(r){
  const old=document.getElementById("ewrp");if(old)old.remove();
  const t=ms=>ms==null?"":(ms/1000).toFixed(2)+" s",gap=Math.max(1,r.gap|0),slow=MOTION();
  const lane=(q,d,first)=>`<div class="ewrp-lane ${first?"first":""}" style="--d:${d}s;--pc:${q.col}"><span class="ewrp-n">${esc(q.n)}</span><span class="ewrp-track"><i class="ewrp-hand" aria-hidden="true">✋</i><span class="ewrp-pile" aria-hidden="true"></span></span><span class="ewrp-t">${first?"First!":t(q.ms)||"+"+(gap/1000).toFixed(2)+" s"}</span></div>`;
  const el=document.createElement("div");el.id="ewrp";el.setAttribute("role","status");
  el.innerHTML=`<div class="ewrp-in ${slow?"":"still"}"><span class="eyebrow">Instant replay · slow motion</span><b>Close call!</b>
    ${lane(r.a,1.1,true)}${lane(r.b,Math.min(2.2,1.1+gap/100),false)}
    <p><b>${esc(r.a.n)}</b> beat <b>${esc(r.b.n)}</b> by ${(gap/1000).toFixed(2)} seconds${r.a.ms!=null?` · slapped in ${t(r.a.ms)}`:""}</p></div>`;
  el.addEventListener("pointerdown",()=>el.remove());
  document.body.appendChild(el);setTimeout(()=>{el.classList.add("out");setTimeout(()=>el.remove(),400);},3600);
}
function toView(){
  return{seq:++G.seq,players:G.players.map((p,i)=>({name:p.name,color:p.color,n:p.hand.length,out:p.out,cid:G.cids?G.cids[i]:undefined})),
    top:G.pile.slice(-3),pileN:G.pile.length,turn:G.turn,challenge:G.challenge,pending:G.pending,lastFlip:G.lastFlip,toast:G.toast,replay:G.replay||null,winner:G.winner,stake:G.stake,cids:G.cids||null,tl:clockLeft(G.turnAt,G.turnMs)};
}
/* Chips change hands only when someone wins: each other player pays the buy-in to the winner. */
function settle(){
  if(V&&V.winner!=null&&APP.mode!=="local"&&NET.mySeat>=0){
    const k=V.stake&&V.stake.gid?V.stake.gid:G?(G.dcKey||(G.dcKey=rid(6))):null;
    if(k)gameDone("ew",APP.mode==="practice"?"pr":"on",{gid:"ew"+k,win:NET.mySeat===V.winner,net:0,free:!(V.stake&&V.stake.buyIn),with:V.players.filter((q,i)=>i!==NET.mySeat&&!/^Bot /.test(q.name)).map(q=>q.name)});}
  if(APP.mode==="practice"||!V||V.winner==null||!V.stake)return;
  const {buyIn,gid,n}=V.stake;
  if(settled(gid))return;
  markSettled(gid);
  const won=buyIn*(n-1);
  if(APP.mode==="local"){
    V.players.forEach((p,i)=>localChips.set(p.name,localChips.get(p.name)+(i===V.winner?won:-buyIn)));
    APP.lastResult=null;
  }else{
    if(NET.mySeat<0)return;
    const d=NET.mySeat===V.winner?won:-buyIn;
    wallet.set(wallet.get()+d);stHand("ew",d,NET.mySeat===V.winner);
    APP.lastResult={gid,d};
    pushChips();
  }
}
function pushChips(){
  if(!NET.nr)return;
  if(APP.mode==="client")NET.nr.presence({chips:wallet.get()}).catch(()=>{});
  else if(APP.mode==="host"){NET.info[CID]={...(NET.info[CID]||{}),ch:wallet.get()};publishHost();}
}
let ewTT=null,ewTK="";
function ewTurnTimer(){
  if(!G)return;
  if(G.winner!=null||G.pending){clearTimeout(ewTT);ewTK="";G.turnAt=null;G.turnMs=null;tmEnd(G);return;}
  const seat=G.turn,pl=G.players[seat];
  const key=`${G.stake&&G.stake.gid}:${seat}:${pl.hand.length}:${G.challenge?G.challenge.by+"/"+G.challenge.left:"-"}`;
  if(key===ewTK)return;
  ewTK=key;clearTimeout(ewTT);const ms=tmStart(G,seat);if(!ms)return;
  ewTT=setTimeout(()=>{
    if(!G||ewTK!==key||G.turn!==seat||G.pending||G.winner!=null)return;
    toast(`${G.players[seat].name} ran out of time · auto-flip${tmOut(G)}`,G.players[seat].color);flip(seat);
  },ms);
}
function changed(){
  ewTurnTimer();
  V=toView();
  if(APP.mode==="host"){publishHost();saveHost();}
  render();
  if(APP.mode==="practice")ewBotTick();
}

/* ---------- online: host ---------- */
async function hostGame(resume){
  if(!NET.room)return;
  const code=resume?resume.code:rid(4);
  APP.err="";
  try{NET.nr=await NET.room.join("ew-"+code);}catch(e){APP.err="Couldn't open a game room. Try again in a moment.";render();return;}
  APP.mode="host";NET.code=code;NET.seen={};
  if(resume){NET.seats=resume.seats;NET.started=resume.started;G=resume.G;if(G){G.pending&&startPending(G.pending.to);V=toView();}}
  else{NET.seats=[{c:CID,n:APP.myName||"Host"}];NET.started=false;G=null;V=null;}
  NET.mySeat=G&&G.cids?G.cids.indexOf(CID):0;
  if(resume&&resume.buyIn!=null)NET.buyIn=resume.buyIn;
  NET.info={[CID]:{ch:wallet.get()}};
  APP.screen=NET.started?"game":"lobby";NET.hs=Date.now();
  watchConn();
  NET.unsub=NET.nr.onPeers(onPeersHost);
  publishHost();saveHost();render();
}
function publishHost(){
  if(!NET.nr)return;
  NET.nr.presence({role:"host",game:"ew",hs:NET.hs,code:NET.code,cid:CID,started:NET.started,buyIn:NET.buyIn,seats:seatList(),v:NET.started?V:null,snap:ewSnap()}).catch(()=>{});
  lobbyAnnounce(NET.started?null:{g:"ew",code:NET.code,name:myName(),n:NET.seats.length});
}
function seatList(){
  return NET.seats.map((s,i)=>{const f=NET.info[s.c]||{};return{c:s.c,n:s.n,ch:Number.isFinite(f.ch)?f.ch:START_CHIPS,ag:i===0?NET.buyIn:f.ag}});
}
function canStart(){
  const list=seatList(),b=NET.buyIn;
  if(list.length<2)return{ok:false,why:"Waiting for players…",playing:[]};
  const playing=list.filter(s=>s.ch>=b); // anyone who can't cover the buy-in sits out
  if(playing.length<2)return{ok:false,why:`Need 2 players who can cover ${fmt(b)}`,playing};
  const wait=playing.filter(s=>b>0&&s.ag!==b);
  if(wait.length)return{ok:false,why:`Waiting for ${wait.map(s=>s.n).join(", ")} to agree`,playing};
  return{ok:true,why:`Deal 52 cards · ${playing.length} playing`,playing};
}
function setStake(b){NET.buyIn=b;publishHost();saveHost();render();}
function saveHost(){store.set("ew-host",{code:NET.code,seats:NET.seats,started:NET.started,buyIn:NET.buyIn,G});}
function onPeersHost(ch){
  if(dupHost("ew",ch))return;
  let lobbyChanged=false;
  for(const p of ch.peers){
    if(p.sameTab)continue;
    const pr=p.presence||{};
    if(typeof pr.cid!=="string"||pr.role==="host")continue;
    const nm=String(pr.name||"Player").slice(0,14);
    const ch=Number.isFinite(pr.chips)?pr.chips:START_CHIPS,ag=Number.isFinite(pr.agree)?pr.agree:null;
    const old=NET.info[pr.cid]||{};
    if(old.ch!==ch||old.ag!==ag){NET.info[pr.cid]={ch,ag};if(!NET.started||V?.winner!=null)lobbyChanged=true;}
    let seat=NET.seats.findIndex(s=>s.c===pr.cid);
    if(!NET.started){
      if(seat<0&&NET.seats.length<6){NET.seats.push({c:pr.cid,n:nm});lobbyChanged=true;}
      else if(seat>=0&&NET.seats[seat].n!==nm){NET.seats[seat].n=nm;lobbyChanged=true;}
      continue;
    }
    seat=G&&G.cids?G.cids.indexOf(pr.cid):-1;
    if(seat<0)continue; // watching or sitting out
    const key=pr.cid+":"+pr.nonce,s=NET.seen[key];
    if(!s){NET.seen[key]={flip:pr.flip|0,slap:pr.slap|0};continue;}
    if((pr.slap|0)>s.slap){s.slap=pr.slap|0;slap(seat);}
    if((pr.flip|0)>s.flip){s.flip=pr.flip|0;flip(seat);}
  }
  if(!NET.started){
    for(const p of ch.left){const pr=p.presence||{};const i=NET.seats.findIndex((s,k)=>k>0&&s.c===pr.cid);
      if(i>0&&!ch.peers.some(q=>q.presence&&q.presence.cid===pr.cid)){NET.seats.splice(i,1);lobbyChanged=true;}}
  }
  if(lobbyChanged){publishHost();saveHost();render();}
}
function hostStart(){
  const cs=canStart();if(!cs.ok)return;
  NET.started=true;NET.seen={};APP.lastResult=null;
  G=newGame(cs.playing.map(s=>s.n),NET.buyIn);G.cids=cs.playing.map(s=>s.c);
  NET.mySeat=G.cids.indexOf(CID);
  APP.screen="game";APP.sheet=null;changed();
}
function hostToLobby(){
  // back to the lobby to set a new pot; nobody pays for an unfinished game
  clearTimeout(timer);NET.started=false;G=null;V=null;APP.screen="lobby";APP.sheet=null;publishHost();saveHost();render();
}

/* ---------- online: guest ---------- */
async function joinGame(){
  const code=APP.joinCode.trim().toLowerCase();
  if(!/^[a-z0-9]{4}$/.test(code)){APP.err="Enter the 4-character code from the host's screen.";render();return;}
  if(!NET.room)return;
  APP.err="";

function seatStatus(v,p){

/* ================= Blackjack ================= */
const BJ_MIN=10, BJ_TOKENS=[[10,"#1f4fbf"],[50,"#b8501a"],[100,"#1a1a1a"]];
const bjVal=r=>r===1?1:Math.min(r,10);
function bjTotal(cards){let t=0,a=false;for(const c of cards){if(!c)continue;t+=bjVal(c[0]);if(c[0]===1)a=true;}return a&&t+10<=21?{t:t+10,soft:true}:{t,soft:false};}
function bjTotText(cards){const {t,soft}=bjTotal(cards);return soft&&t<21?`${t-10}/${t}`:`${t}`;}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function bjShoe(){const s=[];for(let d=0;d<6;d++)for(let su=0;su<4;su++)for(let r=1;r<=13;r++)s.push([r,su]);return shuffle(s);}
const money=n=>(n>0?"+":n<0?"−":"")+fmt(Math.abs(n));
let B=null,BV=null,prevBV=null,bjTimer=null;
const BNET={nr:null,code:"",info:{},seen:{},host:null,hostGone:false,connected:true,searchTimer:null,
  my:{bet:BJ_MIN,ready:null,n:0,acts:[],nonce:rid(6)}};

/* engine: runs on the same-phone device or on the host's phone */
function bjFreeColor(){const used=new Set(B.players.map(p=>p.color));return COLORS.find(c=>!used.has(c))||COLORS[0];}
function bjPlayer(name,cid){return{name,cid:cid||null,color:bjFreeColor(),bet:BJ_MIN,ready:false,inRound:false,hands:[],net:null,chips0:0};}
function bjNewTable(seats){
  clearTimeout(bjTimer);
  B={shoe:bjShoe(),seq:0,gid:rid(8),betId:rid(6),phase:"bet",dealer:[],hole:true,turn:null,toast:null,note:"",players:[]};
  seats.forEach(s=>{const p=bjPlayer(s.name,s.cid);p.bot=!!s.bot;B.players.push(p);});
  B.players.forEach((p,i)=>{if(p.bet>bjChips(i))p.bet=0;});
}
function bjChips(i){
  const p=B.players[i];
  if(APP.bj==="practice")return prChips(p.name);
  if(APP.bj==="local")return localChips.get(p.name);
  if(p.cid===CID)return wallet.get();
  const f=BNET.info[p.cid];return f&&Number.isFinite(f.ch)?f.ch:START_CHIPS;
}
function bjCanPlay(i){
  const p=B.players[i],ch=bjChips(i);
  if(p.bet<BJ_MIN||p.bet>ch)return false;
  if(APP.bj==="host"&&p.cid!==CID)return p.ready;
  return true;
}
function bjDraw(){if(!B.shoe.length)B.shoe=bjShoe();return B.shoe.pop();}
function bjDeal(){
  if(!B||B.phase!=="bet")return;
  const active=B.players.map((_,i)=>i).filter(bjCanPlay);
  if(!active.length)return;
  clearTimeout(bjTimer);
  if(B.shoe.length<78){B.shoe=bjShoe();B.toast={id:rid(5),text:"Fresh 6-deck shoe shuffled"};}else B.toast=null;
  B.gid=rid(8);B.dealer=[];B.hole=true;B.note="";
  B.players.forEach((p,i)=>{p.hands=[];p.net=null;p.inRound=active.includes(i);p.chips0=bjChips(i);});
  for(const i of active)B.players[i].hands=[{cards:[],bet:B.players[i].bet}];
  for(let k=0;k<2;k++){for(const i of active)B.players[i].hands[0].cards.push(bjDraw());B.dealer.push(bjDraw());}
  B.phase="play";
  for(const i of active){const h=B.players[i].hands[0];if(bjTotal(h.cards).t===21){h.done=true;h.natural=true;}}
  // dealer checks for blackjack when showing an Ace or a 10-value card
  if(bjTotal(B.dealer).t===21){bjResolve();return;}
  bjNext();
}
function bjCheck(h){const t=bjTotal(h.cards).t;if(t>21){h.bust=true;h.done=true;}else if(t===21)h.done=true;}
function bjOpts(){
  const t=B.turn;if(!t)return{dbl:false,spl:false};
  const pl=B.players[t.p],h=pl.hands[t.h],used=pl.hands.reduce((s,x)=>s+x.bet,0);
  const two=h.cards.length===2,room=used+h.bet<=pl.chips0;
  return{dbl:two&&room,spl:two&&room&&pl.hands.length<4&&bjVal(h.cards[0][0])===bjVal(h.cards[1][0])};
}
function bjAction(p,a,h){
  if(!B||B.phase!=="play"||!B.turn||B.turn.p!==p||B.turn.h!==h)return;
  const pl=B.players[p],hand=pl.hands[h],o=bjOpts();
  if(a==="hit"){hand.cards.push(bjDraw());bjCheck(hand);}
  else if(a==="stand"){hand.done=true;}
  else if(a==="double"){if(!o.dbl)return;hand.bet*=2;hand.cards.push(bjDraw());bjCheck(hand);hand.done=true;}
  else if(a==="split"){
    if(!o.spl)return;
    const [c1,c2]=hand.cards,aces=c1[0]===1;
    const h1={cards:[c1,bjDraw()],bet:hand.bet,split:true},h2={cards:[c2,bjDraw()],bet:hand.bet,split:true};
    for(const x of [h1,h2]){if(aces)x.done=true;else bjCheck(x);} // split Aces get one card each
    pl.hands.splice(h,1,h1,h2);
  }else return;
  bjNext();bjChanged();
}
function bjNext(){
  for(let p=0;p<B.players.length;p++){const pl=B.players[p];if(!pl.inRound)continue;
    for(let h=0;h<pl.hands.length;h++)if(!pl.hands[h].done){B.turn={p,h};return;}}
  B.turn=null;B.phase="dealer";B.hole=false;
  const live=B.players.some(p=>p.inRound&&p.hands.some(h=>!h.bust&&!h.natural));
  const step=()=>{
    if(!B)return;
    if(live&&bjTotal(B.dealer).t<17){B.dealer.push(bjDraw());bjChanged();bjTimer=setTimeout(step,750);}
    else{bjResolve();bjChanged();}
  };
  clearTimeout(bjTimer);bjTimer=setTimeout(step,750);
}
function bjResolve(){
  clearTimeout(bjTimer);
  B.phase="done";B.turn=null;B.hole=false;
  const d=bjTotal(B.dealer).t,dNat=B.dealer.length===2&&d===21,dBust=d>21;
  for(const p of B.players){
    if(!p.inRound)continue;let net=0;
    for(const h of p.hands){
      const t=bjTotal(h.cards).t;let r;
      if(dNat)r=h.natural?"push":"lose";
      else if(h.bust)r="bust";
      else if(h.natural)r="bj";
      else if(dBust||t>d)r="win";
      else if(t<d)r="lose";else r="push";
      h.result=r;h.pay=r==="bj"?h.bet*1.5:r==="win"?h.bet:r==="push"?0:-h.bet;net+=h.pay;
    }
    p.net=net;
  }
  B.note=dNat?"Dealer has blackjack":dBust?`Dealer busts with ${d}`:d>=17?`Dealer stands on ${d}`:`Dealer has ${d}`;
}
function bjNextHand(){
  if(!B||B.phase!=="done")return;
  clearTimeout(bjTimer);
  B.phase="bet";B.betId=rid(6);B.dealer=[];B.hole=true;B.turn=null;B.toast=null;B.note="";
  B.players.forEach((p,i)=>{p.hands=[];p.net=null;p.inRound=false;p.ready=false;
    const ch=bjChips(i);if(p.bet>ch)p.bet=Math.floor(ch/10)*10;});
  if(APP.bj==="host")B.players.forEach(p=>{const f=BNET.info[p.cid];if(f&&p.cid!==CID){p.bet=f.bet;p.ready=f.ready===B.betId;}});
  if(APP.bj==="practice")prBjBets();
  bjChanged();
}
function bjAddBet(i,v){
  if(!B||B.phase!=="bet"||!B.players[i])return;
  const p=B.players[i],ch=bjChips(i);
  if(v===0)p.bet=0;else if(p.bet+v<=ch)p.bet+=v;else return;
  bjChanged();
}
function bjView(){
  B.seq++;
  return{seq:B.seq,gid:B.gid,betId:B.betId,ph:B.phase,shoe:B.shoe.length,
    dl:B.hole&&B.dealer.length?[B.dealer[0],0]:B.dealer,
    turn:B.turn?{p:B.turn.p,h:B.turn.h,...bjOpts()}:null,toast:B.toast,note:B.note,tl:clockLeft(B.turnAt,B.turnMs),
    pl:B.players.map((p,i)=>({n:p.name,c:p.cid,col:p.color,bet:p.bet,rd:p.ready?1:0,in:p.inRound?1:0,ch:bjChips(i),net:p.net,
      h:p.hands.map(h=>{const o={c:h.cards,b:h.bet};if(h.natural)o.nat=1;if(h.result)o.r=h.result;if(h.pay!=null)o.p=h.pay;return o;})}))};
}
let bjTT=null,bjTK="";
function bjTurnTimer(){
  if(B.phase!=="play"||!B.turn){clearTimeout(bjTT);bjTK="";B.turnAt=null;B.turnMs=null;tmEnd(B);return;}
  const {p,h}=B.turn,key=`${B.gid}:${p}:${h}:${B.players[p].hands[h].cards.length}`;
  if(key===bjTK)return;
  bjTK=key;clearTimeout(bjTT);const ms=tmStart(B,p);if(!ms)return;
  bjTT=setTimeout(()=>{
    if(!B||bjTK!==key||!B.turn||B.turn.p!==p||B.turn.h!==h)return;
    B.toast={id:rid(5),text:`${B.players[p].name} ran out of time · auto-stand${tmOut(B)}`};bjAction(p,"stand",h);
  },ms);
}
function bjChanged(){
  if(!B)return;
  bjTurnTimer();
  BV=bjView();
  if(APP.bj==="host"&&BNET.nr){BNET.nr.presence({role:"host",game:"bj",hs:BNET.hs,code:BNET.code,cid:CID,v:BV}).catch(()=>{});
    lobbyAnnounce({g:"bj",code:BNET.code,name:myName(),n:B.players.length});}
  render();
  bjBotTick();
}
function bjSettle(){
  const v=BV;if(!v||v.ph!=="done"||settled(v.gid))return;
  if(APP.bj==="practice"){markSettled(v.gid);v.pl.forEach(p=>{if(p.in&&p.net)prSet(p.n,prChips(p.n)+p.net);});
    const me=v.pl[0];if(me&&me.in)gameDone("bj","pr",{gid:v.gid,win:me.net>0,nat:(me.h||[]).some(h=>h.nat)});setTimeout(bjChanged,0);return;}
  if(APP.bj==="local"){
    markSettled(v.gid);
    v.pl.forEach(p=>{if(p.in&&p.net)localChips.set(p.n,localChips.get(p.n)+p.net);});
    return;
  }
  const me=v.pl.find(p=>p.c===CID);if(!me||!me.in||me.net==null)return;
  markSettled(v.gid);
  wallet.set(wallet.get()+me.net);
  stHand("bj",me.net);gameDone("bj","on",{gid:v.gid,win:me.net>0,net:me.net,nat:(me.h||[]).some(h=>h.nat),with:(v.pl||[]).filter(q=>q!==me&&q.n&&!/^Bot /.test(q.n)).map(q=>q.n)});stSet(s=>{if(me.net>0){s.bj.cur++;s.bj.best=Math.max(s.bj.best,s.bj.cur);}else if(me.net<0)s.bj.cur=0;});
  if(APP.bj==="client")BNET.nr?.presence({chips:wallet.get()}).catch(()=>{});
  else setTimeout(bjChanged,0);

function bjStop(){clearTimeout(bjTimer);clearTimeout(bjTT);bjTK="";B=null;BV=null;prevBV=null;}

/* online: host */
async function bjHost(){
  if(!NET.room)return;
  APP.err="";const code=rid(4);let nr;
  try{nr=await NET.room.join("bj-"+code);}catch(e){APP.err="Couldn't open a table. Try again in a moment.";render();return;}
  BNET.nr=nr;APP.bj="host";BNET.code=code;BNET.info={};BNET.seen={};BNET.connected=true;BNET.hs=Date.now();
  bjNewTable([{name:APP.myName.trim()||"Host",cid:CID}]);
  nr.onConnection(c=>{BNET.connected=c;render();},()=>{BNET.connected=false;render();});
  BNET.unsub=nr.onPeers(bjOnPeersHost);
  prevBV=null;APP.screen="bj-table";APP.sheet=null;bjChanged();
}
function bjOnPeersHost(ch){
  if(!B||dupHost("bj",ch))return;
  let dirty=false;const here=new Set();
  for(const peer of ch.peers){
    if(peer.sameTab)continue;
    const pr=peer.presence||{};
    if(typeof pr.cid!=="string"||pr.cid===CID||pr.role==="host"||pr.game!=="bj")continue;
    here.add(pr.cid);
    const name=String(pr.name||"Player").slice(0,14);
    const bet=Number.isFinite(pr.bet)?Math.max(0,Math.floor(pr.bet/10)*10):0;
    const f={ch:Number.isFinite(pr.chips)?pr.chips:START_CHIPS,bet,ready:typeof pr.ready==="string"?pr.ready:null};
    const old=BNET.info[pr.cid];if(!old||old.ch!==f.ch)dirty=true;
    BNET.info[pr.cid]=f;
    let i=B.players.findIndex(x=>x.cid===pr.cid);
    if(i<0&&B.players.length<6){B.players.push(bjPlayer(name,pr.cid));i=B.players.length-1;dirty=true;}
    if(i<0)continue;
    const pl=B.players[i];
    if(pl.name!==name){pl.name=name;dirty=true;}
    if(B.phase==="bet"){const rd=f.ready===B.betId;if(pl.bet!==bet||pl.ready!==rd){pl.bet=bet;pl.ready=rd;dirty=true;}}
    const key=pr.cid+":"+pr.nonce,seen=BNET.seen[key]||0;let max=seen;
    if(Array.isArray(pr.acts))for(const a of pr.acts){
      if(!a||!(a.n>seen))continue;max=Math.max(max,a.n);
      if(a.g===B.gid)bjAction(i,a.a,a.h);
    }
    BNET.seen[key]=max;
  }
  if(B.phase==="bet"){
    const before=B.players.length;
    B.players=B.players.filter(p=>p.cid===CID||here.has(p.cid));
    if(B.players.length!==before)dirty=true;
  }
  if(dirty)bjChanged();
}

  BNET.nr=nr;APP.bj="client";BNET.code=code;BNET.host=null;BNET.hostGone=false;BNET.connected=true;BV=null;prevBV=null;B=null;
  BNET.my={bet:wallet.get()>=BJ_MIN?BJ_MIN:0,ready:null,n:0,acts:[],nonce:rid(6)};

function bjOnPeersClient(ch){

function bjGuestBet(v){

function bjGuestLock(){

function bjBox(v,i,mine,pv){

/* ================= Baccarat ================= */
const BC_MIN=10, BC_SIDES={player:["Player","1:1"],tie:["Tie","8:1"],banker:["Banker","0.95:1"]};
const bcVal=r=>r>=10?0:r;
const bcTot=cards=>cards.reduce((s,c)=>s+bcVal(c[0]),0)%10;
function bcShoe(){const s=[];for(let d=0;d<8;d++)for(let su=0;su<4;su++)for(let r=1;r<=13;r++)s.push([r,su]);return shuffle(s);}
let C=null,CVw=null,prevCV=null,bcTimer=null;
const CNET={nr:null,code:"",info:{},host:null,hostGone:false,connected:true,searchTimer:null,my:{bet:BC_MIN,side:"player",ready:null}};

/* engine */
function bcFreeColor(){const used=new Set(C.players.map(p=>p.color));return COLORS.find(c=>!used.has(c))||COLORS[0];}
function bcPlayer(name,cid){return{name,cid:cid||null,color:bcFreeColor(),bet:BC_MIN,side:"player",ready:false,inRound:false,net:null};}
function bcNewTable(seats){
  clearTimeout(bcTimer);
  C={shoe:bcShoe(),seq:0,gid:rid(8),betId:rid(6),phase:"bet",order:[],shown:0,natural:false,winner:null,result:null,history:[],toast:null,players:[]};
  seats.forEach(s=>{const p=bcPlayer(s.name,s.cid);p.bot=!!s.bot;C.players.push(p);});
  C.players.forEach((p,i)=>{if(p.bet>bcChips(i))p.bet=0;});
}
function bcChips(i){
  const p=C.players[i];
  if(APP.bc==="practice")return prChips(p.name);
  if(APP.bc==="local")return localChips.get(p.name);
  if(p.cid===CID)return wallet.get();
  const f=CNET.info[p.cid];return f&&Number.isFinite(f.ch)?f.ch:START_CHIPS;
}
function bcCanPlay(i){
  const p=C.players[i],ch=bcChips(i);
  if(!BC_SIDES[p.side]||p.bet<BC_MIN||p.bet>ch)return false;
  if(APP.bc==="host"&&p.cid!==CID)return p.ready;
  return true;
}
function bcDraw(){if(!C.shoe.length)C.shoe=bcShoe();return C.shoe.pop();}
function bcDeal(){
  if(!C||C.phase!=="bet")return;
  const active=C.players.map((_,i)=>i).filter(bcCanPlay);
  if(!active.length)return;
  if(C.shoe.length<60){C.shoe=bcShoe();C.toast={id:rid(5),text:"Fresh 8-deck shoe shuffled"};}else C.toast=null;
  C.gid=rid(8);
  C.players.forEach((p,i)=>{p.inRound=active.includes(i);p.net=null;});
  const P=[bcDraw()],K=[bcDraw()];P.push(bcDraw());K.push(bcDraw());
  const order=[["p",P[0]],["b",K[0]],["p",P[1]],["b",K[1]]];
  let pt=bcTot(P),bt=bcTot(K);
  const natural=pt>=8||bt>=8;
  if(!natural){
    let p3=null;
    if(pt<=5){p3=bcDraw();P.push(p3);order.push(["p",p3]);}  // Player draws on 0–5, stands on 6–7
    let draw;
    if(p3===null)draw=bt<=5;                                   // Player stood: Banker uses the same rule
    else{const v=bcVal(p3[0]);
      draw=bt<=2||(bt===3&&v!==8)||(bt===4&&v>=2&&v<=7)||(bt===5&&v>=4&&v<=7)||(bt===6&&(v===6||v===7));}
    if(draw){const c=bcDraw();K.push(c);order.push(["b",c]);}
    pt=bcTot(P);bt=bcTot(K);
  }
  C.order=order;C.shown=0;C.natural=natural;C.winner=null;C.phase="deal";
  C.result={p:pt,b:bt,w:pt>bt?"player":bt>pt?"banker":"tie"};
  const step=()=>{
    if(!C)return;
    C.shown++;
    if(C.shown<C.order.length){bcChanged();bcTimer=setTimeout(step,C.shown<4?500:950);}
    else{bcFinish();bcChanged();}
  };
  clearTimeout(bcTimer);bcTimer=setTimeout(step,350);
}
function bcPay(side,bet,w){
  if(w==="tie")return side==="tie"?8*bet:0;           // Player and Banker bets push on a tie
  if(side!==w)return -bet;
  return w==="banker"?Math.floor(bet*0.95):bet;       // 5% commission on Banker wins, rounded down
}
function bcFinish(){
  const r=C.result;C.phase="done";C.winner=r.w;
  for(const p of C.players)if(p.inRound)p.net=bcPay(p.side,p.bet,r.w);
  C.explain=bcExplain();
  C.history.push({w:r.w[0],t:r.w==="banker"?r.b:r.p});
  if(C.history.length>40)C.history.shift();
}
function bcNextHand(){
  if(!C||C.phase!=="done")return;
  clearTimeout(bcTimer);
  C.phase="bet";C.betId=rid(6);C.order=[];C.shown=0;C.winner=null;C.toast=null;
  C.players.forEach((p,i)=>{p.inRound=false;p.net=null;p.ready=false;const ch=bcChips(i);if(p.bet>ch)p.bet=Math.floor(ch/10)*10;});
  if(APP.bc==="host")C.players.forEach(p=>{const f=CNET.info[p.cid];if(f&&p.cid!==CID){p.bet=f.bet;p.side=f.side;p.ready=f.ready===C.betId;}});
  if(APP.bc==="practice")prBcBets();
  bcChanged();
}
function bcSetBet(i,v){
  if(!C||C.phase!=="bet"||!C.players[i])return;
  const p=C.players[i],ch=bcChips(i);
  if(v===0)p.bet=0;else if(p.bet+v<=ch)p.bet+=v;else return;
  bcChanged();
}
function bcSetSide(i,s){if(!C||C.phase!=="bet"||!C.players[i]||!BC_SIDES[s])return;C.players[i].side=s;bcChanged();}
function bcView(){
  C.seq++;
  const vis=C.order.slice(0,C.shown);
  return{seq:C.seq,gid:C.gid,betId:C.betId,ph:C.phase,shoe:C.shoe.length,
    P:vis.filter(x=>x[0]==="p").map(x=>x[1]),B:vis.filter(x=>x[0]==="b").map(x=>x[1]),
    win:C.phase==="done"?C.winner:null,nat:C.phase==="done"&&C.natural?1:0,hist:C.history.slice(-30),toast:C.toast,
    ex:C.phase==="done"&&APP.bc==="practice"?C.explain:"",
    pl:C.players.map((p,i)=>({n:p.name,c:p.cid,col:p.color,bet:p.bet,s:p.side,rd:p.ready?1:0,in:p.inRound?1:0,ch:bcChips(i),net:p.net}))};
}
function bcChanged(){
  if(!C)return;
  CVw=bcView();
  if(APP.bc==="host"&&CNET.nr){CNET.nr.presence({role:"host",game:"bc",hs:CNET.hs,code:CNET.code,cid:CID,v:CVw}).catch(()=>{});
    lobbyAnnounce({g:"bc",code:CNET.code,name:myName(),n:C.players.length});}
  render();
}
function bcSettle(){
  const v=CVw;if(!v||v.ph!=="done"||settled(v.gid))return;
  if(APP.bc==="practice"){markSettled(v.gid);v.pl.forEach(p=>{if(p.in&&p.net)prSet(p.n,prChips(p.n)+p.net);});
    const me=v.pl[0];if(me&&me.in)gameDone("bc","pr",{gid:v.gid,win:me.net>0});setTimeout(bcChanged,0);return;}
  if(APP.bc==="local"){markSettled(v.gid);v.pl.forEach(p=>{if(p.in&&p.net)localChips.set(p.n,localChips.get(p.n)+p.net);});return;}
  const me=v.pl.find(p=>p.c===CID);if(!me||!me.in||me.net==null)return;
  markSettled(v.gid);wallet.set(wallet.get()+me.net);stHand("bc",me.net);gameDone("bc","on",{gid:v.gid,win:me.net>0,net:me.net,with:(v.pl||[]).filter(q=>q!==me&&q.n&&!/^Bot /.test(q.n)).map(q=>q.n)});
  if(APP.bc==="client")CNET.nr?.presence({chips:wallet.get()}).catch(()=>{});
  else setTimeout(bcChanged,0);
}
function bcStop(){clearTimeout(bcTimer);C=null;CVw=null;prevCV=null;}

/* online */
async function bcHost(){
  if(!NET.room)return;
  APP.err="";const code=rid(4);let nr;
  try{nr=await NET.room.join("bc-"+code);}catch(e){APP.err="Couldn't open a table. Try again in a moment.";render();return;}
  CNET.nr=nr;APP.bc="host";CNET.code=code;CNET.info={};CNET.connected=true;CNET.hs=Date.now();
  bcNewTable([{name:APP.myName.trim()||"Host",cid:CID}]);
  nr.onConnection(c=>{CNET.connected=c;render();},()=>{CNET.connected=false;render();});
  CNET.unsub=nr.onPeers(bcOnPeersHost);
  prevCV=null;APP.screen="bc-table";APP.sheet=null;bcChanged();
}
function bcOnPeersHost(ch){
  if(!C||dupHost("bc",ch))return;
  let dirty=false;const here=new Set();
  for(const peer of ch.peers){
    if(peer.sameTab)continue;
    const pr=peer.presence||{};
    if(typeof pr.cid!=="string"||pr.cid===CID||pr.role==="host"||pr.game!=="bc")continue;
    here.add(pr.cid);
    const name=String(pr.name||"Player").slice(0,14);
    const f={ch:Number.isFinite(pr.chips)?pr.chips:START_CHIPS,bet:Number.isFinite(pr.bet)?Math.max(0,Math.floor(pr.bet/10)*10):0,
      side:BC_SIDES[pr.side]?pr.side:"player",ready:typeof pr.ready==="string"?pr.ready:null};
    const old=CNET.info[pr.cid];if(!old||old.ch!==f.ch)dirty=true;
    CNET.info[pr.cid]=f;
    let i=C.players.findIndex(x=>x.cid===pr.cid);
    if(i<0&&C.players.length<6){C.players.push(bcPlayer(name,pr.cid));i=C.players.length-1;dirty=true;}
    if(i<0)continue;
    const pl=C.players[i];
    if(pl.name!==name){pl.name=name;dirty=true;}
    if(C.phase==="bet"){const rd=f.ready===C.betId;
      if(pl.bet!==f.bet||pl.side!==f.side||pl.ready!==rd){pl.bet=f.bet;pl.side=f.side;pl.ready=rd;dirty=true;}}
  }
  if(C.phase==="bet"){const before=C.players.length;C.players=C.players.filter(p=>p.cid===CID||here.has(p.cid));if(C.players.length!==before)dirty=true;}
  if(dirty)bcChanged();
}
async function bcJoin(){
  const code=APP.joinCode.trim().toLowerCase();
  if(!/^[a-z0-9]{4}$/.test(code)){APP.err="Enter the 4-character code from the host's screen.";render();return;}
  if(!NET.room)return;
  APP.err="";let nr;
  try{nr=await NET.room.join("bc-"+code);}catch(e){APP.err="Couldn't reach that table. Check the code and try again.";render();return;}
  CNET.nr=nr;APP.bc="client";CNET.code=code;CNET.host=null;CNET.hostGone=false;CNET.connected=true;CVw=null;prevCV=null;C=null;

/* ================= Jacks or Better (9/6 video poker) ================= */
const JB_ROWS=[["royal","Royal Flush",250],["sf","Straight Flush",50],["quads","Four of a Kind",25],["fh","Full House",9],["flush","Flush",6],
  ["straight","Straight",4],["trips","Three of a Kind",3],["twopair","Two Pair",2],["jacks","Jacks or Better",1]];
const JB_NAME=Object.fromEntries(JB_ROWS.map(r=>[r[0],r[1]]));
const jbPay=(k,c)=>k==="royal"?(c===5?4000:250*c):JB_ROWS.find(r=>r[0]===k)[2]*c;
const hv=r=>r===1?14:r;
const jbDeck=()=>{const d=[];for(let s=0;s<4;s++)for(let r=1;r<=13;r++)d.push([r,s]);return shuffle(d);};
let J=null;
function jbEval(cs){
  const rs=cs.map(c=>hv(c[0])).sort((a,b)=>a-b),flush=cs.every(c=>c[1]===cs[0][1]);
  const cnt={};rs.forEach(r=>cnt[r]=(cnt[r]||0)+1);
  const g=Object.values(cnt).sort((a,b)=>b-a);
  const straight=g.length===5&&(rs[4]-rs[0]===4||rs.join()==="2,3,4,5,14");
  if(straight&&flush)return rs[0]===10?"royal":"sf";
  if(g[0]===4)return"quads";
  if(g[0]===3&&g[1]===2)return"fh";
  if(flush)return"flush";
  if(straight)return"straight";
  if(g[0]===3)return"trips";
  if(g[0]===2&&g[1]===2)return"twopair";
  if(g[0]===2&&+Object.keys(cnt).find(k=>cnt[k]===2)>=11)return"jacks";
  return null;
}
/* Simple 9/6 strategy, in priority order (within a fraction of a percent of perfect play) */
function jbAdvice(cs){
  const idx=[0,1,2,3,4],ev=jbEval(cs),R=i=>hv(cs[i][0]),S=i=>cs[i][1];
  const plural=r=>({11:"Jacks",12:"Queens",13:"Kings",14:"Aces"}[r]||r+"s");
  const bySuit=s=>idx.filter(i=>S(i)===s),royalOf=s=>bySuit(s).filter(i=>R(i)>=10);
  const byRank={};idx.forEach(i=>(byRank[R(i)]=byRank[R(i)]||[]).push(i));
  if(["royal","sf","quads","fh"].includes(ev))return{hold:idx,why:`${JB_NAME[ev]}! Hold all five.`};
  for(let s=0;s<4;s++){const r=royalOf(s);if(r.length===4)return{hold:r,why:"Four to a royal flush. Break up anything else and go for it."};}
  if(ev==="straight"||ev==="flush")return{hold:idx,why:`A ${JB_NAME[ev].toLowerCase()} already pays. Hold all five.`};
  if(ev==="trips")return{hold:Object.values(byRank).find(a=>a.length===3),why:"Hold the three of a kind and draw two. It could become a full house or four of a kind."};
  if(ev==="twopair")return{hold:Object.values(byRank).filter(a=>a.length===2).flat(),why:"Hold both pairs and draw one for a shot at a full house."};
  const pairs=Object.entries(byRank).filter(([,a])=>a.length===2);
  const hi=pairs.find(([r])=>+r>=11);
  if(hi)return{hold:hi[1],why:`Hold the pair of ${plural(+hi[0])}. It already pays your bet back and can improve.`};
  for(let s=0;s<4;s++){const r=royalOf(s);if(r.length===3)return{hold:r,why:"Three to a royal flush. That beats a four-card flush or a low pair here."};}
  for(let s=0;s<4;s++){const f=bySuit(s);if(f.length===4)return{hold:f,why:"Four to a flush. 9 of the 47 cards left complete it."};}
  if(pairs.length)return{hold:pairs[0][1],why:`Hold the pair of ${plural(+pairs[0][0])}. A low pair doesn't pay, but it can become two pair or three of a kind.`};
  for(let lo=2;lo<=10;lo++)if([0,1,2,3].every(k=>byRank[lo+k]))
    return{hold:[0,1,2,3].map(k=>byRank[lo+k][0]),why:"Four in a row, open at both ends. Eight cards complete the straight."};
  const high=idx.filter(i=>R(i)>=11).sort((a,b)=>R(a)-R(b));
  for(let s=0;s<4;s++){const h=high.filter(i=>S(i)===s);if(h.length>=2)return{hold:h.slice(0,2),why:"Two suited high cards. They can pair up, or grow into a flush or royal."};}
  for(let s=0;s<4;s++){const f=bySuit(s);if(f.length===3){
    const span=v=>Math.max(...v)-Math.min(...v),hiR=f.map(R),loR=hiR.map(r=>r===14?1:r);
    if(span(hiR)<=4||span(loR)<=4)return{hold:f,why:"Three to a straight flush. Small odds, big payout."};}}
  if(high.length>=2)return{hold:high.slice(0,2),why:high.length>2?"With three or more high cards in different suits, keep the lowest two. They leave more ways to make a straight.":"Two high cards. Pairing either one pays your bet back."};
  const ten=idx.find(i=>R(i)===10);
  if(ten!=null){const m=high.find(i=>S(i)===S(ten)&&R(i)<=13);if(m!=null)return{hold:[ten,m],why:"A suited 10 with a J, Q, or K keeps royal and straight flush chances alive."};}
  if(high.length===1)return{hold:high,why:"One high card. Pairing it pays your bet back."};
  return{hold:[],why:"Nothing worth keeping. Draw five new cards."};

/* ================= Texas Hold'em (no-limit) ================= */
const HM_BLINDS=[[5,10],[10,20],[25,50]];
const HM_CATS=["High Card","One Pair","Two Pair","Three of a Kind","Straight","Flush","Full House","Four of a Kind","Straight Flush"];
const HM_STREETS=["Pre-flop","Flop","Turn","River"];
const rn=r=>({14:"Ace",13:"King",12:"Queen",11:"Jack"}[r]||String(r));
const rp=r=>({14:"Aces",13:"Kings",12:"Queens",11:"Jacks"}[r]||r+"s");
function rank5(cs){
  const rs=cs.map(c=>hv(c[0])).sort((a,b)=>b-a),flush=cs.every(c=>c[1]===cs[0][1]);
  const cnt={};rs.forEach(r=>cnt[r]=(cnt[r]||0)+1);
  const g=Object.entries(cnt).map(([r,n])=>[n,+r]).sort((a,b)=>b[0]-a[0]||b[1]-a[1]);
  let sh=0;if(g.length===5){if(rs[0]-rs[4]===4)sh=rs[0];else if(rs[0]===14&&rs[1]===5)sh=5;}
  let cat,ks;
  if(sh&&flush){cat=8;ks=[sh];}
  else if(g[0][0]===4){cat=7;ks=[g[0][1],g[1][1]];}
  else if(g[0][0]===3&&g[1][0]===2){cat=6;ks=[g[0][1],g[1][1]];}
  else if(flush){cat=5;ks=rs;}
  else if(sh){cat=4;ks=[sh];}
  else{cat=g[0][0]===3?3:g[0][0]===2&&g[1][0]===2?2:g[0][0]===2?1:0;ks=g.map(x=>x[1]);}
  let s=cat;for(let i=0;i<5;i++)s=s*15+(ks[i]||0);return s;
}
/* fast 6/7-card scorer: same score as trying every 5-card hand, without building 21 hands */
function fastScore(cs){
  const cnt=new Array(15).fill(0),sc=[0,0,0,0],sm=[0,0,0,0];let mask=0;
  for(const c of cs){const r=c[0]===1?14:c[0];cnt[r]++;sc[c[1]]++;sm[c[1]]|=1<<r;mask|=1<<r;}
  const pack=(cat,ks)=>{let s=cat;for(let i=0;i<5;i++)s=s*15+(ks[i]||0);return s;};
  const straight=m=>{if(m&(1<<14))m|=2;for(let h=14;h>=5;h--){const run=31<<(h-4);if((m&run)===run)return h;}return 0;};
  let fs=-1;for(let k=0;k<4;k++)if(sc[k]>=5)fs=k;
  if(fs>=0){const sh=straight(sm[fs]);if(sh)return pack(8,[sh]);}
  const quads=[],trips=[],pairs=[],singles=[];
  for(let r=14;r>=2;r--){const n=cnt[r];if(n===4)quads.push(r);else if(n===3)trips.push(r);else if(n===2)pairs.push(r);else if(n===1)singles.push(r);}
  const topOther=ex=>{for(let r=14;r>=2;r--)if(cnt[r]&&!ex.includes(r))return r;return 0;};
  if(quads.length)return pack(7,[quads[0],topOther([quads[0]])]);
  if(trips.length&&(trips.length>1||pairs.length)){const t=trips[0],pr=Math.max(trips[1]||0,pairs[0]||0);return pack(6,[t,pr]);}
  if(fs>=0){const ks=[];for(let r=14;r>=2&&ks.length<5;r--)if(sm[fs]&(1<<r))ks.push(r);return pack(5,ks);}
  const sh=straight(mask);if(sh)return pack(4,[sh]);
  const rest=ex=>{const o=[];for(let r=14;r>=2;r--)if(cnt[r]&&!ex.includes(r))o.push(r);return o;};
  if(trips.length){const t=trips[0];return pack(3,[t,...rest([t]).slice(0,2)]);}
  if(pairs.length>=2){const a=pairs[0],b=pairs[1];return pack(2,[a,b,rest([a,b])[0]]);}
  if(pairs.length){const a=pairs[0];return pack(1,[a,...rest([a]).slice(0,3)]);}
  return pack(0,rest([]).slice(0,5));
}
function bestScore(cs){
  const n=cs.length;if(n===5)return rank5(cs);
  if(n>5)return fastScore(cs);
  let b=0;
  if(n===6){for(let i=0;i<6;i++){const s=rank5(cs.filter((_,k)=>k!==i));if(s>b)b=s;}return b;}
  for(let i=0;i<7;i++)for(let j=i+1;j<7;j++){const s=rank5(cs.filter((_,k)=>k!==i&&k!==j));if(s>b)b=s;}
  return b;
}
function hmBest(cs){
  const s=bestScore(cs),d=[];let x=s;for(let i=0;i<5;i++){d.unshift(x%15);x=Math.floor(x/15);}
  const cat=x;let name;
  switch(cat){
    case 8:name=d[0]===14?"Royal Flush":`Straight Flush, ${rn(d[0])} high`;break;
    case 7:name=`Four ${rp(d[0])}`;break;
    case 6:name=`Full House, ${rp(d[0])} over ${rp(d[1])}`;break;
    case 5:name=`Flush, ${rn(d[0])} high`;break;
    case 4:name=`Straight, ${rn(d[0])} high`;break;
    case 3:name=`Three ${rp(d[0])}`;break;
    case 2:name=`Two Pair, ${rp(d[0])} and ${rp(d[1])}`;break;
    case 1:name=`Pair of ${rp(d[0])}`;break;
    default:name=`${rn(d[0])} high`;
  }
  return{score:s,cat,name};
}
function hmStartName(h){
  const a=hv(h[0][0]),b=hv(h[1][0]);
  if(a===b)return`Pocket ${rp(a)}`;
  const hi=Math.max(a,b),lo=Math.min(a,b);
  return`${rn(hi)}-${rn(lo)}${h[0][1]===h[1][1]?" suited":""}`;

function hmEquity(hole,board,nOpp,iters){
  const known=new Set([...hole,...board].map(c=>c[0]*4+c[1]));
  const deck=[];for(let s=0;s<4;s++)for(let r=1;r<=13;r++)if(!known.has(r*4+s))deck.push([r,s]);
  const need=5-board.length,take=need+2*nOpp;let win=0;
  for(let t=0;t<iters;t++){
    for(let k=0;k<take;k++){const j=k+Math.floor(Math.random()*(deck.length-k));const tmp=deck[k];deck[k]=deck[j];deck[j]=tmp;}
    const b=board.concat(deck.slice(0,need));
    const me=bestScore(hole.concat(b));let best=0,ties=0;
    for(let o=0;o<nOpp;o++){const s=bestScore([deck[need+2*o],deck[need+2*o+1]].concat(b));if(s>best){best=s;ties=0;}if(s===best)ties++;}
    if(me>best)win++;else if(me===best)win+=1/(ties+1);
  }
  return win/iters;
}

/* hole-card privacy for online play: each guest shares a public key; the host encrypts that guest's two cards for them alone */
const b64=buf=>{let s="";new Uint8Array(buf).forEach(b=>s+=String.fromCharCode(b));return btoa(s);};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));

async function ecKeys(){const kp=await crypto.subtle.generateKey({name:"ECDH",namedCurve:"P-256"},false,["deriveKey"]);return{kp,pub:b64(await crypto.subtle.exportKey("raw",kp.publicKey))};}
async function ecShared(kp,pub){const pk=await crypto.subtle.importKey("raw",unb64(pub),{name:"ECDH",namedCurve:"P-256"},false,[]);
  return crypto.subtle.deriveKey({name:"ECDH",public:pk},kp.privateKey,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);}
async function aesEnc(key,obj){const iv=crypto.getRandomValues(new Uint8Array(12));
  return b64(iv)+"."+b64(await crypto.subtle.encrypt({name:"AES-GCM",iv},key,new TextEncoder().encode(JSON.stringify(obj))));}
async function aesDec(key,s){const [iv,ct]=s.split(".").map(unb64);return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv},key,ct)));}

function hmOpts(i){

function hmFinish(){
  clearTimeout(hmTimer);
  H.phase="done";H.turn=-1;H.runout=false;H.players.forEach(p=>p.bet=0);
  const inH=H.players.filter(p=>p.inHand),live=inH.filter(p=>!p.folded),n=H.players.length;
  const dist=p=>((H.players.indexOf(p)-H.button+n-1)%n);   // seats left of the button come first for odd chips
  const res=[];
  if(live.length===1){
    const w=live[0],pot=inH.reduce((s,p)=>s+p.total,0);w.stack+=pot;H.showdown=false;
    res.push({w:[w.name],amt:pot,hand:null});
  }else{
    H.showdown=true;

    let prev=0;

      let pot=0;inH.forEach(p=>pot+=Math.max(0,Math.min(p.total,lv)-prev));
      if(pot>0){
        let elig=live.filter(p=>p.total>=lv);
        if(!elig.length){const mx=Math.max(...live.map(p=>p.total));elig=live.filter(p=>p.total===mx);}
        const top=Math.max(...elig.map(p=>p.best.score));
        const ws=elig.filter(p=>p.best.score===top).sort((a,b)=>dist(a)-dist(b));
        const share=Math.floor(pot/ws.length);let rem=pot-share*ws.length;

  H.results=res.map(({w,amt,hand})=>({w,amt,hand}));
  if(APP.hm==="host")inH.forEach(p=>{if(p.cid&&p.cid!==CID){const f=HNET.info[p.cid]||(HNET.info[p.cid]={});f.ch=p.stack;}});
}

/* bots and coach */
function hmEasyStrength(hole,board){
  if(board.length<3){const a=hv(hole[0][0]),b=hv(hole[1][0]);return a===b?.55+a/40:(a+b)/40+(hole[0][1]===hole[1][1]?.05:0);}
  const c=hmBest([...hole,...board]).cat;return c===0?.15:c===1?.45:c===2?.7:.9;
}
function hmBotMove(i){
  const p=H.players[i],o=hmOpts(i),pot=hmPot(),d=PR.diff,r=Math.random();
  const opp=Math.max(1,H.players.filter((q,j)=>j!==i&&q.inHand&&!q.folded).length);
  const sizeTo=f=>Math.max(o.minTo,Math.min(o.maxTo,H.curBet+Math.round(f*(pot+o.toCall)/H.sb)*H.sb));
  const need=o.toCall/(pot+o.toCall||1);
  if(d==="easy"){
    const s=hmEasyStrength(p.hole,H.board);
    if(o.toCall===0)return o.canRaise&&s>.7&&r<.4?["raise",sizeTo(.5)]:["check"];
    if(o.toCall>=p.stack*.5&&s<.5&&r<.6)return["fold"];
    if(s<.25&&o.toCall>H.bb*4&&r<.5)return["fold"];
    return o.canRaise&&s>.85&&r<.3?["raise",sizeTo(.6)]:["call"];
  }
  const eq=hmEquity(p.hole,H.board,opp,d==="hard"?300:150);
  if(d==="medium"){
    if(o.toCall===0){if(o.canRaise&&(eq>.62||r<.05))return["raise",sizeTo(.55)];return["check"];}
    if(o.canRaise&&eq>.78)return["raise",sizeTo(.75)];
    return eq>need+.04||(eq>need-.04&&r<.3)?["call"]:["fold"];
  }
  const vt=opp>=3?.5:opp===2?.58:.65;
  if(o.toCall===0){
    if(o.canRaise&&eq>vt)return["raise",sizeTo(r<.5?.6:.8)];
    if(o.canRaise&&H.street>=1&&opp<=2&&r<.12)return["raise",sizeTo(.5)];
    return["check"];
  }
  if(o.canRaise&&eq>vt+.15)return["raise",sizeTo(.8)];
  if(eq>need+.02)return["call"];
  if(o.canRaise&&H.street>=1&&opp===1&&r<.04)return["raise",sizeTo(.9)];
  return["fold"];
}
function hmBotTick(){
  if(APP.hm!=="practice"||!H||H.phase!=="hand"||H.runout||H.turn<0)return;
  const i=H.turn;if(!H.players[i].bot)return;
  const key="h"+H.gid+":"+H.actN;if(PR.keys[key])return;PR.keys[key]=1;
  prTimer(()=>{if(!H||H.phase!=="hand"||H.turn!==i)return;const [a,amt]=hmBotMove(i);hmAct(i,a,amt);},800+Math.random()*700);
}
function hmGoneTick(){
  if(APP.hm!=="host"||!H||H.phase!=="hand"||H.runout||H.turn<0||!H.players[H.turn].gone)return;
  const i=H.turn,key=H.gid+":"+H.actN;if(HNET.goneKey===key)return;HNET.goneKey=key;
  setTimeout(()=>{if(H&&H.phase==="hand"&&H.turn===i&&H.players[i].gone)hmAct(i,"fold");},2000);
}
function hmCoach(v){
  if(APP.hm!=="practice"||!PR.coach)return"";
  const me=v.pl[0];if(!me||!me.in||me.f||!me.h||v.ph!=="hand")return"";
  const {eq,opp}=hmEq(v,me.h);
  const made=v.board.length>=3?hmBest([...me.h,...v.board]).name:hmStartName(me.h);
  let adv="";
  if(v.turn===0&&v.opt){
    const o=v.opt,need=o.toCall/(v.pot+o.toCall);
    if(o.toCall===0)adv=eq>.6&&o.canRaise?" <b>Bet</b> about half to three-quarters of the pot. You're likely ahead.":eq>.45?" <b>Check</b> or make a small bet. It's close.":" <b>Check</b> and see the next card for free.";
    else if(eq>.7&&o.canRaise)adv=" <b>Raise.</b> You're a strong favorite.";
    else if(eq>=need)adv=` <b>Call.</b> You need ${pct(need)} to break even and have about ${pct(eq)}.`;
    else adv=` <b>Fold.</b> You need ${pct(need)} to break even but have about ${pct(eq)}.`;
  }
  return`<div class="coach"><b>${esc(made)}</b> · about ${pct(eq)} to win against ${opp} ${opp===1?"player":"players"}.${adv}</div>`;
}

async function hmDerive(cid){
  const f=HNET.info[cid];if(!f||!f.pub||!HNET.ec)return;
  const pub=f.pub;

}
async function hmEncryptAll(){

function hmOnPeersHost(ch){
  if(!H||dupHost("hm",ch))return;
  let dirty=false;const here=new Set();
  for(const peer of ch.peers){
    if(peer.sameTab)continue;
    const pr=peer.presence||{};
    if(typeof pr.cid!=="string"||pr.cid===CID||pr.role==="host"||pr.game!=="hm")continue;
    here.add(pr.cid);

    if(i<0)continue;
    const pl=H.players[i];
    if(pl.name!==name){pl.name=name;dirty=true;}
    if(pl.sit!==!!pr.sit){pl.sit=!!pr.sit;dirty=true;}
    if(pl.gone){pl.gone=false;dirty=true;}
    const key=pr.cid+":"+pr.nonce,seen=HNET.seen[key]||0;let max=seen;
    if(Array.isArray(pr.acts))for(const a of pr.acts){
      if(!a||!(a.n>seen))continue;max=Math.max(max,a.n);

  }
  H.players.forEach(p=>{if(p.cid&&p.cid!==CID&&!here.has(p.cid)&&!p.gone){p.gone=true;dirty=true;}});

  }

function rmRunOrder(cards){
  if(cards.length<3)return null;
  const s=cards[0][1];if(!cards.every(c=>c[1]===s))return null;
  for(const aceHigh of [false,true]){            // Ace is low (A-2-3) or high (Q-K-A), never both: no wrapping
    const v=c=>c[0]===1&&aceHigh?14:c[0];
    const sorted=[...cards].sort((a,b)=>v(a)-v(b));
    let ok=true;for(let i=1;i<sorted.length;i++)if(v(sorted[i])!==v(sorted[i-1])+1){ok=false;break;}
    if(ok)return sorted;
  }
  return null;
}
function rmMeldType(cards){
  if(!cards||cards.length<3)return null;
  if(cards.length<=4&&cards.every(c=>c[0]===cards[0][0]))return"set";
  return rmRunOrder(cards)?"run":null;
}
function rmNormalize(cards){const t=rmMeldType(cards);return t==="run"?rmRunOrder(cards):t==="set"?[...cards].sort((a,b)=>a[1]-b[1]):cards;}
function meldName(cs){
  const m=rmNormalize(cs),t=rmMeldType(m);
  if(t==="set")return`${m.length===4?"four":"three"} ${rp(m[0][0]===1?14:m[0][0])}`;
  return`${m.map(c=>label(c[0])).join("-")}${SUITS[m[0][1]]}`;
}
function rmAllMelds(hand){
  const out=[],byRank={};
  hand.forEach((c,i)=>(byRank[c[0]]=byRank[c[0]]||[]).push(i));
  for(const k in byRank){const g=byRank[k];if(g.length===3)out.push(g.slice());if(g.length===4){out.push(g.slice());for(let x=0;x<4;x++)out.push(g.filter((_,j)=>j!==x));}}
  for(let s=0;s<4;s++)for(const aceHigh of [false,true]){
    const idx=[];hand.forEach((c,i)=>{if(c[1]===s)idx.push([c[0]===1&&aceHigh?14:c[0],i]);});idx.sort((a,b)=>a[0]-b[0]);
    for(let a=0;a<idx.length;a++){let b=a;while(b+1<idx.length&&idx[b+1][0]===idx[b][0]+1)b++;
      for(let x=a;x<=b;x++)for(let y=x+2;y<=b;y++)out.push(idx.slice(x,y+1).map(e=>e[1]));
      a=b;}
  }
  const seen=new Set();

function omChips(i){const p=OM.players[i];if(APP.om==="practice")return prChips(p.name);if(p.cid===CID)return wallet.get();
  const f=ONET.info[p.cid];return f&&Number.isFinite(f.ch)?f.ch:START_CHIPS;}

const omLive=i=>OM.players[i].inRound&&OM.players[i].hand.length>0;
function omNextLive(from){const n=OM.players.length;for(let k=1;k<=n;k++){const i=((from+k)%n+n)%n;if(omLive(i))return i;}return-1;}
function omPrevLive(from){const n=OM.players.length;for(let k=1;k<=n;k++){const i=((from-k)%n+n)%n;if(omLive(i))return i;}return-1;}
/* lay down every pair; with three of a kind, two go down and one stays */
function omRemovePairs(p){
  const by={};p.hand.forEach(c=>(by[c[0]]=by[c[0]]||[]).push(c));
  const keep=[];let made=0;
  for(const r in by){const g=by[r];made+=Math.floor(g.length/2);if(g.length%2)keep.push(g[g.length-1]);}
  p.hand=p.hand.filter(c=>keep.some(d=>sameC(c,d)));p.pairs+=made;return made;
}

function omStart(){
  if(!omCanDeal())return;lobPurge(OM);
  const elig=OM.players.map((_,i)=>i).filter(omEligible);
  Object.assign(OM,{gid:rid(8),phase:"play",actN:0,toast:null,loser:-1,lastPair:null,lastTake:null,outN:0,eh:{},ehSig:{}});
  OM.players.forEach((p,i)=>{p.inRound=elig.includes(i);p.hand=[];p.out=0;p.pairs=0;p.net=null;p.last="";});
  const deck=jbDeck().filter(c=>!(c[0]===12&&c[1]===3));   // the Queen of Clubs comes out, so one Queen can never be matched
  const n=OM.players.length;

function omOnPeersHost(ch){

    here.add(pr.cid);const name=String(pr.name||"Player").slice(0,14);

    if(typeof pr.pub==="string"&&pr.pub!==f.pub){f.pub=pr.pub;f.key=null;omDerive(pr.cid);}
    let i=OM.players.findIndex(x=>x.cid===pr.cid);
    if(i<0&&OM.players.length<6){OM.players.push(omPlayer(name,pr.cid));i=OM.players.length-1;dirty=true;}
    if(i<0)continue;
    const pl=OM.players[i];
    if(pl.name!==name){pl.name=name;dirty=true;}
    if(pl.sit!==!!pr.sit){pl.sit=!!pr.sit;dirty=true;}
    {const rd=typeof pr.ready==="string"?pr.ready:null;if(pl.ready!==rd){pl.ready=rd;dirty=true;}}
    if(pl.gone){pl.gone=false;dirty=true;}
    const key=pr.cid+":"+pr.nonce,seen=ONET.seen[key]||0;let max=seen;
    if(Array.isArray(pr.acts))for(const a of pr.acts){
      if(!a||!(a.n>seen))continue;max=Math.max(max,a.n);

  if(OM.phase!=="play"){const b=OM.players.length;OM.players=OM.players.filter(p=>!p.gone);
    if(OM.players.length!==b){dirty=true;if(OM.dealer>=OM.players.length)OM.dealer=OM.players.length-1;}}

}

function hostSeen(g){const N=ONG[g].net();N.electAt=0;clearTimeout(N.electTimer);}
function hostMissing(g){const N=ONG[g].net();if(N.electAt)return;N.electAt=Date.now();clearTimeout(N.electTimer);N.electTimer=setTimeout(()=>elect(g),8000);}
function elect(g){
  const N=ONG[g].net();N.electAt=0;
  if(!N.nr||ONG[g].mode()!=="client"||!N.host)return;
  let peers=[];try{peers=N.nr.peers();}catch(e){}
  if(peers.some(p=>p.presence&&p.presence.role==="host"&&p.presence.code===N.code))return;
  const cids=peers.map(p=>p.presence&&p.presence.cid).filter(c=>typeof c==="string");
  if(!cids.includes(CID))cids.push(CID);
  cids.sort();
  if(cids[0]!==CID){N.electAt=Date.now();N.electTimer=setTimeout(()=>elect(g),6000);return;}
  try{ONG[g].take();}catch(e){}
}
/* two hosts on one table (a returning host, or a tie in the election): the newer one steps down and rejoins as a player */
function dupHost(g,ch){
  const N=ONG[g].net();
  const o=ch.peers.find(p=>!p.isMe&&p.presence&&p.presence.role==="host"&&p.presence.code===N.code&&(p.presence.game||"ew")===g);
  if(!o)return false;
  const mine=N.hs||0,theirs=+o.presence.hs||0;
  if(!(mine>theirs||(mine===theirs&&CID>String(o.presence.cid))))return false;
  stepDown(g);return true;
}

  const N=ONG[g].net(),code=N.code,nr=N.nr;

function ewTakeover(){
  const pr=NET.host||{};try{NET.unsub&&NET.unsub();}catch(e){}
  APP.mode="host";NET.hs=Date.now();NET.seen={};NET.hostGone=false;NET.info={[CID]:{ch:wallet.get()}};

/* chat: a panel that stays open, emoji reactions that float over the table, short messages.
   Each player's presence carries their last few messages (say:[{id,t,e,at}]), so quick messages never drop;
   ids are remembered so nothing shows twice, and sending is rate-limited so a stuck key or double tap can't spam. */
const QUICK=["Nice hand!","Good luck","GG","So close","Your turn","Wow","One more?","Brb"];
const EMOJI=["😂","🔥","👏","😮","😭","🍀","🎉","😤"];
const CHAT={log:[],seen:new Set(),rooms:new WeakSet(),unread:0,open:false,mine:[],lastAt:0,lastT:"",lastTAt:0,draft:""};
const cleanT=t=>String(t||"").replace(/[\u0000-\u001f\u007f​-‏‪-‮⁦-⁩]/g,"").slice(0,80).trim();
function chatHook(nr){
  if(!nr||CHAT.rooms.has(nr))return;CHAT.rooms.add(nr);let first=true;
  nr.onPeers(ch=>{
    const fresh=[];
    for(const p of ch.peers){
      const pr=p.presence||{};let list=pr.say;if(!list)continue;if(!Array.isArray(list))list=[list];
      for(const s of list.slice(-8)){
        if(!s||typeof s.id!=="string"||CHAT.seen.has(s.id))continue;CHAT.seen.add(s.id);
        if(first||p.isMe)continue;   // messages already sitting there when we arrive, and our own (shown when sent)
        const e=EMOJI.includes(s.e)?s.e:null,t=e?"":cleanT(s.t);if(!e&&!t)continue;
        fresh.push({id:s.id,n:String(s.n||pr.name||"Player").slice(0,14),c:typeof s.c==="string"&&/^#[0-9a-f]{3,8}$/i.test(s.c)?s.c:"#9aa3b5",cid:String(pr.avc||pr.cid||""),t,e,me:false,at:Date.now()});
      }
    }
    first=false;if(!fresh.length)return;
    fresh.forEach(m=>{CHAT.log.push(m);if(!CHAT.open&&!m.e)CHAT.unread++;});
    if(CHAT.log.length>60)CHAT.log.splice(0,CHAT.log.length-60);
    fresh.filter(m=>m.e).slice(-4).forEach(m=>floatEmoji(m.e,m.n));
    const txt=fresh.filter(m=>!m.e);
    if(txt.length){if(!CHAT.open)showBubbles();sfx("chip");}
    dockLog();if(!CHAT.open&&txt.length)render();
  },()=>{});
}
function say(text,emoji){
  const o=curOnline();if(!o)return false;
  const now=Date.now(),e=EMOJI.includes(emoji)?emoji:null,t=e?"":cleanT(text);if(!e&&!t)return false;
  if(now-CHAT.lastAt<(e?350:700))return false;                       // too fast
  if(!e&&t===CHAT.lastT&&now-CHAT.lastTAt<4000)return false;           // same message again
  CHAT.lastAt=now;if(!e){CHAT.lastT=t;CHAT.lastTAt=now;}
  const m={id:rid(9),n:myName(),c:myColor(),at:now};if(e)m.e=e;else m.t=t;
  CHAT.seen.add(m.id);CHAT.mine.push(m);if(CHAT.mine.length>6)CHAT.mine.splice(0,CHAT.mine.length-6);
  CHAT.log.push({id:m.id,n:myName(),c:myColor(),cid:CID,t,e,me:true,at:now});if(CHAT.log.length>60)CHAT.log.shift();
  o.N.nr.presence({say:CHAT.mine.slice()}).catch(()=>{});
  if(e)floatEmoji(e,"You");dockLog();return true;
}

    if(XD[k].priv&&typeof pr.pub==="string"&&pr.pub!==f.pub){f.pub=pr.pub;f.key=null;xDerive(k,pr.cid);}
    let i=S.players.findIndex(x=>x.cid===pr.cid);
    if(i<0&&S.players.length<XD[k].seats){S.players.push(xPlayer(S,name,pr.cid));i=S.players.length-1;dirty=true;}
    if(i<0)continue;

    if(pl.sit!==!!pr.sit){pl.sit=!!pr.sit;dirty=true;}
    {const rd=typeof pr.ready==="string"?pr.ready:null;if(pl.ready!==rd){pl.ready=rd;dirty=true;}}

const sameX=(a,b)=>!!a&&!!b&&a[0]===b[0]&&a[1]===b[1]&&(a[2]||0)===(b[2]||0);
const xck=c=>c[0]+"-"+c[1]+"-"+(c[2]||0);
const rankName=(r,n)=>{const w=({1:"Ace",11:"Jack",12:"Queen",13:"King"})[r]||String(r);return n===1?w:w+(w==="6"?"es":"s");};
const numWord=n=>["","One","Two","Three","Four"][n]||String(n);

/* ================= Cheat ================= */
const CH_WIN=4000,CH_REVEAL=2600;
const chSort=h=>h.sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
const chRankWord=(r,n)=>{const w=({1:"Ace",11:"Jack",12:"Queen",13:"King"})[r]||String(r);return n===1?w:w+"s";};
const chClaim=(n,r,lower)=>{const t=`${numWord(n)} ${chRankWord(r,n)}`;return lower?t.replace(/^\w+/,w=>w.toLowerCase()):t;};
function chAdvance(S){
  S.rank=S.rank%13+1;S.turn=xNextIn(S,S.last?S.last.by:S.turn);S.sub="turn";S.passed=[];S.reveal=null;
}
function chPlay(S,i,cards){
  const h=S.hands[i];
  const pick=[];for(const c of cards){const j=h.findIndex(d=>sameC(d,c)&&!pick.includes(d));if(j<0)return false;pick.push(h[j]);}
  if(!pick.length||pick.length>4)return false;
  S.hands[i]=h.filter(d=>!pick.includes(d));S.pile.push(...pick);
  S.last={by:i,n:pick.length,rank:S.rank,cards:pick};S.sub="call";S.winAt=Date.now()+CH_WIN;S.passed=[];S.plays=(S.plays||0)+1;
  return true;
}
function chAuto(S,i){
  const h=S.hands[i];if(!h.length)return;
  const real=h.filter(c=>c[0]===S.rank);
  chPlay(S,i,real.length?real.slice(0,4):[chBluffCard(S,h)]);
}
// the card you'll need last: its rank comes up furthest away in the cycle
function chBluffCard(S,h){let best=h[0],bd=-1;for(const c of h){const d=((c[0]-S.rank)%13+13)%13;if(d>bd){bd=d;best=c;}}return best;}
function chAccept(S){
  const w=S.last.by;if(!S.last.cards.every(c=>c[0]===S.last.rank))xSt(S,w,"bluffOk");
  if(!S.hands[w].length){xWin(S,w);return;}
  chAdvance(S);
}
function chResolve(S){
  const R=S.reveal;if(R.truth)xSt(S,R.caller,"wrong");else{xSt(S,R.caller,"caught");xSt(S,R.who,"busted");}
  S.hands[R.taker].push(...S.pile);chSort(S.hands[R.taker]);S.pile=[];
  if(R.truth&&!S.hands[R.who].length){xWin(S,R.who);return;}
  chAdvance(S);
}
xReg("ch",{name:"Cheat",tag:"Bluff, or call it · 3–6 players",min:3,max:6,seats:6,buyins:[0,25,50,100],priv:true,winTitle:"Cheat champion!",winSub:"First to empty your hand",
  start(S,el){
    const deck=jbDeck();S.hands={};S.players.forEach((_,i)=>S.hands[i]=[]);
    let j=0;while(deck.length){S.hands[el[j%el.length]].push(deck.pop());j++;}
    el.forEach(i=>chSort(S.hands[i]));
    const a=el.find(i=>S.hands[i].some(c=>c[0]===1&&c[1]===0));
    S.turn=a!=null?a:el[0];S.rank=1;S.pile=[];S.last=null;S.reveal=null;S.sub="turn";S.passed=[];S.plays=0;S.memo={};
  },
  act(S,i,a,o){
    if(a==="play"){if(S.sub!=="turn"||S.turn!==i||!Array.isArray(o.cards))return false;return chPlay(S,i,o.cards.slice(0,4).filter(c=>Array.isArray(c)));}
    if(a==="call"){
      if(S.sub!=="call"||!S.last||i===S.last.by)return false;if(o.k!=null&&o.k!==S.actN)return false;
      const truth=S.last.cards.every(c=>c[0]===S.last.rank);
      S.reveal={caller:i,who:S.last.by,cards:S.last.cards,truth,taker:truth?i:S.last.by,rank:S.last.rank,n:S.last.n,pileN:S.pile.length};
      S.sub="reveal";S.toast={id:rid(5),text:`${S.players[i].name} calls Cheat!`};return true;
    }
    if(a==="pass"){
      if(S.sub!=="call"||!S.last||i===S.last.by||S.passed.includes(i))return false;if(o.k!=null&&o.k!==S.actN)return false;
      S.passed.push(i);
      if(xInR(S).filter(j=>j!==S.last.by).every(j=>S.passed.includes(j)||S.players[j].gone))chAccept(S);
      return true;
    }
    return false;
  },
  timer(S){
    if(S.sub==="turn")return{key:"t"+S.actN,ms:TURN_MS,clock:true,fn:S2=>{S2.toast={id:rid(5),text:`${S2.players[S2.turn].name} ran out of time · a card was played for them`};chAuto(S2,S2.turn);}};
    if(S.sub==="call")return{key:"c"+S.actN,ms:S.winAt-Date.now(),fn:chAccept};
    if(S.sub==="reveal")return{key:"r"+S.actN,ms:CH_REVEAL,fn:chResolve};
    return null;
  },
  actor:S=>S.sub==="turn"?S.turn:-1,
  auto:(S,i)=>chAuto(S,i),
  pub:S=>({turn:S.turn,rank:S.rank,sub:S.sub,pileN:S.pile.length,plays:S.plays,
    last:S.last?{by:S.last.by,n:S.last.n,rank:S.last.rank}:null,reveal:S.reveal,
    wl:S.sub==="call"?Math.max(0,S.winAt-Date.now()):null,passed:S.passed}),
  pubP:(S,i)=>({cnt:S.hands[i].length}),
  priv:(S,i)=>({h:S.hands[i]}),
  botDelay(S,i,d){
    if(S.sub==="turn"&&S.turn===i)return 900+Math.random()*1100;
    if(S.sub==="call"&&S.last&&S.last.by!==i&&!S.passed.includes(i))return(d==="hard"?500:d==="easy"?1200:800)+Math.random()*900;
    return null;
  },
  bot(S,i,d){
    const h=S.hands[i];
    if(S.sub==="turn"&&S.turn===i){
      const real=h.filter(c=>c[0]===S.rank);
      if(real.length){const cards=real.slice(0,4);
        if(d!=="easy"&&cards.length<4&&h.length>cards.length+2&&Math.random()<(d==="hard"?.3:.15))cards.push(chBluffCard(S,h.filter(c=>c[0]!==S.rank)));
        return{a:"play",cards};}
      const cards=[chBluffCard(S,h)];
      if(h.length>6&&Math.random()<(d==="easy"?.35:.2)){const rest=h.filter(c=>!sameC(c,cards[0]));cards.push(chBluffCard(S,rest));}
      return{a:"play",cards};
    }
    if(S.sub==="call"&&S.last){
      const key=S.actN+":"+i;if(S.memo[key]!=null)return S.memo[key]?{a:"call",k:S.actN}:{a:"pass",k:S.actN};
      const mineN=h.filter(c=>c[0]===S.last.rank).length,left=S.hands[S.last.by].length;
      let call=mineN+S.last.n>4;
      if(!call){let p=[.06,.14,.28,.5][S.last.n-1]||.5;if(left===0)p+=.55;else if(left<=2)p+=.15;if(d==="easy")p*=.6;if(d==="hard"&&mineN>=2)p+=.2;call=Math.random()<p;}
      S.memo[key]=call;return call?{a:"call",k:S.actN}:{a:"pass",k:S.actN};
    }
    return null;
  },
  seat(v,i,mine){
    const p=v.pl[i],turn=v.sub==="turn"&&v.turn===i;
    let st=turn?"Playing…":"";
    if(v.last&&v.last.by===i&&v.sub!=="turn")st=`Played ${chClaim(v.last.n,v.last.rank,1)}`;
    if(v.sub==="call"&&v.passed&&v.passed.includes(i))st="Let it go";
    if(v.reveal&&v.reveal.caller===i)st="Called Cheat!";
    return{turn,st,line:`<span class="rmcount">${p.cnt} ${p.cnt===1?"card":"cards"}</span>`};
  },
  center(v,mine,pv,X){
    const n=Math.min(8,v.pileN||0),R=v.reveal;
    const angles=[-14,9,-4,18,-22,6,-10,14];
    let pile=`<div class="chpile" aria-label="${v.pileN} cards in the pile">${n?Array.from({length:n},(_,j)=>`<div class="card down" style="transform:translate(-50%,-50%) rotate(${angles[j]}deg)"></div>`).join(""):`<div class="chempty">Pile</div>`}</div>`;
    if(R)pile=`<div class="chreveal ${R.truth?"truth":"lie"}">${R.cards.map((c,j)=>cardHTML(c,"reveal",`animation-delay:${j*120}ms`)).join("")}</div>`;
    let claim="";
    if(R)claim=`<div class="chverdict ${R.truth?"truth":"lie"}"><b>${R.truth?"Truth!":"Caught!"}</b><span>${R.truth?`${R.who===mine?"You":esc(v.pl[R.who].n)} really played ${chClaim(R.n,R.rank,1)}. ${R.taker===mine?"You take":esc(v.pl[R.taker].n)+" takes"} the pile.`:`${R.who===mine?"You were":esc(v.pl[R.who].n)+" was"} bluffing. ${R.taker===mine?"You take":esc(v.pl[R.taker].n)+" takes"} the pile.`}</span></div>`;
    else if(v.last&&v.sub==="call")claim=`<div class="chclaim">${avatarHTML(v.pl[v.last.by].n,v.pl[v.last.by].col,28,v.pl[v.last.by].c)}<span>${v.last.by===mine?"You played":esc(v.pl[v.last.by].n)+" played"}</span><b>${chClaim(v.last.n,v.last.rank)}</b></div>`;
    else if(v.sub==="turn")claim=`<div class="chclaim soft"><span>${v.turn===mine?"Your turn":esc(v.pl[v.turn].n)+"'s turn"}</span><b>${chRankWord(v.rank,2)}</b></div>`;
    let btn="";
    if(v.sub==="call"&&v.last&&mine>=0&&v.last.by!==mine&&v.pl[mine].in){
      const dl=turnDeadline("chw"+v.gid+v.actN,v.wl),left=Math.max(0,dl-Date.now()),C=295,off=Math.round(C*(1-left/CH_WIN));
      const passed=v.passed&&v.passed.includes(mine);
      btn=`<div class="chcall"><button class="chbtn" data-act="x-do" data-g="ch" data-a="call" ${passed?"disabled":""} aria-label="Call Cheat">

/* Solitaire: drag a card or a run onto a column or a suit pile (tapping still works) */
function soTake(src){

  if(src.t==="f"){const f=SO.found[src.f],c=f&&f[f.length-1];return c?[{c,up:true}]:null;}

  for(let k=1;k<run.length;k++){const a=run[k-1].c,b=run[k].c;if(soRed(a)===soRed(b)||a[0]!==b[0]+1)return null;}

function leave(n){

  if(n.nodeType===1&&n.hasAttribute("data-exit")&&MOTION()&&painted){n._exiting=true;n.classList.add("exiting");setTimeout(()=>n.remove(),280);return;}
  n.remove();
}
function cardSpots(){
  const m=new Map();if(!MOTION())return m;
  document.querySelectorAll("#app .view:not(.exiting) .card[data-key]").forEach(el=>{const r=el.getBoundingClientRect();if(r.width)m.set(el.getAttribute("data-key"),r);});
  return m;
}
function glideCards(before){
  if(!before.size)return;
  document.querySelectorAll("#app .view:not(.exiting) .card[data-key]").forEach(el=>{
    const o=before.get(el.getAttribute("data-key"));if(!o)return;
    el.getAnimations().forEach(a=>{if(a.id==="glide")a.cancel();});
    const r=el.getBoundingClientRect(),z=ZOOM(),dx=(o.left-r.left)/z,dy=(o.top-r.top)/z,d=Math.hypot(dx,dy);
    if(d<1.5||d>1800)return;
    el.getAnimations().forEach(a=>{if(a instanceof CSSAnimation)a.cancel();});   // a card that travels doesn't also replay its deal-in
    const s=o.width&&r.width?o.width/r.width:1;
    const an=el.animate([{transform:`translate(${dx}px,${dy}px) scale(${s})`,transformOrigin:"0 0"},{transform:"translate(0,0) scale(1)",transformOrigin:"0 0"}],
      {duration:Math.min(560,260+d*.45),easing:"cubic-bezier(.2,.75,.25,1)",composite:"add"});
    an.id="glide";
  });
}
function paint(app,full){
  if(!app.childNodes){app.innerHTML=full;return;}              // plain test environments
  document.documentElement.classList.toggle("calm",!MOTION());
  const curView=app.querySelector(":scope > .view:not(.exiting)");
  const sameView=curView&&curView.getAttribute("data-key")===`v-${APP.screen}`;
  const before=sameView?cardSpots():new Map();
  const tpl=document.createElement("template");tpl.innerHTML=full;
  tagChips(tpl.content);
  tpl.content.querySelectorAll(".coach").forEach(e=>e.classList.toggle("open",COACH_OPEN));
  keyHints(tpl.content);
  INS=[];
  morphChildren(app,tpl.content);
  if(sameView)glideCards(before);
  dealIn(before);
  runFlights();runChips();
  document.querySelectorAll("#app .coach").forEach(e=>e.classList.toggle("more",COACH_OPEN?true:e.scrollWidth>e.clientWidth+1));
  painted=true;
}
function sweepIfCollected(){
  if(!prevV||!V||APP.screen!=="game")return;
  if(prevV.pileN>0&&V.pileN===0){
    const pileEl=document.querySelector(".pile");if(!pileEl)return;
    const host=pileEl.parentElement,g=pileEl.cloneNode(true);
    const r=pileEl.getBoundingClientRect(),h=host.getBoundingClientRect();
    g.classList.add("pile-sweep");g.setAttribute("data-keep","");g.style.left=(r.left-h.left)+"px";g.style.top=(r.top-h.top)+"px";
    g.style.setProperty("--dy",towardTop(V.turn)?-1:1);
    requestAnimationFrame(()=>{const c=document.querySelector(".center");if(c){c.appendChild(g);setTimeout(()=>g.remove(),500);}});
  }
}

  paint(app,`<div class="view" data-key="v-${APP.screen}" data-exit>${html}</div>${sheet?`<div class="sheetwrap" data-key="s-${sheetName}" data-exit>${sheet}</div>`:""}`);

  if(APP.screen==="bc-table")prevCV=CVw;
