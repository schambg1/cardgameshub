      if(APP.screen==="game"&&V){changed();return;}if(APP.screen==="bj-table"&&B){bjChanged();return;}if(APP.screen==="bc-table"&&C){bcChanged();return;}break;
    case"pr-start":prStart();return;
    case"pr-exit":prExit();return;
    case"pr-reset":APP.sheet=null;prResetChips();return;
    case"open-bc":APP.screen="bc-mode";APP.sheet=null;APP.err="";break;
    case"bc-local-setup":bcStop();APP.bc="local";APP.screen="bc-setup";APP.sheet=null;break;
    case"bc-count":APP.bcCount=+t.dataset.n;break;
    case"bc-sit":{const names=localNames().slice(0,APP.bcCount);
      if(new Set(names.map(n=>n.toLowerCase())).size<names.length)break;
      APP.bc="local";bcNewTable(names.map(n=>({name:n})));prevCV=null;APP.screen="bc-table";APP.sheet=null;bcChanged();return;}
    case"bc-host":bcHost();return;
    case"bc-join":bcJoin();return;
    case"bc-side":if(APP.bc==="client")bcGuestSide(t.dataset.s);else bcSetSide(+t.dataset.p,t.dataset.s);return;
    case"bc-bet":if(APP.bc==="client")bcGuestBet(+t.dataset.v);else bcSetBet(+t.dataset.p,+t.dataset.v);return;
    case"bc-lock":bcGuestLock();return;
    case"bc-deal":if(C){bcDeal();bcChanged();}return;
    case"bc-next":bcNextHand();return;
    case"bc-leave":bcLeave();return;
    case"bc-rules":APP.sheet="bc-rules";break;
    case"bc-menu":APP.sheet="bc-menu";break;
    case"open-bj":APP.screen="bj-mode";APP.sheet=null;APP.err="";break;
    case"bj-local-setup":bjStop();APP.bj="local";APP.screen="bj-setup";APP.sheet=null;break;
    case"bj-count":APP.bjCount=+t.dataset.n;break;
    case"bj-sit":{const names=localNames().slice(0,APP.bjCount);
      if(new Set(names.map(n=>n.toLowerCase())).size<names.length)break;
      APP.bj="local";bjNewTable(names.map(n=>({name:n})));prevBV=null;APP.screen="bj-table";APP.sheet=null;bjChanged();return;}
    case"bj-host":bjHost();return;
    case"bj-join":bjJoin();return;
    case"bj-bet":if(APP.bj==="client")bjGuestBet(+t.dataset.v);else bjAddBet(+t.dataset.p,+t.dataset.v);return;
    case"bj-lock":bjGuestLock();return;
    case"bj-deal":if(B){bjDeal();bjChanged();}return;
    case"bj-act":if(APP.bj==="client")bjSend(t.dataset.a);else bjAction(+t.dataset.p,t.dataset.a,+t.dataset.h);return;
    case"bj-next":bjNextHand();return;
    case"bj-force":APP.sheet=null;if(APP.bj==="host"&&B&&B.turn)bjAction(B.turn.p,"stand",B.turn.h);render();return;
    case"bj-leave":bjLeave();return;
    case"bj-rules":APP.sheet="bj-rules";break;
    case"bj-menu":APP.sheet="bj-menu";break;
    case"local-setup":clearTimeout(timer);APP.mode="local";APP.screen="setup";APP.sheet=null;break;
    case"count":APP.count=+t.dataset.n;break;
    case"deal":{const chk=localCheck();if(!chk.ok){APP.screen="setup";APP.sheet=null;break;}
      APP.mode="local";G=newGame(chk.playing,APP.buyIn);prevV=null;APP.screen="game";APP.sheet=null;V=toView();break;}
    case"stake-local":APP.buyIn=+t.dataset.b;break;
    case"bonus-local":bonus.claimLocal(localNames()[+t.dataset.i]);break;
    case"bonus":chipFly('[data-act="bonus"]',VW+".bankamt, "+VW+".wallet .chip",BONUS,{color:"#b8501a"});bonus.claimMine();pushChips();
      if(APP.bj==="client"&&BNET.nr)BNET.nr.presence({chips:wallet.get()}).catch(()=>{});
      if(APP.bc==="client"&&CNET.nr)CNET.nr.presence({chips:wallet.get()}).catch(()=>{});
      if(APP.hm==="client"&&HNET.nr)HNET.nr.presence({chips:wallet.get()}).catch(()=>{});
      if(APP.hm==="host"&&H){hmChanged();return;}
      if(APP.rm==="client"&&RNET.nr)RNET.nr.presence({chips:wallet.get()}).catch(()=>{});
      if(APP.rm==="host"&&RM){rmChanged();return;}
      if(APP.om==="client"&&ONET.nr)ONET.nr.presence({chips:wallet.get()}).catch(()=>{});
      if(APP.om==="host"&&OM){omChanged();return;}
      if(APP.bj==="host"&&B){bjChanged();return;}
      if(APP.bc==="host"&&C){bcChanged();return;}
      break;
    case"stake":setStake(+t.dataset.b);return;
    case"agree":guestAgree(NET.agree!==NET.buyIn);return;
    case"host-lobby":hostToLobby();return;
    case"host":hostGame();return;
    case"resume":hostGame(store.get("ew-host"));return;
    case"join":joinGame();return;
    case"start":prevV=null;hostStart();return;
    case"leave":leaveOnline();return;
    case"rules":APP.sheet="rules";break;
    case"menu":APP.sheet="menu";break;
    case"close":case"close-bg":APP.sheet=null;break;
    default:return;
  }
  render();
});
document.addEventListener("change",e=>{if(e.target.dataset&&e.target.dataset.bind==="vol")sfx("chip");});
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.dataset.i!=null){
    const i=+el.dataset.i;APP.names[i]=el.value;
    const c=localChips.get(localNames()[i]),lab=document.getElementById("chips-"+i);
    if(lab){lab.textContent=fmt(c);lab.classList.toggle("short",c<(APP.screen==="setup"?APP.buyIn:BJ_MIN));}
    const chk=localCheck(),p=document.getElementById("local-check"),btn=document.getElementById("deal-btn");
    if(p){p.textContent=chk.why;p.classList.toggle("warn",!chk.ok);}if(btn)btn.disabled=!chk.ok;
  }
  if(el.dataset.bind==="vol"){FX.set("vol",(+el.value||0)/100);el.style.setProperty("--v",el.value+"%");return;}
  if(el.dataset.bind==="myName"){APP.myName=el.value;store.set("ew-name",el.value);}
  if(el.dataset.bind==="joinCode"){APP.joinCode=el.value.replace(/[^a-z0-9]/gi,"");el.value=APP.joinCode.toUpperCase();
    document.querySelectorAll(".sucode i").forEach((b,k)=>b.textContent=(APP.joinCode[k]||"").toUpperCase());}
});
document.addEventListener("keydown",e=>{
  if(APP.screen!=="game"||!V||e.repeat||e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.target&&e.target.closest&&e.target.closest("input,textarea,select"))return;
  if(e.key==="Escape"&&CHAT.open){closeDock();return;}
  if((e.key==="t"||e.key==="T")&&curOnline()){e.preventDefault();toggleDock();return;}
  if(e.key==="Escape"){APP.sheet=APP.sheet?null:"menu";render();return;}
  if(APP.sheet||V.winner!=null)return;
  const k=e.key===" "?"space":e.key.toLowerCase();
  let hit=false;
  if(APP.mode!=="local"&&NET.mySeat>=0){
    if(k==="f"||k==="enter"){act("flip",NET.mySeat);hit=true;}
    else if(k==="space"||k==="s"){act("slap",NET.mySeat);hit=true;}
  }
  if(hit){e.preventDefault();if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();}
});
const KEYMAP=[
  ["h",'.bj-acts [data-a="hit"],[data-act="so-hint"]'],["s",'.bj-acts [data-a="stand"]'],["d",'.bj-acts [data-a="double"]'],["p",'.bj-acts [data-a="split"]'],
  ["f",'.hacts [data-a="fold"]'],["c",'.hacts [data-a="call"],.hacts [data-a="check"],.chbtn'],["r",'.raisebox [data-a="raise"],[data-act="hm-raisebox"]'],
  ["arrowup",'[data-act="hm-step"][data-v="1"]'],["arrowdown",'[data-act="hm-step"][data-v="-1"]'],
  ["1",'[data-act="bj-bet"][data-v="10"],[data-act="bc-side"][data-s="player"],[data-act="rm-draw"][data-src="stock"],.rmacts [data-a="draw"][data-src="stock"]'],
  ["2",'[data-act="bj-bet"][data-v="50"],[data-act="bc-side"][data-s="banker"],[data-act="rm-draw"][data-src="discard"],.rmacts [data-a="draw"][data-src="disc"]'],
  ["3",'[data-act="bj-bet"][data-v="100"],[data-act="bc-side"][data-s="tie"]'],["backspace",'[data-act="bj-bet"][data-v="0"]'],
  ["m",'[data-act="rm-meld"]'],["l",'[data-act="rm-layoff"]'],
  ["space",'[data-act="rm-discard"],[data-act="bj-deal"],[data-act="bj-next"],[data-act="bc-deal"],[data-act="bc-next"],[data-act="hm-deal"],[data-act="rm-deal"],[data-act="om-deal"],.jdeal,[data-act="x-deal"],[data-act="ch-play"],[data-a="next"],[data-act="so-stock"],.spspeed'],
  ["t",'.chatbtn:not(.rulesbtn)'],["z",'[data-act="so-undo"]'],["n",'[data-act="so-new"]'],["escape",'.menu-btn2,.menu-btn']];
// Speed: 1 to 5 pick a card, Q and W pick a pile
document.addEventListener("keydown",e=>{
  if(APP.screen!=="sp"||APP.sheet||e.repeat||e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.target&&e.target.closest&&e.target.closest("input,textarea,select"))return;
  const k=e.key.toLowerCase();let el=null;
  if(/^[1-5]$/.test(k))el=document.querySelectorAll("#app .view:not(.exiting) .spcard")[+k-1];
  else if(k==="q"||k==="w")el=document.querySelector(`#app .view:not(.exiting) .sppile[data-p="${k==="q"?0:1}"]`);
  if(el&&!el.disabled){e.preventDefault();e.stopImmediatePropagation();el.click();}
},true);
function keyHints(root){
  KEYMAP.forEach(([k,sel])=>{const lab=k==="space"?"Space":k==="backspace"?"⌫":k==="escape"?"Esc":k==="arrowup"?"↑":k==="arrowdown"?"↓":k.toUpperCase();
    if(/^(arrow|t$|escape)/.test(k))return;
    root.querySelectorAll(sel).forEach(el=>{if(el.matches("button")&&!el.closest(".overlay"))el.setAttribute("data-key-hint",lab);});});}
document.addEventListener("keydown",e=>{
  if(APP.screen==="game"||e.repeat||e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.target&&e.target.closest&&e.target.closest("input,textarea,select"))return;
  const k=e.key===" "?"space":e.key.toLowerCase();
  if(k==="escape"&&CHAT.open){closeDock();e.preventDefault();return;}
  if(k==="escape"&&APP.sheet){APP.sheet=null;render();e.preventDefault();return;}
  if(APP.sheet)return;
  const row=KEYMAP.find(([kk])=>kk===k);if(!row)return;
  const el=[...document.querySelectorAll(row[1].split(",").map(x=>"#app .view:not(.exiting) "+x).join(","))].find(b=>!b.disabled&&b.offsetParent);
  if(el){e.preventDefault();el.click();if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();}
});
document.addEventListener("change",e=>{if(/setup$/.test(APP.screen)&&e.target.dataset.i!=null)render();});
function selectCode(){const el=document.getElementById("code-text");if(!el)return;try{const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);}catch(e){}}
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.dataset&&e.target.dataset.bind==="joinCode"){
  if(APP.screen==="bj-mode")bjJoin();else if(APP.screen==="bc-mode")bcJoin();else if(APP.screen==="hm-mode")hmJoin();else if(APP.screen==="rm-mode")rmJoin();else if(APP.screen==="om-mode")omJoin();else joinGame();}});
document.addEventListener("contextmenu",e=>{if(e.target.closest(".seat,.peek"))e.preventDefault();});

render();
