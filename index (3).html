const BJ_MIN=10, BJ_TOKENS=[[10,"#1f4fbf"],[50,"#b8501a"],[100,"#1a1a1a"]];
const bjVal=r=>r===1?1:Math.min(r,10);
function bjTotal(cards){let t=0,a=false;for(const c of cards){if(!c)continue;t+=bjVal(c[0]);if(c[0]===1)a=true;}return a&&t+10<=21?{t:t+10,soft:true}:{t,soft:false};}
function bjTotText(cards){const {t,soft}=bjTotal(cards);return soft&&t<21?`${t-10}/${t}`:`${t}`;}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function bjShoe(){const s=[];for(let d=0;d<6;d++)for(let su=0;su<4;su++)for(let r=1;r<=13;r++)s.push([r,su]);return shuffle(s);}
const money=n=>(n>0?"+":n<0?"−":"")+fmt(Math.abs(n));
let B=null,BV=null,prevBV=null,bjTimer=null;
const BNET={nr:null,code:"",info:{},seen:{},host:null,hostGone:false,connected:true,searchTimer:null,
  my:{bet:BJ_MIN,ready:null,n:0,acts:[],nonce:rid(6)}};

/* engine: runs on the same-phone device or on the host's phone */
function bjFreeColor(){const used=new Set(B.players.map(p=>p.color));return COLORS.find(c=>!used.has(c))||COLORS[0];}
function bjPlayer(name,cid){return{name,cid:cid||null,color:bjFreeColor(),bet:BJ_MIN,ready:false,inRound:false,hands:[],net:null,chips0:0};}
function bjNewTable(seats){
  clearTimeout(bjTimer);
  B={shoe:bjShoe(),seq:0,gid:rid(8),betId:rid(6),phase:"bet",dealer:[],hole:true,turn:null,toast:null,note:"",players:[]};
  seats.forEach(s=>{const p=bjPlayer(s.name,s.cid);p.bot=!!s.bot;B.players.push(p);});
  B.players.forEach((p,i)=>{if(p.bet>bjChips(i))p.bet=0;});
}
function bjChips(i){
  const p=B.players[i];
  if(APP.bj==="practice")return prChips(p.name);
  if(APP.bj==="local")return localChips.get(p.name);
  if(p.cid===CID)return wallet.get();
  const f=BNET.info[p.cid];return f&&Number.isFinite(f.ch)?f.ch:START_CHIPS;
}
function bjCanPlay(i){
  const p=B.players[i],ch=bjChips(i);
  if(p.bet<BJ_MIN||p.bet>ch)return false;
  if(APP.bj==="host"&&p.cid!==CID)return p.ready;
  return true;
}
function bjDraw(){if(!B.shoe.length)B.shoe=bjShoe();return B.shoe.pop();}
function bjDeal(){
  if(!B||B.phase!=="bet")return;
  const active=B.players.map((_,i)=>i).filter(bjCanPlay);
  if(!active.length)return;
  clearTimeout(bjTimer);
  if(B.shoe.length<78){B.shoe=bjShoe();B.toast={id:rid(5),text:"Fresh 6-deck shoe shuffled"};}else B.toast=null;
  B.gid=rid(8);B.dealer=[];B.hole=true;B.note="";
  B.players.forEach((p,i)=>{p.hands=[];p.net=null;p.inRound=active.includes(i);p.chips0=bjChips(i);});
  for(const i of active)B.players[i].hands=[{cards:[],bet:B.players[i].bet}];
  for(let k=0;k<2;k++){for(const i of active)B.players[i].hands[0].cards.push(bjDraw());B.dealer.push(bjDraw());}
  B.phase="play";
  for(const i of active){const h=B.players[i].hands[0];if(bjTotal(h.cards).t===21){h.done=true;h.natural=true;}}
  // dealer checks for blackjack when showing an Ace or a 10-value card
  if(bjTotal(B.dealer).t===21){bjResolve();return;}
  bjNext();
}
function bjCheck(h){const t=bjTotal(h.cards).t;if(t>21){h.bust=true;h.done=true;}else if(t===21)h.done=true;}
function bjOpts(){
  const t=B.turn;if(!t)return{dbl:false,spl:false};
  const pl=B.players[t.p],h=pl.hands[t.h],used=pl.hands.reduce((s,x)=>s+x.bet,0);
  const two=h.cards.length===2,room=used+h.bet<=pl.chips0;
  return{dbl:two&&room,spl:two&&room&&pl.hands.length<4&&bjVal(h.cards[0][0])===bjVal(h.cards[1][0])};
}
function bjAction(p,a,h){
  if(!B||B.phase!=="play"||!B.turn||B.turn.p!==p||B.turn.h!==h)return;
  const pl=B.players[p],hand=pl.hands[h],o=bjOpts();
  if(a==="hit"){hand.cards.push(bjDraw());bjCheck(hand);}
  else if(a==="stand"){hand.done=true;}
  else if(a==="double"){if(!o.dbl)return;hand.bet*=2;hand.cards.push(bjDraw());bjCheck(hand);hand.done=true;}
  else if(a==="split"){
    if(!o.spl)return;
    const [c1,c2]=hand.cards,aces=c1[0]===1;
    const h1={cards:[c1,bjDraw()],bet:hand.bet,split:true},h2={cards:[c2,bjDraw()],bet:hand.bet,split:true};
    for(const x of [h1,h2]){if(aces)x.done=true;else bjCheck(x);} // split Aces get one card each
    pl.hands.splice(h,1,h1,h2);
  }else return;
  bjNext();bjChanged();
}
function bjNext(){
  for(let p=0;p<B.players.length;p++){const pl=B.players[p];if(!pl.inRound)continue;
    for(let h=0;h<pl.hands.length;h++)if(!pl.hands[h].done){B.turn={p,h};return;}}
  B.turn=null;B.phase="dealer";B.hole=false;
  const live=B.players.some(p=>p.inRound&&p.hands.some(h=>!h.bust&&!h.natural));
  const step=()=>{
    if(!B)return;
    if(live&&bjTotal(B.dealer).t<17){B.dealer.push(bjDraw());bjChanged();bjTimer=setTimeout(step,750);}
    else{bjResolve();bjChanged();}
  };
  clearTimeout(bjTimer);bjTimer=setTimeout(step,750);
}
function bjResolve(){
  clearTimeout(bjTimer);
  B.phase="done";B.turn=null;B.hole=false;
  const d=bjTotal(B.dealer).t,dNat=B.dealer.length===2&&d===21,dBust=d>21;
  for(const p of B.players){
    if(!p.inRound)continue;let net=0;
    for(const h of p.hands){
      const t=bjTotal(h.cards).t;let r;
      if(dNat)r=h.natural?"push":"lose";
      else if(h.bust)r="bust";
      else if(h.natural)r="bj";
      else if(dBust||t>d)r="win";
      else if(t<d)r="lose";else r="push";
      h.result=r;h.pay=r==="bj"?h.bet*1.5:r==="win"?h.bet:r==="push"?0:-h.bet;net+=h.pay;
    }
    p.net=net;
  }
  B.note=dNat?"Dealer has blackjack":dBust?`Dealer busts with ${d}`:d>=17?`Dealer stands on ${d}`:`Dealer has ${d}`;
}
function bjNextHand(){
  if(!B||B.phase!=="done")return;
  clearTimeout(bjTimer);
  B.phase="bet";B.betId=rid(6);B.dealer=[];B.hole=true;B.turn=null;B.toast=null;B.note="";
  B.players.forEach((p,i)=>{p.hands=[];p.net=null;p.inRound=false;p.ready=false;
    const ch=bjChips(i);if(p.bet>ch)p.bet=Math.floor(ch/10)*10;});
  if(APP.bj==="host")B.players.forEach(p=>{const f=BNET.info[p.cid];if(f&&p.cid!==CID){p.bet=f.bet;p.ready=f.ready===B.betId;}});
  if(APP.bj==="practice")prBjBets();
  bjChanged();
}
function bjAddBet(i,v){
  if(!B||B.phase!=="bet"||!B.players[i])return;
  const p=B.players[i],ch=bjChips(i);
  if(v===0)p.bet=0;else if(p.bet+v<=ch)p.bet+=v;else return;
  bjChanged();
}
function bjView(){
  B.seq++;
  return{seq:B.seq,gid:B.gid,betId:B.betId,ph:B.phase,shoe:B.shoe.length,
    dl:B.hole&&B.dealer.length?[B.dealer[0],0]:B.dealer,
    turn:B.turn?{p:B.turn.p,h:B.turn.h,...bjOpts()}:null,toast:B.toast,note:B.note,tl:clockLeft(B.turnAt),
    pl:B.players.map((p,i)=>({n:p.name,c:p.cid,col:p.color,bet:p.bet,rd:p.ready?1:0,in:p.inRound?1:0,ch:bjChips(i),net:p.net,
      h:p.hands.map(h=>{const o={c:h.cards,b:h.bet};if(h.natural)o.nat=1;if(h.result)o.r=h.result;if(h.pay!=null)o.p=h.pay;return o;})}))};
}
let bjTT=null,bjTK="";
function bjTurnTimer(){
  if(B.phase!=="play"||!B.turn){clearTimeout(bjTT);bjTK="";B.turnAt=null;return;}
  const {p,h}=B.turn,key=`${B.gid}:${p}:${h}:${B.players[p].hands[h].cards.length}`;
  if(key===bjTK)return;
  bjTK=key;B.turnAt=Date.now();clearTimeout(bjTT);
  bjTT=setTimeout(()=>{
    if(!B||bjTK!==key||!B.turn||B.turn.p!==p||B.turn.h!==h)return;
    B.toast={id:rid(5),text:`${B.players[p].name} ran out of time · auto-stand`};bjAction(p,"stand",h);
  },TURN_MS);
}
function bjChanged(){
  if(!B)return;
  bjTurnTimer();
  BV=bjView();
  if(APP.bj==="host"&&BNET.nr){BNET.nr.presence({role:"host",game:"bj",hs:BNET.hs,code:BNET.code,cid:CID,v:BV}).catch(()=>{});
    lobbyAnnounce({g:"bj",code:BNET.code,name:myName(),n:B.players.length});}
  render();
  bjBotTick();
}
function bjSettle(){
  const v=BV;if(!v||v.ph!=="done"||settled(v.gid))return;
  if(APP.bj==="practice"){markSettled(v.gid);v.pl.forEach(p=>{if(p.in&&p.net)prSet(p.n,prChips(p.n)+p.net);});setTimeout(bjChanged,0);return;}
  if(APP.bj==="local"){
    markSettled(v.gid);
    v.pl.forEach(p=>{if(p.in&&p.net)localChips.set(p.n,localChips.get(p.n)+p.net);});
    return;
  }
  const me=v.pl.find(p=>p.c===CID);if(!me||!me.in||me.net==null)return;
  markSettled(v.gid);
  wallet.set(wallet.get()+me.net);
  stHand("bj",me.net);stSet(s=>{if(me.net>0){s.bj.cur++;s.bj.best=Math.max(s.bj.best,s.bj.cur);}else if(me.net<0)s.bj.cur=0;});
  if(APP.bj==="client")BNET.nr?.presence({chips:wallet.get()}).catch(()=>{});
  else setTimeout(bjChanged,0);
}
function bjStop(){clearTimeout(bjTimer);clearTimeout(bjTT);bjTK="";B=null;BV=null;prevBV=null;}

/* online: host */
async function bjHost(){
  if(!NET.room)return;
  APP.err="";const code=rid(4);let nr;
  try{nr=await NET.room.join("bj-"+code);}catch(e){APP.err="Couldn't open a table. Try again in a moment.";render();return;}
  BNET.nr=nr;APP.bj="host";BNET.code=code;BNET.info={};BNET.seen={};BNET.connected=true;BNET.hs=Date.now();
  bjNewTable([{name:APP.myName.trim()||"Host",cid:CID}]);
  nr.onConnection(c=>{BNET.connected=c;render();},()=>{BNET.connected=false;render();});
  BNET.unsub=nr.onPeers(bjOnPeersHost);
  prevBV=null;APP.screen="bj-table";APP.sheet=null;bjChanged();
}
function bjOnPeersHost(ch){
  if(!B||dupHost("bj",ch))return;
  let dirty=false;const here=new Set();
  for(const peer of ch.peers){
    if(peer.sameTab)continue;
    const pr=peer.presence||{};
    if(typeof pr.cid!=="string"||pr.cid===CID||pr.role==="host"||pr.game!=="bj")continue;
    here.add(pr.cid);
    const name=String(pr.name||"Player").slice(0,14);
    const bet=Number.isFinite(pr.bet)?Math.max(0,Math.floor(pr.bet/10)*10):0;
    const f={ch:Number.isFinite(pr.chips)?pr.chips:START_CHIPS,bet,ready:typeof pr.ready==="string"?pr.ready:null};
    const old=BNET.info[pr.cid];if(!old||old.ch!==f.ch)dirty=true;
    BNET.info[pr.cid]=f;
    let i=B.players.findIndex(x=>x.cid===pr.cid);
    if(i<0&&B.players.length<6){B.players.push(bjPlayer(name,pr.cid));i=B.players.length-1;dirty=true;}
    if(i<0)continue;
    const pl=B.players[i];
    if(pl.name!==name){pl.name=name;dirty=true;}
    if(B.phase==="bet"){const rd=f.ready===B.betId;if(pl.bet!==bet||pl.ready!==rd){pl.bet=bet;pl.ready=rd;dirty=true;}}
    const key=pr.cid+":"+pr.nonce,seen=BNET.seen[key]||0;let max=seen;
    if(Array.isArray(pr.acts))for(const a of pr.acts){
      if(!a||!(a.n>seen))continue;max=Math.max(max,a.n);
      if(a.g===B.gid)bjAction(i,a.a,a.h);
    }
    BNET.seen[key]=max;
  }
  if(B.phase==="bet"){
    const before=B.players.length;
    B.players=B.players.filter(p=>p.cid===CID||here.has(p.cid));
    if(B.players.length!==before)dirty=true;
  }
  if(dirty)bjChanged();
}

/* online: guest */
async function bjJoin(){
  const code=APP.joinCode.trim().toLowerCase();
  if(!/^[a-z0-9]{4}$/.test(code)){APP.err="Enter the 4-character code from the host's screen.";render();return;}
  if(!NET.room)return;
  APP.err="";let nr;
  try{nr=await NET.room.join("bj-"+code);}catch(e){APP.err="Couldn't reach that table. Check the code and try again.";render();return;}
  BNET.nr=nr;APP.bj="client";BNET.code=code;BNET.host=null;BNET.hostGone=false;BNET.connected=true;BV=null;prevBV=null;B=null;
  BNET.my={bet:wallet.get()>=BJ_MIN?BJ_MIN:0,ready:null,n:0,acts:[],nonce:rid(6)};
  bjGuestPresence();
  nr.onConnection(c=>{BNET.connected=c;render();},()=>{BNET.connected=false;render();});
  BNET.unsub=nr.onPeers(bjOnPeersClient);
  APP.screen="bj-table";APP.sheet=null;
  clearTimeout(BNET.searchTimer);BNET.searchTimer=setTimeout(()=>{if(!BNET.host){BNET.hostGone=true;render();}},6000);
  render();
}
function bjGuestPresence(){
  BNET.nr?.presence({cid:CID,game:"bj",name:APP.myName.trim()||"Player",nonce:BNET.my.nonce,chips:wallet.get(),
    bet:BNET.my.bet,ready:BNET.my.ready,acts:BNET.my.acts}).catch(()=>{});
}
function bjOnPeersClient(ch){
  const h=ch.peers.find(p=>p.presence&&p.presence.role==="host"&&p.presence.game==="bj"&&p.presence.code===BNET.code);
  if(!h){if(BNET.host){BNET.hostGone=true;hostMissing("bj");render();}return;}
  BNET.hostGone=false;hostSeen("bj");BNET.host=h.presence;
  const v=h.presence.v;
  if(v&&(!BV||v.seq!==BV.seq||v.gid!==BV.gid))BV=v;
  render();
}
function bjGuestBet(v){
  if(!BV||BV.ph!=="bet"||BNET.my.ready===BV.betId)return;
  const ch=wallet.get();
  if(v===0)BNET.my.bet=0;else if(BNET.my.bet+v<=ch)BNET.my.bet+=v;else return;
  BNET.nr?.presence({bet:BNET.my.bet,chips:ch}).catch(()=>{});render();
}
function bjGuestLock(){
  if(!BV||BV.ph!=="bet")return;
  const locked=BNET.my.ready===BV.betId;
  if(!locked&&(BNET.my.bet<BJ_MIN||BNET.my.bet>wallet.get()))return;
  BNET.my.ready=locked?null:BV.betId;
  BNET.nr?.presence({ready:BNET.my.ready,bet:BNET.my.bet,chips:wallet.get()}).catch(()=>{});render();
}
function bjSend(a){
  const v=BV;if(!v||v.ph!=="play"||!v.turn||!v.pl[v.turn.p]||v.pl[v.turn.p].c!==CID)return;
  const n=++BNET.my.n;
  BNET.my.acts=[...BNET.my.acts.slice(-7),{n,a,g:v.gid,h:v.turn.h}];
  BNET.nr?.presence({acts:BNET.my.acts}).catch(()=>{});
}
async function bjLeave(){
  lobbyAnnounce(null);if(curOnline())forgetTable();
  clearTimeout(BNET.searchTimer);bjStop();
  try{await BNET.nr?.leave();}catch(e){}
  BNET.nr=null;BNET.host=null;APP.bj="local";APP.screen="bj-mode";APP.sheet=null;render();
}

function bjBox(v,i,mine,pv){
  const p=v.pl[i],local=APP.bj==="local",me=i===mine,online=APP.bj==="host"||APP.bj==="client";
  const chips=local?localChips.get(p.n):me&&online?wallet.get():p.ch;
  const turnP=v.ph==="play"&&v.turn&&v.turn.p===i;
  const hostCid=APP.bj==="host"?CID:BNET.host&&BNET.host.cid;
  let body;
  if(v.ph==="bet"){
    const bet=me&&APP.bj==="client"?BNET.my.bet:p.bet;
    const guest=online&&p.c!==hostCid,ready=me&&APP.bj==="client"?BNET.my.ready===v.betId:!!p.rd;
    let st;
    if(chips<BJ_MIN)st=`<span class="warnt">Out of chips · sitting out</span>${local&&!bonus.localWait(p.n)?`<button class="link" data-act="bonus-local" data-i="${i}">Claim free ${BONUS}</button>`:""}`;
    else if(bet<BJ_MIN)st="Sitting out this hand";
    else st=`Bet <span class="chip">${fmt(bet)}</span>${guest?(ready?`<span class="ok" style="color:#9fd46b">locked ✓</span>`:"choosing…"):""}`;
    body=`<div class="st2">${st}</div>${local&&chips>=BJ_MIN?bjTokens(i,bet,chips,true):""}`;
  }else if(!p.in){
    body=`<div class="st2">Sitting out this hand</div>`;
  }else{
    const same=pv&&pv.gid===v.gid,pp=same&&pv.pl.find(x=>x.c===p.c&&x.n===p.n);
    body=p.h.map((h,k)=>{
      const act=turnP&&v.turn.h===k,res=h.r?BJ_RES[h.r]:null,ph=pp&&pp.h[k];

/* ================= Baccarat ================= */
const BC_MIN=10, BC_SIDES={player:["Player","1:1"],tie:["Tie","8:1"],banker:["Banker","0.95:1"]};
const bcVal=r=>r>=10?0:r;
const bcTot=cards=>cards.reduce((s,c)=>s+bcVal(c[0]),0)%10;
function bcShoe(){const s=[];for(let d=0;d<8;d++)for(let su=0;su<4;su++)for(let r=1;r<=13;r++)s.push([r,su]);return shuffle(s);}
let C=null,CVw=null,prevCV=null,bcTimer=null;
const CNET={nr:null,code:"",info:{},host:null,hostGone:false,connected:true,searchTimer:null,my:{bet:BC_MIN,side:"player",ready:null}};

/* engine */
function bcFreeColor(){const used=new Set(C.players.map(p=>p.color));return COLORS.find(c=>!used.has(c))||COLORS[0];}
function bcPlayer(name,cid){return{name,cid:cid||null,color:bcFreeColor(),bet:BC_MIN,side:"player",ready:false,inRound:false,net:null};}
function bcNewTable(seats){
  clearTimeout(bcTimer);
  C={shoe:bcShoe(),seq:0,gid:rid(8),betId:rid(6),phase:"bet",order:[],shown:0,natural:false,winner:null,result:null,history:[],toast:null,players:[]};
  seats.forEach(s=>{const p=bcPlayer(s.name,s.cid);p.bot=!!s.bot;C.players.push(p);});
  C.players.forEach((p,i)=>{if(p.bet>bcChips(i))p.bet=0;});
}
function bcChips(i){
  const p=C.players[i];
  if(APP.bc==="practice")return prChips(p.name);
  if(APP.bc==="local")return localChips.get(p.name);
  if(p.cid===CID)return wallet.get();
  const f=CNET.info[p.cid];return f&&Number.isFinite(f.ch)?f.ch:START_CHIPS;
}
function bcCanPlay(i){
  const p=C.players[i],ch=bcChips(i);
  if(!BC_SIDES[p.side]||p.bet<BC_MIN||p.bet>ch)return false;
  if(APP.bc==="host"&&p.cid!==CID)return p.ready;
  return true;
}
function bcDraw(){if(!C.shoe.length)C.shoe=bcShoe();return C.shoe.pop();}
function bcDeal(){
  if(!C||C.phase!=="bet")return;
  const active=C.players.map((_,i)=>i).filter(bcCanPlay);
  if(!active.length)return;
  if(C.shoe.length<60){C.shoe=bcShoe();C.toast={id:rid(5),text:"Fresh 8-deck shoe shuffled"};}else C.toast=null;
  C.gid=rid(8);
  C.players.forEach((p,i)=>{p.inRound=active.includes(i);p.net=null;});
  const P=[bcDraw()],K=[bcDraw()];P.push(bcDraw());K.push(bcDraw());
  const order=[["p",P[0]],["b",K[0]],["p",P[1]],["b",K[1]]];
  let pt=bcTot(P),bt=bcTot(K);
  const natural=pt>=8||bt>=8;
  if(!natural){
    let p3=null;
    if(pt<=5){p3=bcDraw();P.push(p3);order.push(["p",p3]);}  // Player draws on 0–5, stands on 6–7
    let draw;
    if(p3===null)draw=bt<=5;                                   // Player stood: Banker uses the same rule
    else{const v=bcVal(p3[0]);
      draw=bt<=2||(bt===3&&v!==8)||(bt===4&&v>=2&&v<=7)||(bt===5&&v>=4&&v<=7)||(bt===6&&(v===6||v===7));}
    if(draw){const c=bcDraw();K.push(c);order.push(["b",c]);}
    pt=bcTot(P);bt=bcTot(K);
  }
  C.order=order;C.shown=0;C.natural=natural;C.winner=null;C.phase="deal";
  C.result={p:pt,b:bt,w:pt>bt?"player":bt>pt?"banker":"tie"};
  const step=()=>{
    if(!C)return;
    C.shown++;
    if(C.shown<C.order.length){bcChanged();bcTimer=setTimeout(step,C.shown<4?500:950);}
    else{bcFinish();bcChanged();}
  };
  clearTimeout(bcTimer);bcTimer=setTimeout(step,350);
}
function bcPay(side,bet,w){
  if(w==="tie")return side==="tie"?8*bet:0;           // Player and Banker bets push on a tie
  if(side!==w)return -bet;
  return w==="banker"?Math.floor(bet*0.95):bet;       // 5% commission on Banker wins, rounded down
}
function bcFinish(){
  const r=C.result;C.phase="done";C.winner=r.w;
  for(const p of C.players)if(p.inRound)p.net=bcPay(p.side,p.bet,r.w);
  C.explain=bcExplain();
  C.history.push({w:r.w[0],t:r.w==="banker"?r.b:r.p});
  if(C.history.length>40)C.history.shift();
}
function bcNextHand(){
  if(!C||C.phase!=="done")return;
  clearTimeout(bcTimer);
  C.phase="bet";C.betId=rid(6);C.order=[];C.shown=0;C.winner=null;C.toast=null;
  C.players.forEach((p,i)=>{p.inRound=false;p.net=null;p.ready=false;const ch=bcChips(i);if(p.bet>ch)p.bet=Math.floor(ch/10)*10;});
  if(APP.bc==="host")C.players.forEach(p=>{const f=CNET.info[p.cid];if(f&&p.cid!==CID){p.bet=f.bet;p.side=f.side;p.ready=f.ready===C.betId;}});
  if(APP.bc==="practice")prBcBets();
  bcChanged();
}
function bcSetBet(i,v){
  if(!C||C.phase!=="bet"||!C.players[i])return;
  const p=C.players[i],ch=bcChips(i);
  if(v===0)p.bet=0;else if(p.bet+v<=ch)p.bet+=v;else return;
  bcChanged();
}
function bcSetSide(i,s){if(!C||C.phase!=="bet"||!C.players[i]||!BC_SIDES[s])return;C.players[i].side=s;bcChanged();}
function bcView(){
  C.seq++;
  const vis=C.order.slice(0,C.shown);
  return{seq:C.seq,gid:C.gid,betId:C.betId,ph:C.phase,shoe:C.shoe.length,
    P:vis.filter(x=>x[0]==="p").map(x=>x[1]),B:vis.filter(x=>x[0]==="b").map(x=>x[1]),
    win:C.phase==="done"?C.winner:null,nat:C.phase==="done"&&C.natural?1:0,hist:C.history.slice(-30),toast:C.toast,
    ex:C.phase==="done"&&APP.bc==="practice"?C.explain:"",
    pl:C.players.map((p,i)=>({n:p.name,c:p.cid,col:p.color,bet:p.bet,s:p.side,rd:p.ready?1:0,in:p.inRound?1:0,ch:bcChips(i),net:p.net}))};
}
function bcChanged(){
  if(!C)return;
  CVw=bcView();
  if(APP.bc==="host"&&CNET.nr){CNET.nr.presence({role:"host",game:"bc",hs:CNET.hs,code:CNET.code,cid:CID,v:CVw}).catch(()=>{});
    lobbyAnnounce({g:"bc",code:CNET.code,name:myName(),n:C.players.length});}
  render();
}
function bcSettle(){
  const v=CVw;if(!v||v.ph!=="done"||settled(v.gid))return;
  if(APP.bc==="practice"){markSettled(v.gid);v.pl.forEach(p=>{if(p.in&&p.net)prSet(p.n,prChips(p.n)+p.net);});setTimeout(bcChanged,0);return;}
  if(APP.bc==="local"){markSettled(v.gid);v.pl.forEach(p=>{if(p.in&&p.net)localChips.set(p.n,localChips.get(p.n)+p.net);});return;}
  const me=v.pl.find(p=>p.c===CID);if(!me||!me.in||me.net==null)return;
  markSettled(v.gid);wallet.set(wallet.get()+me.net);stHand("bc",me.net);
  if(APP.bc==="client")CNET.nr?.presence({chips:wallet.get()}).catch(()=>{});
  else setTimeout(bcChanged,0);
}
function bcStop(){clearTimeout(bcTimer);C=null;CVw=null;prevCV=null;}

/* online */
async function bcHost(){
  if(!NET.room)return;
  APP.err="";const code=rid(4);let nr;
  try{nr=await NET.room.join("bc-"+code);}catch(e){APP.err="Couldn't open a table. Try again in a moment.";render();return;}
  CNET.nr=nr;APP.bc="host";CNET.code=code;CNET.info={};CNET.connected=true;CNET.hs=Date.now();
  bcNewTable([{name:APP.myName.trim()||"Host",cid:CID}]);
  nr.onConnection(c=>{CNET.connected=c;render();},()=>{CNET.connected=false;render();});
  CNET.unsub=nr.onPeers(bcOnPeersHost);
  prevCV=null;APP.screen="bc-table";APP.sheet=null;bcChanged();
}
function bcOnPeersHost(ch){
  if(!C||dupHost("bc",ch))return;
  let dirty=false;const here=new Set();
  for(const peer of ch.peers){
    if(peer.sameTab)continue;
    const pr=peer.presence||{};
    if(typeof pr.cid!=="string"||pr.cid===CID||pr.role==="host"||pr.game!=="bc")continue;
    here.add(pr.cid);
    const name=String(pr.name||"Player").slice(0,14);
    const f={ch:Number.isFinite(pr.chips)?pr.chips:START_CHIPS,bet:Number.isFinite(pr.bet)?Math.max(0,Math.floor(pr.bet/10)*10):0,
      side:BC_SIDES[pr.side]?pr.side:"player",ready:typeof pr.ready==="string"?pr.ready:null};
    const old=CNET.info[pr.cid];if(!old||old.ch!==f.ch)dirty=true;
    CNET.info[pr.cid]=f;
    let i=C.players.findIndex(x=>x.cid===pr.cid);
    if(i<0&&C.players.length<6){C.players.push(bcPlayer(name,pr.cid));i=C.players.length-1;dirty=true;}
    if(i<0)continue;
    const pl=C.players[i];
    if(pl.name!==name){pl.name=name;dirty=true;}
    if(C.phase==="bet"){const rd=f.ready===C.betId;
      if(pl.bet!==f.bet||pl.side!==f.side||pl.ready!==rd){pl.bet=f.bet;pl.side=f.side;pl.ready=rd;dirty=true;}}
  }
  if(C.phase==="bet"){const before=C.players.length;C.players=C.players.filter(p=>p.cid===CID||here.has(p.cid));if(C.players.length!==before)dirty=true;}
  if(dirty)bcChanged();
}
async function bcJoin(){
  const code=APP.joinCode.trim().toLowerCase();
  if(!/^[a-z0-9]{4}$/.test(code)){APP.err="Enter the 4-character code from the host's screen.";render();return;}
  if(!NET.room)return;
  APP.err="";let nr;
  try{nr=await NET.room.join("bc-"+code);}catch(e){APP.err="Couldn't reach that table. Check the code and try again.";render();return;}
  CNET.nr=nr;APP.bc="client";CNET.code=code;CNET.host=null;CNET.hostGone=false;CNET.connected=true;CVw=null;prevCV=null;C=null;
  CNET.my={bet:wallet.get()>=BC_MIN?BC_MIN:0,side:"player",ready:null};
  CNET.nr.presence({cid:CID,game:"bc",name:APP.myName.trim()||"Player",chips:wallet.get(),bet:CNET.my.bet,side:CNET.my.side,ready:null}).catch(()=>{});
  nr.onConnection(c=>{CNET.connected=c;render();},()=>{CNET.connected=false;render();});
  CNET.unsub=nr.onPeers(ch=>{
    const h=ch.peers.find(p=>p.presence&&p.presence.role==="host"&&p.presence.game==="bc"&&p.presence.code===CNET.code);
    if(!h){if(CNET.host){CNET.hostGone=true;hostMissing("bc");render();}return;}

/* ================= Jacks or Better (9/6 video poker) ================= */
const JB_ROWS=[["royal","Royal Flush",250],["sf","Straight Flush",50],["quads","Four of a Kind",25],["fh","Full House",9],["flush","Flush",6],
  ["straight","Straight",4],["trips","Three of a Kind",3],["twopair","Two Pair",2],["jacks","Jacks or Better",1]];
const JB_NAME=Object.fromEntries(JB_ROWS.map(r=>[r[0],r[1]]));
const jbPay=(k,c)=>k==="royal"?(c===5?4000:250*c):JB_ROWS.find(r=>r[0]===k)[2]*c;
const hv=r=>r===1?14:r;
const jbDeck=()=>{const d=[];for(let s=0;s<4;s++)for(let r=1;r<=13;r++)d.push([r,s]);return shuffle(d);};
let J=null;
function jbEval(cs){
  const rs=cs.map(c=>hv(c[0])).sort((a,b)=>a-b),flush=cs.every(c=>c[1]===cs[0][1]);
  const cnt={};rs.forEach(r=>cnt[r]=(cnt[r]||0)+1);
  const g=Object.values(cnt).sort((a,b)=>b-a);
  const straight=g.length===5&&(rs[4]-rs[0]===4||rs.join()==="2,3,4,5,14");
  if(straight&&flush)return rs[0]===10?"royal":"sf";
  if(g[0]===4)return"quads";
  if(g[0]===3&&g[1]===2)return"fh";
  if(flush)return"flush";
  if(straight)return"straight";
  if(g[0]===3)return"trips";
  if(g[0]===2&&g[1]===2)return"twopair";
  if(g[0]===2&&+Object.keys(cnt).find(k=>cnt[k]===2)>=11)return"jacks";
  return null;
}
/* Simple 9/6 strategy, in priority order (within a fraction of a percent of perfect play) */
function jbAdvice(cs){
  const idx=[0,1,2,3,4],ev=jbEval(cs),R=i=>hv(cs[i][0]),S=i=>cs[i][1];
  const plural=r=>({11:"Jacks",12:"Queens",13:"Kings",14:"Aces"}[r]||r+"s");
  const bySuit=s=>idx.filter(i=>S(i)===s),royalOf=s=>bySuit(s).filter(i=>R(i)>=10);
  const byRank={};idx.forEach(i=>(byRank[R(i)]=byRank[R(i)]||[]).push(i));
  if(["royal","sf","quads","fh"].includes(ev))return{hold:idx,why:`${JB_NAME[ev]}! Hold all five.`};
  for(let s=0;s<4;s++){const r=royalOf(s);if(r.length===4)return{hold:r,why:"Four to a royal flush. Break up anything else and go for it."};}
  if(ev==="straight"||ev==="flush")return{hold:idx,why:`A ${JB_NAME[ev].toLowerCase()} already pays. Hold all five.`};
  if(ev==="trips")return{hold:Object.values(byRank).find(a=>a.length===3),why:"Hold the three of a kind and draw two. It could become a full house or four of a kind."};
  if(ev==="twopair")return{hold:Object.values(byRank).filter(a=>a.length===2).flat(),why:"Hold both pairs and draw one for a shot at a full house."};
  const pairs=Object.entries(byRank).filter(([,a])=>a.length===2);
  const hi=pairs.find(([r])=>+r>=11);
  if(hi)return{hold:hi[1],why:`Hold the pair of ${plural(+hi[0])}. It already pays your bet back and can improve.`};
  for(let s=0;s<4;s++){const r=royalOf(s);if(r.length===3)return{hold:r,why:"Three to a royal flush. That beats a four-card flush or a low pair here."};}
  for(let s=0;s<4;s++){const f=bySuit(s);if(f.length===4)return{hold:f,why:"Four to a flush. 9 of the 47 cards left complete it."};}
  if(pairs.length)return{hold:pairs[0][1],why:`Hold the pair of ${plural(+pairs[0][0])}. A low pair doesn't pay, but it can become two pair or three of a kind.`};
  for(let lo=2;lo<=10;lo++)if([0,1,2,3].every(k=>byRank[lo+k]))
    return{hold:[0,1,2,3].map(k=>byRank[lo+k][0]),why:"Four in a row, open at both ends. Eight cards complete the straight."};
  const high=idx.filter(i=>R(i)>=11).sort((a,b)=>R(a)-R(b));
  for(let s=0;s<4;s++){const h=high.filter(i=>S(i)===s);if(h.length>=2)return{hold:h.slice(0,2),why:"Two suited high cards. They can pair up, or grow into a flush or royal."};}
  for(let s=0;s<4;s++){const f=bySuit(s);if(f.length===3){
    const span=v=>Math.max(...v)-Math.min(...v),hiR=f.map(R),loR=hiR.map(r=>r===14?1:r);
    if(span(hiR)<=4||span(loR)<=4)return{hold:f,why:"Three to a straight flush. Small odds, big payout."};}}
  if(high.length>=2)return{hold:high.slice(0,2),why:high.length>2?"With three or more high cards in different suits, keep the lowest two. They leave more ways to make a straight.":"Two high cards. Pairing either one pays your bet back."};
  const ten=idx.find(i=>R(i)===10);

/* ================= Texas Hold'em (no-limit) ================= */
const HM_BLINDS=[[5,10],[10,20],[25,50]];
const HM_CATS=["High Card","One Pair","Two Pair","Three of a Kind","Straight","Flush","Full House","Four of a Kind","Straight Flush"];
const HM_STREETS=["Pre-flop","Flop","Turn","River"];
const rn=r=>({14:"Ace",13:"King",12:"Queen",11:"Jack"}[r]||String(r));
const rp=r=>({14:"Aces",13:"Kings",12:"Queens",11:"Jacks"}[r]||r+"s");
function rank5(cs){
  const rs=cs.map(c=>hv(c[0])).sort((a,b)=>b-a),flush=cs.every(c=>c[1]===cs[0][1]);
  const cnt={};rs.forEach(r=>cnt[r]=(cnt[r]||0)+1);
  const g=Object.entries(cnt).map(([r,n])=>[n,+r]).sort((a,b)=>b[0]-a[0]||b[1]-a[1]);
  let sh=0;if(g.length===5){if(rs[0]-rs[4]===4)sh=rs[0];else if(rs[0]===14&&rs[1]===5)sh=5;}
  let cat,ks;
  if(sh&&flush){cat=8;ks=[sh];}
  else if(g[0][0]===4){cat=7;ks=[g[0][1],g[1][1]];}
  else if(g[0][0]===3&&g[1][0]===2){cat=6;ks=[g[0][1],g[1][1]];}
  else if(flush){cat=5;ks=rs;}
  else if(sh){cat=4;ks=[sh];}
  else{cat=g[0][0]===3?3:g[0][0]===2&&g[1][0]===2?2:g[0][0]===2?1:0;ks=g.map(x=>x[1]);}
  let s=cat;for(let i=0;i<5;i++)s=s*15+(ks[i]||0);return s;
}
/* fast 6/7-card scorer: same score as trying every 5-card hand, without building 21 hands */
function fastScore(cs){
  const cnt=new Array(15).fill(0),sc=[0,0,0,0],sm=[0,0,0,0];let mask=0;
  for(const c of cs){const r=c[0]===1?14:c[0];cnt[r]++;sc[c[1]]++;sm[c[1]]|=1<<r;mask|=1<<r;}
  const pack=(cat,ks)=>{let s=cat;for(let i=0;i<5;i++)s=s*15+(ks[i]||0);return s;};
  const straight=m=>{if(m&(1<<14))m|=2;for(let h=14;h>=5;h--){const run=31<<(h-4);if((m&run)===run)return h;}return 0;};
  let fs=-1;for(let k=0;k<4;k++)if(sc[k]>=5)fs=k;
  if(fs>=0){const sh=straight(sm[fs]);if(sh)return pack(8,[sh]);}
  const quads=[],trips=[],pairs=[],singles=[];
  for(let r=14;r>=2;r--){const n=cnt[r];if(n===4)quads.push(r);else if(n===3)trips.push(r);else if(n===2)pairs.push(r);else if(n===1)singles.push(r);}
  const topOther=ex=>{for(let r=14;r>=2;r--)if(cnt[r]&&!ex.includes(r))return r;return 0;};
  if(quads.length)return pack(7,[quads[0],topOther([quads[0]])]);
  if(trips.length&&(trips.length>1||pairs.length)){const t=trips[0],pr=Math.max(trips[1]||0,pairs[0]||0);return pack(6,[t,pr]);}
  if(fs>=0){const ks=[];for(let r=14;r>=2&&ks.length<5;r--)if(sm[fs]&(1<<r))ks.push(r);return pack(5,ks);}
  const sh=straight(mask);if(sh)return pack(4,[sh]);
  const rest=ex=>{const o=[];for(let r=14;r>=2;r--)if(cnt[r]&&!ex.includes(r))o.push(r);return o;};
  if(trips.length){const t=trips[0];return pack(3,[t,...rest([t]).slice(0,2)]);}
  if(pairs.length>=2){const a=pairs[0],b=pairs[1];return pack(2,[a,b,rest([a,b])[0]]);}
  if(pairs.length){const a=pairs[0];return pack(1,[a,...rest([a]).slice(0,3)]);}
  return pack(0,rest([]).slice(0,5));
}
function bestScore(cs){
  const n=cs.length;if(n===5)return rank5(cs);
  if(n>5)return fastScore(cs);
  let b=0;
  if(n===6){for(let i=0;i<6;i++){const s=rank5(cs.filter((_,k)=>k!==i));if(s>b)b=s;}return b;}
  for(let i=0;i<7;i++)for(let j=i+1;j<7;j++){const s=rank5(cs.filter((_,k)=>k!==i&&k!==j));if(s>b)b=s;}
  return b;
}
function hmBest(cs){
  const s=bestScore(cs),d=[];let x=s;for(let i=0;i<5;i++){d.unshift(x%15);x=Math.floor(x/15);}
  const cat=x;let name;
  switch(cat){
    case 8:name=d[0]===14?"Royal Flush":`Straight Flush, ${rn(d[0])} high`;break;
    case 7:name=`Four ${rp(d[0])}`;break;
    case 6:name=`Full House, ${rp(d[0])} over ${rp(d[1])}`;break;
    case 5:name=`Flush, ${rn(d[0])} high`;break;
    case 4:name=`Straight, ${rn(d[0])} high`;break;
    case 3:name=`Three ${rp(d[0])}`;break;
    case 2:name=`Two Pair, ${rp(d[0])} and ${rp(d[1])}`;break;
    case 1:name=`Pair of ${rp(d[0])}`;break;
    default:name=`${rn(d[0])} high`;
  }
  return{score:s,cat,name};
}
function hmStartName(h){
  const a=hv(h[0][0]),b=hv(h[1][0]);
  if(a===b)return`Pocket ${rp(a)}`;
  const hi=Math.max(a,b),lo=Math.min(a,b);
  return`${rn(hi)}-${rn(lo)}${h[0][1]===h[1][1]?" suited":""}`;

function hmEquity(hole,board,nOpp,iters){
  const known=new Set([...hole,...board].map(c=>c[0]*4+c[1]));
  const deck=[];for(let s=0;s<4;s++)for(let r=1;r<=13;r++)if(!known.has(r*4+s))deck.push([r,s]);
  const need=5-board.length,take=need+2*nOpp;let win=0;
  for(let t=0;t<iters;t++){
    for(let k=0;k<take;k++){const j=k+Math.floor(Math.random()*(deck.length-k));const tmp=deck[k];deck[k]=deck[j];deck[j]=tmp;}
    const b=board.concat(deck.slice(0,need));
    const me=bestScore(hole.concat(b));let best=0,ties=0;
    for(let o=0;o<nOpp;o++){const s=bestScore([deck[need+2*o],deck[need+2*o+1]].concat(b));if(s>best){best=s;ties=0;}if(s===best)ties++;}
    if(me>best)win++;else if(me===best)win+=1/(ties+1);
  }
  return win/iters;
}

/* hole-card privacy for online play: each guest shares a public key; the host encrypts that guest's two cards for them alone */
const b64=buf=>{let s="";new Uint8Array(buf).forEach(b=>s+=String.fromCharCode(b));return btoa(s);};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));

async function ecKeys(){const kp=await crypto.subtle.generateKey({name:"ECDH",namedCurve:"P-256"},false,["deriveKey"]);return{kp,pub:b64(await crypto.subtle.exportKey("raw",kp.publicKey))};}
async function ecShared(kp,pub){const pk=await crypto.subtle.importKey("raw",unb64(pub),{name:"ECDH",namedCurve:"P-256"},false,[]);
  return crypto.subtle.deriveKey({name:"ECDH",public:pk},kp.privateKey,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);}
async function aesEnc(key,obj){const iv=crypto.getRandomValues(new Uint8Array(12));
  return b64(iv)+"."+b64(await crypto.subtle.encrypt({name:"AES-GCM",iv},key,new TextEncoder().encode(JSON.stringify(obj))));}
async function aesDec(key,s){const [iv,ct]=s.split(".").map(unb64);return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv},key,ct)));}

  H.gid=rid(8);H.phase="hand";H.board=[];H.deck=jbDeck();H.street=0;H.results=null;H.toast=null;H.actN=0;H.runout=false;H.showdown=false;H.eh={};

function hmOpts(i){

function hmFinish(){
  clearTimeout(hmTimer);
  H.phase="done";H.turn=-1;H.runout=false;H.players.forEach(p=>p.bet=0);
  const inH=H.players.filter(p=>p.inHand),live=inH.filter(p=>!p.folded),n=H.players.length;
  const dist=p=>((H.players.indexOf(p)-H.button+n-1)%n);   // seats left of the button come first for odd chips
  const res=[];
  if(live.length===1){
    const w=live[0],pot=inH.reduce((s,p)=>s+p.total,0);w.stack+=pot;H.showdown=false;
    res.push({w:[w.name],amt:pot,hand:null});
  }else{
    H.showdown=true;

    const levels=[...new Set(inH.map(p=>p.total))].filter(x=>x>0).sort((a,b)=>a-b);
    let prev=0;
    for(const lv of levels){
      let pot=0;inH.forEach(p=>pot+=Math.max(0,Math.min(p.total,lv)-prev));
      if(pot>0){

        const top=Math.max(...elig.map(p=>p.best.score));
        const ws=elig.filter(p=>p.best.score===top).sort((a,b)=>dist(a)-dist(b));
        const share=Math.floor(pot/ws.length);let rem=pot-share*ws.length;
        ws.forEach(w=>{w.stack+=share+(rem>0?1:0);if(rem>0)rem--;});
        const last=res[res.length-1],key=ws.map(w=>w.name).join("|");

/* bots and coach */
function hmEasyStrength(hole,board){
  if(board.length<3){const a=hv(hole[0][0]),b=hv(hole[1][0]);return a===b?.55+a/40:(a+b)/40+(hole[0][1]===hole[1][1]?.05:0);}
  const c=hmBest([...hole,...board]).cat;return c===0?.15:c===1?.45:c===2?.7:.9;
}
function hmBotMove(i){
  const p=H.players[i],o=hmOpts(i),pot=hmPot(),d=PR.diff,r=Math.random();
  const opp=Math.max(1,H.players.filter((q,j)=>j!==i&&q.inHand&&!q.folded).length);
  const sizeTo=f=>Math.max(o.minTo,Math.min(o.maxTo,H.curBet+Math.round(f*(pot+o.toCall)/H.sb)*H.sb));
  const need=o.toCall/(pot+o.toCall||1);
  if(d==="easy"){
    const s=hmEasyStrength(p.hole,H.board);
    if(o.toCall===0)return o.canRaise&&s>.7&&r<.4?["raise",sizeTo(.5)]:["check"];
    if(o.toCall>=p.stack*.5&&s<.5&&r<.6)return["fold"];
    if(s<.25&&o.toCall>H.bb*4&&r<.5)return["fold"];
    return o.canRaise&&s>.85&&r<.3?["raise",sizeTo(.6)]:["call"];
  }
  const eq=hmEquity(p.hole,H.board,opp,d==="hard"?300:150);
  if(d==="medium"){
    if(o.toCall===0){if(o.canRaise&&(eq>.62||r<.05))return["raise",sizeTo(.55)];return["check"];}
    if(o.canRaise&&eq>.78)return["raise",sizeTo(.75)];
    return eq>need+.04||(eq>need-.04&&r<.3)?["call"]:["fold"];
  }
  const vt=opp>=3?.5:opp===2?.58:.65;
  if(o.toCall===0){
    if(o.canRaise&&eq>vt)return["raise",sizeTo(r<.5?.6:.8)];
    if(o.canRaise&&H.street>=1&&opp<=2&&r<.12)return["raise",sizeTo(.5)];
    return["check"];
  }
  if(o.canRaise&&eq>vt+.15)return["raise",sizeTo(.8)];
  if(eq>need+.02)return["call"];
  if(o.canRaise&&H.street>=1&&opp===1&&r<.04)return["raise",sizeTo(.9)];
  return["fold"];
}
function hmBotTick(){
  if(APP.hm!=="practice"||!H||H.phase!=="hand"||H.runout||H.turn<0)return;
  const i=H.turn;if(!H.players[i].bot)return;
  const key="h"+H.gid+":"+H.actN;if(PR.keys[key])return;PR.keys[key]=1;
  prTimer(()=>{if(!H||H.phase!=="hand"||H.turn!==i)return;const [a,amt]=hmBotMove(i);hmAct(i,a,amt);},800+Math.random()*700);
}
function hmGoneTick(){
  if(APP.hm!=="host"||!H||H.phase!=="hand"||H.runout||H.turn<0||!H.players[H.turn].gone)return;
  const i=H.turn,key=H.gid+":"+H.actN;if(HNET.goneKey===key)return;HNET.goneKey=key;
  setTimeout(()=>{if(H&&H.phase==="hand"&&H.turn===i&&H.players[i].gone)hmAct(i,"fold");},2000);
}
function hmCoach(v){
  if(APP.hm!=="practice"||!PR.coach)return"";
  const me=v.pl[0];if(!me||!me.in||me.f||!me.h||v.ph!=="hand")return"";
  const {eq,opp}=hmEq(v,me.h);
  const made=v.board.length>=3?hmBest([...me.h,...v.board]).name:hmStartName(me.h);
  let adv="";
  if(v.turn===0&&v.opt){
    const o=v.opt,need=o.toCall/(v.pot+o.toCall);
    if(o.toCall===0)adv=eq>.6&&o.canRaise?" <b>Bet</b> about half to three-quarters of the pot. You're likely ahead.":eq>.45?" <b>Check</b> or make a small bet. It's close.":" <b>Check</b> and see the next card for free.";
    else if(eq>.7&&o.canRaise)adv=" <b>Raise.</b> You're a strong favorite.";
    else if(eq>=need)adv=` <b>Call.</b> You need ${pct(need)} to break even and have about ${pct(eq)}.`;
    else adv=` <b>Fold.</b> You need ${pct(need)} to break even but have about ${pct(eq)}.`;
  }
  return`<div class="coach"><b>${esc(made)}</b> · about ${pct(eq)} to win against ${opp} ${opp===1?"player":"players"}.${adv}</div>`;
}

async function hmHost(){

async function hmDerive(cid){
  const f=HNET.info[cid];if(!f||!f.pub||!HNET.ec)return;
  const pub=f.pub;
  try{const k=await ecShared(HNET.ec.kp,pub);if(f.pub===pub){f.key=k;hmEncryptAll();}}catch(e){}
}
async function hmEncryptAll(){
  if(!H||H.phase==="wait")return;
  const gid=H.gid;let any=false;
  for(const p of H.players){
    if(!p.cid||p.cid===CID||!p.inHand||H.eh[p.cid])continue;
    const f=HNET.info[p.cid];if(!f||!f.key)continue;
    try{const s=await aesEnc(f.key,{g:gid,h:p.hole});if(H&&H.gid===gid){H.eh[p.cid]=s;any=true;}}catch(e){}
  }
  if(any)hmChanged();

function hmOnPeersHost(ch){
  if(!H||dupHost("hm",ch))return;
  let dirty=false;const here=new Set();
  for(const peer of ch.peers){
    if(peer.sameTab)continue;
    const pr=peer.presence||{};
    if(typeof pr.cid!=="string"||pr.cid===CID||pr.role==="host"||pr.game!=="hm")continue;
    here.add(pr.cid);
    const name=String(pr.name||"Player").slice(0,14);
    const f=HNET.info[pr.cid]||(HNET.info[pr.cid]={ch:START_CHIPS,rep:null});
    if(Number.isFinite(pr.chips)&&pr.chips!==f.rep){f.rep=pr.chips;f.ch=pr.chips;dirty=true;}
    if(typeof pr.pub==="string"&&pr.pub!==f.pub){f.pub=pr.pub;f.key=null;hmDerive(pr.cid);}
    let i=H.players.findIndex(x=>x.cid===pr.cid);
    if(i<0&&H.players.length<6){H.players.push(hmPlayer(name,pr.cid));i=H.players.length-1;dirty=true;}
    if(i<0)continue;
    const pl=H.players[i];
    if(pl.name!==name){pl.name=name;dirty=true;}
    if(pl.sit!==!!pr.sit){pl.sit=!!pr.sit;dirty=true;}
    if(pl.gone){pl.gone=false;dirty=true;}
    const key=pr.cid+":"+pr.nonce,seen=HNET.seen[key]||0;let max=seen;
    if(Array.isArray(pr.acts))for(const a of pr.acts){
      if(!a||!(a.n>seen))continue;max=Math.max(max,a.n);
      if(a.g===H.gid&&a.k===H.actN)hmAct(i,a.a,a.amt);
    }
    HNET.seen[key]=max;
  }
  H.players.forEach(p=>{if(p.cid&&p.cid!==CID&&!here.has(p.cid)&&!p.gone){p.gone=true;dirty=true;}});
  if(H.phase!=="hand"){
    const b=H.players.length;H.players=H.players.filter(p=>!p.gone);
    if(H.players.length!==b){dirty=true;if(H.button>=H.players.length)H.button=H.players.length-1;}
  }
  if(dirty)hmChanged();
}

/* lay down every pair; with three of a kind, two go down and one stays */
function omRemovePairs(p){
  const by={};p.hand.forEach(c=>(by[c[0]]=by[c[0]]||[]).push(c));
  const keep=[];let made=0;
  for(const r in by){const g=by[r];made+=Math.floor(g.length/2);if(g.length%2)keep.push(g[g.length-1]);}
  p.hand=p.hand.filter(c=>keep.some(d=>sameC(c,d)));p.pairs+=made;return made;
}
function omCheckOut(){OM.players.forEach(p=>{if(p.inRound&&!p.out&&!p.hand.length){OM.outN++;p.out=OM.outN;}});}
function omCheckEnd(){const live=OM.players.map((_,i)=>i).filter(omLive);if(live.length<=1){omFinish(live.length?live[0]:-1);return true;}return false;}
function omStart(){
  if(!omCanDeal())return;
  const elig=OM.players.map((_,i)=>i).filter(omEligible);
  Object.assign(OM,{gid:rid(8),phase:"play",actN:0,toast:null,loser:-1,lastPair:null,lastTake:null,outN:0,eh:{},ehSig:{}});
  OM.players.forEach((p,i)=>{p.inRound=elig.includes(i);p.hand=[];p.out=0;p.pairs=0;p.net=null;p.last="";});
  const deck=jbDeck().filter(c=>!(c[0]===12&&c[1]===3));   // the Queen of Clubs comes out, so one Queen can never be matched
  const n=OM.players.length;
  for(let k=1;k<=n;k++){const i=((OM.dealer<0?n-1:OM.dealer)+k)%n;if(OM.players[i].inRound){OM.dealer=i;break;}}
  let j=OM.dealer;while(deck.length){j=(j+1)%n;if(OM.players[j].inRound)OM.players[j].hand.push(deck.pop());}
  OM.players.forEach(p=>{if(!p.inRound)return;const m=omRemovePairs(p);p.last=m?`Laid down ${m} ${m===1?"pair":"pairs"}`:"No pairs to start";});
  omCheckOut();
  if(omCheckEnd())return;
  OM.from=omNextLive(OM.dealer);       // the player left of the dealer fans their cards first
  OM.turn=omNextLive(OM.from);         // and the player to their left draws
}
function omPick(i,idx){
  if(!OM||OM.phase!=="play"||OM.turn!==i||OM.from<0)return false;
  const g=OM.players[OM.from],p=OM.players[i];if(!g.hand.length)return false;
  idx=Math.max(0,Math.min(g.hand.length-1,idx|0));
  const c=g.hand.splice(idx,1)[0],m=p.hand.findIndex(d=>d[0]===c[0]);
  let pr=0;
  if(m>=0){const d=p.hand.splice(m,1)[0];p.pairs++;pr=c[0];OM.lastPair={by:i,c:[d,c]};p.last=`Paired ${rp(c[0]===1?14:c[0])}`;}
  else{p.hand.splice(Math.floor(Math.random()*(p.hand.length+1)),0,c);p.last=`Took a card from ${g.name}`;}
  OM.lastTake={by:i,from:OM.from,pair:pr};
  OM.actN++;
  omCheckOut();
  if(!omCheckEnd()){
    const nd=omNextLive(i);OM.turn=nd;OM.from=omPrevLive(nd);
    const gv=OM.players[OM.from];if(gv&&gv.bot&&Math.random()<.5)shuffle(gv.hand);
  }
  omChanged();return true;
}
function omShuffle(i){const p=OM&&OM.players[i];if(!p||OM.phase!=="play"||p.hand.length<2)return false;shuffle(p.hand);omChanged();return true;}
function omFinish(L){
  OM.phase="done";OM.turn=-1;OM.from=-1;OM.loser=L;
  const inR=OM.players.map((_,i)=>i).filter(i=>OM.players[i].inRound),pot=OM.buyIn*inR.length;
  const safe=inR.filter(i=>i!==L).sort((a,b)=>(OM.players[a].out||99)-(OM.players[b].out||99));
  inR.forEach(i=>OM.players[i].net=L<0?0:-OM.buyIn);
  if(L>=0&&safe.length){const share=Math.floor(pot/safe.length);let rem=pot-share*safe.length;
    safe.forEach(i=>{OM.players[i].net+=share+(rem>0?1:0);if(rem>0)rem--;});}
  if(APP.om==="host")inR.forEach(i=>{const p=OM.players[i];if(p.cid&&p.cid!==CID){const f=ONET.info[p.cid]||(ONET.info[p.cid]={});f.ch=(Number.isFinite(f.ch)?f.ch:START_CHIPS)+p.net;}});
}
function omView(){
  OM.seq++;
  const online=APP.om==="host",done=OM.phase==="done";
  return{seq:OM.seq,gid:OM.gid,ph:OM.phase,turn:OM.turn,from:OM.from,actN:OM.actN,dealer:OM.dealer,buyIn:OM.buyIn,loser:OM.loser,
    lastPair:OM.lastPair,lastTake:OM.lastTake,toast:OM.toast,tl:clockLeft(OM.turnAt),
    pl:OM.players.map((p,i)=>({n:p.name,c:p.cid,col:p.color,bot:p.bot?1:0,cnt:p.hand.length,in:p.inRound?1:0,sit:p.sit?1:0,gone:p.gone?1:0,
      low:!p.inRound&&omChips(i)<OM.buyIn?1:0,ch:omChips(i),out:p.out,pairs:p.pairs,last:p.last,net:p.net,
      h:(!online||done)&&p.inRound?p.hand:null,
      eh:online&&p.cid&&p.cid!==CID&&!done&&p.inRound?(OM.eh[p.cid]||null):null}))};
}
function omChanged(){
  if(!OM)return;
  omTurnTimer();
  OMV=omView();
  if(APP.om==="host"&&ONET.nr){
    ONET.nr.presence({role:"host",game:"om",hs:ONET.hs,code:ONET.code,cid:CID,pub:ONET.ec&&ONET.ec.pub,v:OMV}).catch(()=>{});
    lobbyAnnounce({g:"om",code:ONET.code,name:myName(),n:OM.players.length});omEncryptAll();}
  render();omBotTick();omGoneTick();
}
let omEncBusy=false,omEncAgain=false;
async function omEncryptAll(){
  if(omEncBusy){omEncAgain=true;return;}
  omEncBusy=true;let any=false;
  try{
    if(OM&&OM.phase==="play"){const gid=OM.gid;
      for(const p of OM.players){
        if(!p.cid||p.cid===CID||!p.inRound)continue;const f=ONET.info[p.cid];if(!f||!f.key)continue;
        const sig=gid+JSON.stringify(p.hand);if(OM.ehSig[p.cid]===sig)continue;
        const s=await aesEnc(f.key,{g:gid,h:p.hand});
        if(OM&&OM.gid===gid&&gid+JSON.stringify(p.hand)===sig){OM.eh[p.cid]=s;OM.ehSig[p.cid]=sig;any=true;}
      }}
  }catch(e){}
  omEncBusy=false;
  if(any)omChanged();else if(omEncAgain){omEncAgain=false;omEncryptAll();}
}
function omSettle(){
  const v=OMV;if(!v||v.ph!=="done"||settled(v.gid))return;
  markSettled(v.gid);
  if(APP.om==="practice")v.pl.forEach(p=>{if(p.in&&p.net)prSet(p.n,prChips(p.n)+p.net);});
  else{const mi=v.pl.findIndex(p=>p.c===CID),me=v.pl[mi];
    if(me&&me.in){if(me.net)wallet.set(wallet.get()+me.net);stHand("om",me.net||0,v.loser!==mi);}
    if(APP.om==="client")ONET.nr?.presence({chips:wallet.get()}).catch(()=>{});}
  if(APP.om!=="client")setTimeout(omChanged,0);
}
function omStop(){clearTimeout(omTT);omTK="";OM=null;OMV=null;prevOMV=null;ONET.myHand=null;ONET.myGid=null;ONET.myEh="";omLastHand=null;APP.omNew=null;}
function omTurnTimer(){
  if(OM.phase!=="play"||OM.turn<0){clearTimeout(omTT);omTK="";OM.turnAt=null;return;}
  const i=OM.turn,key=`${OM.gid}:${OM.actN}:${i}`;if(key===omTK)return;
  omTK=key;OM.turnAt=Date.now();clearTimeout(omTT);
  omTT=setTimeout(()=>{if(!OM||omTK!==key||OM.turn!==i||OM.phase!=="play")return;
    OM.toast={id:rid(5),text:`${OM.players[i].name} ran out of time · a card was picked for them`};omPick(i,Math.floor(Math.random()*99));},TURN_MS);
}
function omGoneTick(){
  if(APP.om!=="host"||!OM||OM.phase!=="play"||OM.turn<0||!OM.players[OM.turn].gone)return;
  const i=OM.turn,key=OM.gid+":"+OM.actN;if(ONET.goneKey===key)return;ONET.goneKey=key;
  setTimeout(()=>{if(OM&&OM.phase==="play"&&OM.turn===i&&OM.players[i].gone)omPick(i,Math.floor(Math.random()*99));},2000);
}
function omBotTick(){
  if(APP.om!=="practice"||!OM||OM.phase!=="play"||OM.turn<0)return;
  const i=OM.turn;if(!OM.players[i].bot)return;
  const key="o"+OM.gid+":"+OM.actN;if(PR.keys[key])return;PR.keys[key]=1;
  prTimer(()=>{if(OM&&OM.phase==="play"&&OM.turn===i)omPick(i,Math.floor(Math.random()*OM.players[OM.from].hand.length));},900+Math.random()*700);
}

/* online */
async function omHost(){
  if(!NET.room||!hasCrypto())return;
  APP.err="";const code=rid(4);let nr;
  try{ONET.ec=await ecKeys();nr=await NET.room.join("om-"+code);}catch(e){APP.err="Couldn't open a table. Try again in a moment.";render();return;}
  ONET.nr=nr;APP.om="host";ONET.code=code;ONET.info={};ONET.seen={};ONET.connected=true;ONET.hs=Date.now();
  omNewTable([{name:myName(),cid:CID}],APP.omBuy);
  nr.onConnection(c=>{ONET.connected=c;render();},()=>{ONET.connected=false;render();});
  ONET.unsub=nr.onPeers(omOnPeersHost);
  prevOMV=null;APP.screen="om";APP.sheet=null;omChanged();
}
async function omDerive(cid){
  const f=ONET.info[cid];if(!f||!f.pub||!ONET.ec)return;const pub=f.pub;
  try{const k=await ecShared(ONET.ec.kp,pub);if(f.pub===pub){f.key=k;omEncryptAll();}}catch(e){}
}
function omOnPeersHost(ch){
  if(!OM||dupHost("om",ch))return;
  let dirty=false;const here=new Set();
  for(const peer of ch.peers){
    if(peer.sameTab)continue;const pr=peer.presence||{};
    if(typeof pr.cid!=="string"||pr.cid===CID||pr.role==="host"||pr.game!=="om")continue;
    here.add(pr.cid);const name=String(pr.name||"Player").slice(0,14);
    const f=ONET.info[pr.cid]||(ONET.info[pr.cid]={ch:START_CHIPS,rep:null});
    if(Number.isFinite(pr.chips)&&pr.chips!==f.rep){f.rep=pr.chips;f.ch=pr.chips;dirty=true;}
    if(typeof pr.pub==="string"&&pr.pub!==f.pub){f.pub=pr.pub;f.key=null;omDerive(pr.cid);}
    let i=OM.players.findIndex(x=>x.cid===pr.cid);
    if(i<0&&OM.players.length<6){OM.players.push(omPlayer(name,pr.cid));i=OM.players.length-1;dirty=true;}
    if(i<0)continue;
    const pl=OM.players[i];
    if(pl.name!==name){pl.name=name;dirty=true;}
    if(pl.sit!==!!pr.sit){pl.sit=!!pr.sit;dirty=true;}
    if(pl.gone){pl.gone=false;dirty=true;}
    const key=pr.cid+":"+pr.nonce,seen=ONET.seen[key]||0;let max=seen;
    if(Array.isArray(pr.acts))for(const a of pr.acts){
      if(!a||!(a.n>seen))continue;max=Math.max(max,a.n);
      if(a.g!==OM.gid)continue;
      if(a.a==="shuffle")omShuffle(i);
      else if(a.a==="pick"&&a.k===OM.actN)omPick(i,a.i|0);
    }
    ONET.seen[key]=max;
  }
  OM.players.forEach(p=>{if(p.cid&&p.cid!==CID&&!here.has(p.cid)&&!p.gone){p.gone=true;dirty=true;}});
  if(OM.phase!=="play"){const b=OM.players.length;OM.players=OM.players.filter(p=>!p.gone);
    if(OM.players.length!==b){dirty=true;if(OM.dealer>=OM.players.length)OM.dealer=OM.players.length-1;}}
  if(dirty)omChanged();
}
function omTakeover(){
  const N=ONET,last=N.host&&N.host.v;try{N.unsub&&N.unsub();}catch(e){}
  APP.om="host";N.hs=Date.now();N.info={};N.seen={};N.hostGone=false;
  omNewTable(takeoverSeats(last&&last.pl),last&&Number.isFinite(last.buyIn)?last.buyIn:APP.omBuy);
  if(last&&Number.isFinite(last.dealer))OM.dealer=Math.min(last.dealer,OM.players.length-1);
  OM.toast={id:rid(5),text:last&&last.ph==="play"?"The host left. You're hosting now. That round was canceled and no chips changed.":"The host left. You're hosting now."};
  N.unsub=N.nr.onPeers(omOnPeersHost);omChanged();
}

async function omOnPeersClient(ch){
  const h=ch.peers.find(p=>p.presence&&p.presence.role==="host"&&p.presence.game==="om"&&p.presence.code===ONET.code);
  if(!h){if(ONET.host){ONET.hostGone=true;hostMissing("om");render();}return;}

  const v=h.presence.v;if(v&&(!OMV||v.seq!==OMV.seq||v.gid!==OMV.gid))OMV=v;
  render();

    ONET.hostPub=h.presence.pub;ONET.hostKey=null;ONET.myEh="";
    try{ONET.hostKey=await ecShared(ONET.ec.kp,ONET.hostPub);}catch(e){}}
  omDecryptMine();
}
async function omDecryptMine(){
  const v=OMV;if(!v||!ONET.hostKey)return;
  const me=v.pl.find(p=>p.c===CID);if(!me||!me.eh||me.eh===ONET.myEh)return;
  const s=me.eh;
  try{const o=await aesDec(ONET.hostKey,s);if(o.g===OMV.gid){ONET.myEh=s;ONET.myHand=o.h;ONET.myGid=o.g;render();}}catch(e){}
}

  ONET.my.acts=[...ONET.my.acts.slice(-7),{n,a,g:v.gid,k:v.actN,...o}];if(a==="pick")ONET.pend=v.gid+":"+v.actN;
  ONET.nr?.presence({acts:ONET.my.acts}).catch(()=>{});render();

function omDo(a,o){
  const v=OMV;if(!v||v.ph!=="play")return;
  if(APP.om==="client"){omSend(a,o||{});return;}
  const mine=APP.om==="practice"?0:v.pl.findIndex(p=>p.c===CID);
  if(a==="pick")omPick(mine,o.i);else if(a==="shuffle")omShuffle(mine);

  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);const s=c.createBufferSource();s.buffer=b;const f=c.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q;
  const g=c.createGain();g.gain.value=gain;s.connect(f).connect(g).connect(c.destination);s.start(t);}

  const now=performance.now();if(lastSfx[kind]&&now-lastSfx[kind]<60)return;lastSfx[kind]=now;
  const t=c.currentTime+.005;
  try{
    if(kind==="card")noise(c,t,{dur:.07,freq:2800,q:.8,gain:.35});
    else if(kind==="chip"){tone(c,t,{freq:3400,dur:.04,type:"triangle",gain:.12});tone(c,t+.045,{freq:4300,dur:.035,type:"triangle",gain:.1});}
    else if(kind==="slap"){noise(c,t,{dur:.14,freq:450,q:.7,gain:.9,type:"lowpass"});tone(c,t,{freq:140,to:60,dur:.14,gain:.5});}
    else if(kind==="tick")tone(c,t,{freq:1100,dur:.03,type:"square",gain:.05});
    else if(kind==="win")[523,659,784,1047].forEach((fq,i)=>tone(c,t+i*.11,{freq:fq,dur:.22,type:"triangle",gain:.16}));
  }catch(e){}
}

/* chip stacks drawn from an amount */
const CHIP_WHITE="#f1ece0";
const chipEdge=c=>c===CHIP_WHITE?"#2a5bd7":"#fff";
/* chip values, biggest first: the icon next to an amount is the biggest chip that amount would use */
const CHIP_DEN=[[100,"#1a1a1a"],[50,"#b8501a"],[25,"#1d7a46"],[10,"#1f4fbf"],[5,"#c4202b"],[1,CHIP_WHITE]];
function topChip(a){a=Math.abs(a|0);for(const [v,c] of CHIP_DEN)if(a>=v)return c;return CHIP_WHITE;}
function tagChips(root){root.querySelectorAll(".chip,.betchip").forEach(el=>{
  const n=el.querySelector("[data-count]");const a=n?+n.getAttribute("data-count"):+((el.textContent.match(/\d[\d,]*/)||["0"])[0].replace(/,/g,""));
  const c=topChip(a);el.style.setProperty("--cc",c);el.style.setProperty("--cs",chipEdge(c));});}
/* a chip seen from above: solid center, rectangular inserts round the rim, dashed inner ring */
function chipSVG(c){const e=chipEdge(c);
  return`<svg class="chipface" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="19.5" fill="${c}"/>${[0,45,90,135,180,225,270,315].map(a=>`<rect x="16.6" y="0.6" width="6.8" height="6.2" rx=".6" fill="${e}" transform="rotate(${a} 20 20)"/>`).join("")}
    <circle cx="20" cy="20" r="12.6" fill="none" stroke="${e}" stroke-width="1.3" stroke-dasharray="2.4 1.9"/><circle cx="20" cy="20" r="19.3" fill="none" stroke="rgba(0,0,0,.28)" stroke-width=".8"/></svg>`;}
/* chips seen from the side: each chip's white blocks sit offset from the one above */
function chipStacks(amount,max){
  const den=CHIP_DEN;let left=Math.max(0,amount|0);const out=[];
  for(const [v,c] of den){let n=Math.floor(left/v);left-=n*v;if(n)out.push([Math.min(n,max||8),c]);}
  return stacksHTML(out.slice(0,4));
}
function stacksHTML(list){
  return`<span class="stacks" aria-hidden="true">${list.map(([n,c])=>`<span class="stk" style="--cc:${c};--cs:${chipEdge(c)}">${Array.from({length:n},(_,k)=>`<i class="${k%2?"o":""}"></i>`).join("")}</span>`).join("")}</span>`;
}

const IS_CF=!!window.__HUB_CF;

  :IS_CF?"Can't reach the game server right now. Check your internet connection and reload the page."
  :"Online play isn't available in this view. Everyone needs to be signed in to Claude and invited to this page from its Share menu. Public links can't join.";
const ONG={
  ew:{net:()=>NET,mode:()=>APP.mode,join:()=>{APP.screen="mode";joinGame();},stop:()=>{clearTimeout(timer);clearTimeout(ewTT);ewTK="";G=null;V=null;},take:()=>ewTakeover()},
  bj:{net:()=>BNET,mode:()=>APP.bj,join:()=>{APP.screen="bj-mode";bjJoin();},stop:()=>bjStop(),take:()=>bjTakeover()},
  bc:{net:()=>CNET,mode:()=>APP.bc,join:()=>{APP.screen="bc-mode";bcJoin();},stop:()=>bcStop(),take:()=>bcTakeover()},
  hm:{net:()=>HNET,mode:()=>APP.hm,join:()=>{APP.screen="hm-mode";hmJoin();},stop:()=>hmStop(),take:()=>hmTakeover()},
  rm:{net:()=>RNET,mode:()=>APP.rm,join:()=>{APP.screen="rm-mode";rmJoin();},stop:()=>rmStop(),take:()=>rmTakeover()},
  om:{net:()=>ONET,mode:()=>APP.om,join:()=>{APP.screen="om-mode";omJoin();},stop:()=>omStop(),take:()=>omTakeover()}};
function curOnline(){for(const g of ["ew","bj","bc","hm","rm","om"]){const N=ONG[g].net();if(N.nr&&N.code)return{g,N,code:N.code,role:ONG[g].mode()};}return null;}

/* the host is gone: after 8 seconds the remaining player with the lowest id takes over, so the table keeps going */
function hostSeen(g){const N=ONG[g].net();N.electAt=0;clearTimeout(N.electTimer);}
function hostMissing(g){const N=ONG[g].net();if(N.electAt)return;N.electAt=Date.now();clearTimeout(N.electTimer);N.electTimer=setTimeout(()=>elect(g),8000);}
function elect(g){
  const N=ONG[g].net();N.electAt=0;
  if(!N.nr||ONG[g].mode()!=="client"||!N.host)return;
  let peers=[];try{peers=N.nr.peers();}catch(e){}
  if(peers.some(p=>p.presence&&p.presence.role==="host"&&p.presence.code===N.code))return;
  const cids=peers.map(p=>p.presence&&p.presence.cid).filter(c=>typeof c==="string");
  if(!cids.includes(CID))cids.push(CID);
  cids.sort();
  if(cids[0]!==CID){N.electAt=Date.now();N.electTimer=setTimeout(()=>elect(g),6000);return;}
  try{ONG[g].take();}catch(e){}
}
/* two hosts on one table (a returning host, or a tie in the election): the newer one steps down and rejoins as a player */
function dupHost(g,ch){
  const N=ONG[g].net();
  const o=ch.peers.find(p=>!p.isMe&&p.presence&&p.presence.role==="host"&&p.presence.code===N.code&&(p.presence.game||"ew")===g);
  if(!o)return false;
  const mine=N.hs||0,theirs=+o.presence.hs||0;
  if(!(mine>theirs||(mine===theirs&&CID>String(o.presence.cid))))return false;
  stepDown(g);return true;
}
async function stepDown(g){
  const N=ONG[g].net(),code=N.code,nr=N.nr;
  try{N.unsub&&N.unsub();}catch(e){}
  N.nr=null;ONG[g].stop();
  try{await nr.leave();}catch(e){}
  APP.joinCode=code;ONG[g].join();
}
function takeoverSeats(list){
  const seats=(Array.isArray(list)?list:[]).filter(p=>p&&typeof p.c==="string").map(p=>({name:String(p.n||"Player").slice(0,14),cid:p.c}));

  return seats;
}

}

function hmTakeover(){

function ewTakeover(){
  const pr=NET.host||{};try{NET.unsub&&NET.unsub();}catch(e){}

  NET.seats=[{c:CID,n:myName()},...NET.seats.filter(s=>s.c!==CID&&s.c!==pr.cid)];
  const sn=pr.started&&pr.snap;
  if(sn&&Array.isArray(sn.pl)&&Array.isArray(sn.cids)){
    G={players:sn.pl.map(p=>({name:String(p.n).slice(0,14),color:p.c,hand:Array.isArray(p.h)?p.h:[],out:!!p.o})),pile:Array.isArray(sn.pile)?sn.pile:[],
      turn:sn.turn|0,challenge:sn.ch||null,pending:null,lastFlip:sn.lf|0,toast:null,slapLock:0,winner:sn.w==null?null:sn.w,seq:(sn.seq|0)+1000,stake:sn.st,cids:sn.cids};

/* keep the screen awake at an online table, remember it for one-tap rejoin, and put it in the page link */

/* chat: quick reactions and short messages, carried in each player's presence */
const QUICK=["Nice hand!","Good luck","Your turn","So close","GG","Wow"];
const CHAT={log:[],seen:new Set(),rooms:new WeakSet(),unread:0};
function chatHook(nr){
  if(!nr||CHAT.rooms.has(nr))return;CHAT.rooms.add(nr);let first=true;
  nr.onPeers(ch=>{
    let added=0;
    for(const p of ch.peers){
      const s=p.presence&&p.presence.say;
      if(!s||typeof s.id!=="string"||CHAT.seen.has(s.id))continue;CHAT.seen.add(s.id);
      if(first)continue;   // old messages already sitting in presence when we arrive
      const t=String(s.t||"").replace(/[\u0000-\u001f\u007f​-‏‪-‮⁦-⁩]/g,"").slice(0,60).trim();if(!t)continue;
      CHAT.log.push({n:String(s.n||"Player").slice(0,14),t,me:!!p.isMe,at:Date.now()});added++;
      if(!p.isMe&&APP.sheet!=="chat")CHAT.unread++;
    }
    first=false;
    if(CHAT.log.length>40)CHAT.log.splice(0,CHAT.log.length-40);
    if(added){showBubbles();sfx("chip");if(APP.sheet==="chat"||document.querySelector(".chatbtn"))render();}
  },()=>{});
}
function say(text){
  const o=curOnline();if(!o)return;
  const t=String(text||"").slice(0,60).trim();if(!t)return;
  o.N.nr.presence({say:{id:rid(8),n:myName(),t}}).catch(()=>{});
}
function showBubbles(){
  let el=document.getElementById("chatfloat");
  if(!el){el=document.createElement("div");el.id="chatfloat";el.setAttribute("aria-live","polite");document.body.appendChild(el);}
  const now=Date.now(),recent=CHAT.log.filter(m=>now-m.at<5000).slice(-3);
  el.innerHTML=recent.map(m=>`<div class="bubble ${m.me?"me":""}"><b>${esc(m.me?"You":m.n)}</b> ${esc(m.t)}</div>`).join("");
  clearTimeout(showBubbles.t);if(recent.length)showBubbles.t=setTimeout(showBubbles,1000);
}
function chatBtn(){
  if(!curOnline())return"";
  return`<button class="chatbtn" data-act="chat" aria-label="Chat${CHAT.unread?`, ${CHAT.unread} new`:""}"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"></path></svg>${CHAT.unread?`<i>${CHAT.unread>9?"9+":CHAT.unread}</i>`:""}</button>`;
}
function chatSheet(){

/* Egyptian War bots */
function ewBotTick(){
  if(APP.mode!=="practice"||!G||!G.bots||G.winner!=null)return;
  const d=EW_BOT[PR.diff];
  if(!G.pending&&G.bots[G.turn]&&!G.players[G.turn].out&&G.players[G.turn].hand.length){
    const seat=G.turn,len=G.pile.length,key=`f${seat}:${len}:${G.players[seat].hand.length}`;
    if(!PR.keys[key]){PR.keys[key]=1;prTimer(()=>{if(G&&!G.pending&&G.turn===seat&&G.pile.length===len)flip(seat);},rnd(d.flip));}
  }
  if(G.pile.length){
    const sig=()=>G?G.pile.length+":"+G.pile[G.pile.length-1].join("."):"";
    const s=sig();
    G.bots.forEach((bot,i)=>{
      if(!bot||G.players[i].out)return;
      const k="s"+i+":"+s;if(PR.keys[k])return;PR.keys[k]=1;
      const zero=G.players[i].hand.length===0;
      if(combo(zero)){if(Math.random()<d.miss)return;prTimer(()=>{if(G&&G.pile.length&&sig()===s&&combo(G.players[i].hand.length===0))slap(i);},rnd(d.react));}
      else if(!zero&&Math.random()<d.fslap)prTimer(()=>{if(G&&G.pile.length&&sig()===s)slap(i);},rnd(d.react));
    });
  }
}
function ewCoach(){
  if(APP.mode!=="practice"||!PR.coach||!G||G.winner!=null)return"";
  const me=G.players[0],P=G.pile;let tip;
  const k=P.length?combo(me.hand.length===0):null;
  if(k&&!me.out){const a=P[P.length-1],b=P[P.length-2],c=P[P.length-3];
    tip=k==="double"?`<b>Slap!</b> Double: two ${label(a[0])}s in a row.`
      :k==="sandwich"?`<b>Slap!</b> Sandwich: ${label(c[0])}, ${label(b[0])}, ${label(a[0])}.`
      :`<b>Slap!</b> Ten: ${label(b[0])} + ${label(a[0])} = 10.`;}
  else if(me.out)tip="You're out. Watch how the bots play, then start over from the menu.";
  else if(G.pending)tip=G.pending.to===0?"Nice, the pile is yours.":"That pile is gone. Watch the next one.";
  else if(G.turn===0&&G.challenge)tip=`<b>Flip!</b> You need a face card or Ace. ${G.challenge.left} ${G.challenge.left===1?"chance":"chances"} left.`;
  else if(G.turn===0)tip="<b>Your turn.</b> Tap Flip.";
  else if(G.challenge&&G.challenge.by===0)tip=`Your ${RNAME[G.challenge.r]} is out. If they miss, the pile is yours.`;
  else if(!me.hand.length)tip="No cards left. Slap a double or sandwich to get back in.";
  else tip="Watch the pile for doubles, sandwiches, and tens.";
  return`<div class="coach">${tip}</div>`;
}

/* Blackjack: basic strategy for the coach and the bots (6 decks, dealer stands on 17) */
function bjAdvice(cards,up,o){
  const d=up[0]===1?11:bjVal(up[0]),dn=up[0]===1?"Ace":String(d);
  const {t,soft}=bjTotal(cards);
  if(cards.length===2&&o.spl&&bjVal(cards[0][0])===bjVal(cards[1][0])){
    const v=cards[0][0]===1?11:bjVal(cards[0][0]);
    const sp=v===11||v===8||((v===2||v===3||v===7)&&d<=7)||(v===4&&(d===5||d===6))||(v===6&&d<=6)||(v===9&&d<=9&&d!==7);
    if(sp)return{a:"split",why:`Pair of ${v===11?"Aces":v+"s"} against a dealer ${dn}: <b>split</b>.`};
  }
  let a;
  if(soft){
    if(t>=20)a="S";else if(t===19)a=d===6?"Ds":"S";else if(t===18)a=d<=6?"Ds":d<=8?"S":"H";
    else if(t===17)a=d>=3&&d<=6?"D":"H";else if(t>=15)a=d>=4&&d<=6?"D":"H";else a=d>=5&&d<=6?"D":"H";
  }else{
    if(t>=17)a="S";else if(t>=13)a=d<=6?"S":"H";else if(t===12)a=d>=4&&d<=6?"S":"H";
    else if(t===11)a=d<=10?"D":"H";else if(t===10)a=d<=9?"D":"H";else if(t===9)a=d>=3&&d<=6?"D":"H";else a="H";
  }
  const act=a==="D"?(o.dbl?"double":"hit"):a==="Ds"?(o.dbl?"double":"stand"):a==="S"?"stand":"hit";
  const why={hit:"the dealer is likely to beat you, so take a card",stand:d<=6&&t<17?"the dealer is likely to bust, so let them":"you're likely ahead, so keep it",double:"you're in a strong spot, so double your bet"}[act];
  return{a:act,why:`${soft?"Soft":"Hard"} ${t} against a dealer ${dn}: <b>${act==="double"?"double down":act}</b>. ${why[0].toUpperCase()+why.slice(1)}.`};
}
function prBjBets(){
  B.players.forEach((p,i)=>{if(!p.bot)return;const ch=bjChips(i),amt=[10,20,30,50][Math.floor(Math.random()*4)];
    p.bet=ch>=BJ_MIN?Math.min(amt,Math.floor(ch/10)*10):0;});
}
function bjBotMove(hand){
  const o=bjOpts(),adv=bjAdvice(hand.cards,B.dealer[0],o).a,t=bjTotal(hand.cards).t;
  if(PR.diff==="hard"||(PR.diff==="medium"&&Math.random()<.8))return adv;
  if(PR.diff==="medium")return t>=17?"stand":t<=11?"hit":Math.random()<.5?"hit":"stand";
  return t<=11?"hit":t<=14?(Math.random()<.5?"hit":"stand"):"stand";
}
function bjBotTick(){
  if(APP.bj!=="practice"||!B||B.phase!=="play"||!B.turn)return;
  const {p,h}=B.turn,pl=B.players[p];if(!pl.bot)return;
  const key=`${B.gid}:${p}:${h}:${pl.hands[h].cards.length}:${pl.hands.length}`;
  if(PR.keys[key])return;PR.keys[key]=1;

    case"jb-max":if(J&&J.phase!=="hold"){J.coins=5;jbDeal();return;}break;
    case"jb-deal":jbDeal();return;
    case"jb-draw":jbDraw();return;
    case"jb-rules":APP.sheet="jb-rules";break;
    case"open-hm":hmStop();APP.hm="local";APP.screen="hm-mode";APP.sheet=null;APP.err="";break;
    case"hm-local-setup":hmStop();APP.hm="local";APP.screen="hm-setup";APP.sheet=null;break;
    case"hm-count":APP.hmCount=+t.dataset.n;break;
    case"hm-blinds":APP.hmBlinds=+t.dataset.v;break;
    case"hm-tblinds":if(H&&H.phase!=="hand"){const b=HM_BLINDS[+t.dataset.v];H.sb=b[0];H.bb=b[1];H.minRaise=b[1];APP.hmBlinds=+t.dataset.v;hmChanged();return;}break;
    case"hm-sit":{const names=localNames().slice(0,APP.hmCount);
      if(new Set(names.map(n=>n.toLowerCase())).size<names.length)break;
      APP.hm="local";hmNewTable(names.map(n=>({name:n})),HM_BLINDS[APP.hmBlinds]);prevHV=null;APP.screen="hm";APP.sheet=null;hmChanged();return;}
    case"hm-host":hmHost();return;
    case"hm-join":hmJoin();return;
    case"hm-deal":if(H&&APP.hm!=="client"){hmStart();hmChanged();}return;
    case"hm-sitout":hmToggleSit();return;
    case"hm-act":hmDoAct(t.dataset.a);return;
    case"hm-raisebox":APP.hmRB=!APP.hmRB;break;
    case"hm-preset":hmPreset(t.dataset.v);break;
    case"hm-step":{const o=HV&&HV.opt;if(o)APP.hmRaise=Math.max(o.minTo,Math.min(o.maxTo,APP.hmRaise+(+t.dataset.v)*HV.bb));break;}
    case"hm-forcefold":APP.sheet=null;if(APP.hm==="host"&&H&&H.turn>=0)hmAct(H.turn,"fold");render();return;
    case"hm-peek":return;
    case"hm-leave":hmLeave();return;
    case"hm-rules":APP.sheet="hm-rules";break;
    case"hm-menu":APP.sheet="hm-menu";break;
    case"open-rm":rmStop();APP.rm="off";APP.screen="rm-mode";APP.sheet=null;APP.err="";break;
    case"rm-buy":APP.rmBuy=+t.dataset.v;break;
    case"rm-tbuy":if(RM&&RM.phase!=="play"&&APP.rm!=="client"){RM.buyIn=+t.dataset.v;APP.rmBuy=RM.buyIn;rmChanged();return;}break;
    case"rm-host":rmHost();return;
    case"rm-join":rmJoin();return;
    case"rm-deal":if(RM&&APP.rm!=="client"){rmStart();rmChanged();}return;
    case"rm-sit":rmToggleSit();return;
    case"rm-sel":{const k=t.dataset.k,i=APP.rmSel.indexOf(k);if(i>=0)APP.rmSel.splice(i,1);else APP.rmSel.push(k);break;}
    case"rm-sort":APP.rmSort=APP.rmSort==="suit"?"rank":"suit";break;
    case"rm-draw":rmDo("draw",{src:t.dataset.src==="discard"?"discard":"stock"});return;
    case"rm-meld":rmDo("meld",{cards:rmSelCards()});return;
    case"rm-layoff":{const c=rmSelCards();if(c.length===1)rmDo("layoff",{card:c[0],mi:+t.dataset.mi});return;}
    case"rm-discard":{const c=rmSelCards();if(c.length===1)rmDo("discard",{card:c[0]});return;}
    case"rm-coachsel":APP.rmSel=String(t.dataset.k||"").split(",").filter(Boolean);break;
    case"rm-force":APP.sheet=null;if(APP.rm==="host"&&RM&&RM.turn>=0)rmAuto(RM.turn,"is away");render();return;
    case"rm-leave":rmLeave();return;
    case"rm-rules":APP.sheet="rm-rules";break;
    case"rm-menu":APP.sheet="rm-menu";break;
    case"open-om":omStop();APP.om="off";APP.screen="om-mode";APP.sheet=null;APP.err="";break;
    case"om-buy":APP.omBuy=+t.dataset.v;break;
    case"om-tbuy":if(OM&&OM.phase!=="play"&&APP.om!=="client"){OM.buyIn=+t.dataset.v;APP.omBuy=OM.buyIn;omChanged();return;}break;
    case"om-host":omHost();return;
    case"om-join":omJoin();return;
    case"om-deal":if(OM&&APP.om!=="client"){omStart();omChanged();}return;
    case"om-sit":omToggleSit();return;
    case"om-pick":omDo("pick",{i:+t.dataset.i});return;
    case"om-shuffle":omDo("shuffle");APP.omMsg="Hand shuffled.";return;
    case"om-force":APP.sheet=null;if(APP.om==="host"&&OM&&OM.turn>=0)omPick(OM.turn,Math.floor(Math.random()*99));render();return;
    case"om-leave":omLeave();return;
    case"om-rules":APP.sheet="om-rules";break;
    case"om-menu":APP.sheet="om-menu";break;
    case"jb-menu":APP.sheet="jb-menu";break;
    case"pr-open":if(t.dataset.g)PR.game=t.dataset.g;APP.sheet=null;
      if(PR_SOLO.has(PR.game)){prStart();return;}
      APP.screen="practice";break;
    case"pr-diff":PR.diff=t.dataset.v;break;
    case"pr-bots":PR.bots=+t.dataset.v;break;
    case"pr-coach":PR.coach=!PR.coach;
      if(APP.screen==="game"&&V){changed();return;}if(APP.screen==="bj-table"&&B){bjChanged();return;}if(APP.screen==="bc-table"&&C){bcChanged();return;}break;
    case"pr-start":prStart();return;
    case"pr-exit":prExit();return;
    case"pr-reset":APP.sheet=null;prResetChips();return;
    case"open-bc":APP.screen="bc-mode";APP.sheet=null;APP.err="";break;
    case"bc-local-setup":bcStop();APP.bc="local";APP.screen="bc-setup";APP.sheet=null;break;
    case"bc-count":APP.bcCount=+t.dataset.n;break;
    case"bc-sit":{const names=localNames().slice(0,APP.bcCount);
      if(new Set(names.map(n=>n.toLowerCase())).size<names.length)break;
      APP.bc="local";bcNewTable(names.map(n=>({name:n})));prevCV=null;APP.screen="bc-table";APP.sheet=null;bcChanged();return;}
    case"bc-host":bcHost();return;
    case"bc-join":bcJoin();return;
    case"bc-side":if(APP.bc==="client")bcGuestSide(t.dataset.s);else bcSetSide(+t.dataset.p,t.dataset.s);return;
    case"bc-bet":if(APP.bc==="client")bcGuestBet(+t.dataset.v);else bcSetBet(+t.dataset.p,+t.dataset.v);return;
    case"bc-lock":bcGuestLock();return;
    case"bc-deal":if(C){bcDeal();bcChanged();}return;
    case"bc-next":bcNextHand();return;
    case"bc-leave":bcLeave();return;
    case"bc-rules":APP.sheet="bc-rules";break;
    case"bc-menu":APP.sheet="bc-menu";break;
    case"open-bj":APP.screen="bj-mode";APP.sheet=null;APP.err="";break;
    case"bj-local-setup":bjStop();APP.bj="local";APP.screen="bj-setup";APP.sheet=null;break;
    case"bj-count":APP.bjCount=+t.dataset.n;break;
    case"bj-sit":{const names=localNames().slice(0,APP.bjCount);
      if(new Set(names.map(n=>n.toLowerCase())).size<names.length)break;
      APP.bj="local";bjNewTable(names.map(n=>({name:n})));prevBV=null;APP.screen="bj-table";APP.sheet=null;bjChanged();return;}
    case"bj-host":bjHost();return;
    case"bj-join":bjJoin();return;
    case"bj-bet":if(APP.bj==="client")bjGuestBet(+t.dataset.v);else bjAddBet(+t.dataset.p,+t.dataset.v);return;
    case"bj-lock":bjGuestLock();return;
    case"bj-deal":if(B){bjDeal();bjChanged();}return;
    case"bj-act":if(APP.bj==="client")bjSend(t.dataset.a);else bjAction(+t.dataset.p,t.dataset.a,+t.dataset.h);return;
    case"bj-next":bjNextHand();return;
    case"bj-force":APP.sheet=null;if(APP.bj==="host"&&B&&B.turn)bjAction(B.turn.p,"stand",B.turn.h);render();return;
    case"bj-leave":bjLeave();return;
    case"bj-rules":APP.sheet="bj-rules";break;
    case"bj-menu":APP.sheet="bj-menu";break;
    case"local-setup":clearTimeout(timer);APP.mode="local";APP.screen="setup";APP.sheet=null;break;
    case"count":APP.count=+t.dataset.n;break;
    case"deal":{const chk=localCheck();if(!chk.ok){APP.screen="setup";APP.sheet=null;break;}
      APP.mode="local";G=newGame(chk.playing,APP.buyIn);prevV=null;APP.screen="game";APP.sheet=null;V=toView();break;}
    case"stake-local":APP.buyIn=+t.dataset.b;break;
    case"bonus-local":bonus.claimLocal(localNames()[+t.dataset.i]);break;
    case"bonus":chipFly('[data-act="bonus"]',VW+".bankamt, "+VW+".wallet .chip",BONUS,{color:"#b8501a"});bonus.claimMine();pushChips();
      if(APP.bj==="client"&&BNET.nr)BNET.nr.presence({chips:wallet.get()}).catch(()=>{});
      if(APP.bc==="client"&&CNET.nr)CNET.nr.presence({chips:wallet.get()}).catch(()=>{});
      if(APP.hm==="client"&&HNET.nr)HNET.nr.presence({chips:wallet.get()}).catch(()=>{});
      if(APP.hm==="host"&&H){hmChanged();return;}
      if(APP.rm==="client"&&RNET.nr)RNET.nr.presence({chips:wallet.get()}).catch(()=>{});
      if(APP.rm==="host"&&RM){rmChanged();return;}
      if(APP.om==="client"&&ONET.nr)ONET.nr.presence({chips:wallet.get()}).catch(()=>{});
      if(APP.om==="host"&&OM){omChanged();return;}
      if(APP.bj==="host"&&B){bjChanged();return;}
      if(APP.bc==="host"&&C){bcChanged();return;}
      break;
    case"stake":setStake(+t.dataset.b);return;
    case"agree":guestAgree(NET.agree!==NET.buyIn);return;
    case"host-lobby":hostToLobby();return;
    case"host":hostGame();return;
    case"resume":hostGame(store.get("ew-host"));return;
    case"join":joinGame();return;
    case"start":prevV=null;hostStart();return;
    case"leave":leaveOnline();return;
    case"rules":APP.sheet="rules";break;
    case"menu":APP.sheet="menu";break;
    case"close":case"close-bg":APP.sheet=null;break;
    default:return;
  }
  render();
});
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.dataset.i!=null){
    const i=+el.dataset.i;APP.names[i]=el.value;
    const c=localChips.get(localNames()[i]),lab=document.getElementById("chips-"+i);
    if(lab){lab.textContent=fmt(c);lab.classList.toggle("short",c<(APP.screen==="setup"?APP.buyIn:BJ_MIN));}
    const chk=localCheck(),p=document.getElementById("local-check"),btn=document.getElementById("deal-btn");
    if(p){p.textContent=chk.why;p.classList.toggle("warn",!chk.ok);}if(btn)btn.disabled=!chk.ok;
  }
  if(el.dataset.bind==="myName"){APP.myName=el.value;store.set("ew-name",el.value);}
  if(el.dataset.bind==="joinCode"){APP.joinCode=el.value.replace(/[^a-z0-9]/gi,"");el.value=APP.joinCode.toUpperCase();}
});
document.addEventListener("keydown",e=>{
  if(APP.screen!=="game"||!V||e.repeat||e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.target&&e.target.closest&&e.target.closest("input,textarea,select"))return;
  if(e.key==="Escape"){APP.sheet=APP.sheet?null:"menu";render();return;}
  if(APP.sheet||V.winner!=null)return;
  const k=e.key===" "?"space":e.key.toLowerCase();
  let hit=false;
  if(APP.mode!=="local"&&NET.mySeat>=0){
    if(k==="f"||k==="enter"){act("flip",NET.mySeat);hit=true;}
    else if(k==="space"||k==="s"){act("slap",NET.mySeat);hit=true;}
  }
  if(hit){e.preventDefault();if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();}
});
const KEYMAP=[
  ["h",'.bj-acts [data-a="hit"]'],["s",'.bj-acts [data-a="stand"]'],["d",'.bj-acts [data-a="double"]'],["p",'.bj-acts [data-a="split"]'],
  ["f",'.hacts [data-a="fold"]'],["c",'.hacts [data-a="call"],.hacts [data-a="check"]'],["r",'.raisebox [data-a="raise"],[data-act="hm-raisebox"]'],
  ["arrowup",'[data-act="hm-step"][data-v="1"]'],["arrowdown",'[data-act="hm-step"][data-v="-1"]'],
  ["1",'[data-act="bj-bet"][data-v="10"],[data-act="bc-side"][data-s="player"],[data-act="rm-draw"][data-src="stock"]'],
  ["2",'[data-act="bj-bet"][data-v="50"],[data-act="bc-side"][data-s="banker"],[data-act="rm-draw"][data-src="discard"]'],
  ["3",'[data-act="bj-bet"][data-v="100"],[data-act="bc-side"][data-s="tie"]'],["backspace",'[data-act="bj-bet"][data-v="0"]'],
  ["m",'[data-act="rm-meld"]'],["l",'[data-act="rm-layoff"]'],
  ["space",'[data-act="rm-discard"],[data-act="bj-deal"],[data-act="bj-next"],[data-act="bc-deal"],[data-act="bc-next"],[data-act="hm-deal"],[data-act="rm-deal"],[data-act="om-deal"],.jdeal'],
  ["t",'.chatbtn'],["escape",'.menu-btn2,.menu-btn']];
function keyHints(root){
  KEYMAP.forEach(([k,sel])=>{const lab=k==="space"?"Space":k==="backspace"?"⌫":k==="escape"?"Esc":k==="arrowup"?"↑":k==="arrowdown"?"↓":k.toUpperCase();
    if(/^(arrow|t$|escape)/.test(k))return;
    root.querySelectorAll(sel).forEach(el=>{if(el.matches("button")&&!el.closest(".overlay"))el.setAttribute("data-key-hint",lab);});});}
document.addEventListener("keydown",e=>{
  if(APP.screen==="game"||e.repeat||e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.target&&e.target.closest&&e.target.closest("input,textarea,select"))return;
  const k=e.key===" "?"space":e.key.toLowerCase();
  if(k==="escape"&&APP.sheet){APP.sheet=null;render();e.preventDefault();return;}
  if(APP.sheet)return;
  const row=KEYMAP.find(([kk])=>kk===k);if(!row)return;
  const el=[...document.querySelectorAll(row[1].split(",").map(x=>"#app .view:not(.exiting) "+x).join(","))].find(b=>!b.disabled&&b.offsetParent);
  if(el){e.preventDefault();el.click();if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();}
});
document.addEventListener("change",e=>{if(/setup$/.test(APP.screen)&&e.target.dataset.i!=null)render();});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="chat-input"){e.preventDefault();if(e.target.value.trim()){say(e.target.value);}APP.sheet=null;render();return;}});
function selectCode(){const el=document.getElementById("code-text");if(!el)return;try{const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);}catch(e){}}
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.dataset&&e.target.dataset.bind==="joinCode"){
  if(APP.screen==="bj-mode")bjJoin();else if(APP.screen==="bc-mode")bcJoin();else if(APP.screen==="hm-mode")hmJoin();else if(APP.screen==="rm-mode")rmJoin();else if(APP.screen==="om-mode")omJoin();else joinGame();}});
document.addEventListener("contextmenu",e=>{if(e.target.closest(".seat,.peek"))e.preventDefault();});

render();
</script>
