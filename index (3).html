<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f2148">
<meta name="description" content="Card games with friends: Egyptian War, Blackjack, Baccarat, Jacks or Better, Texas Hold'em, Rummy and Old Maid. Host a table and share the code.">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px;font-family:system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<script>
/* Peer-to-peer connection layer: the first phone to open a table becomes its relay (a tiny server inside
   that phone's browser). Everyone else connects straight to it with WebRTC through PeerJS. If the relay
   leaves, the remaining phones race to become the new relay and reconnect. Same "room" interface the
   hub uses inside Claude. */
window.__HUB_CF=true;window.__HUB_P2P=true;
(()=>{
  const PREFIX="cardgamehub-";
  const MAX=8192;
  const ready=new Promise((res)=>{
    if(window.Peer)return res(true);
    const load=(src,next)=>{const s=document.createElement("script");s.src=src;s.onload=()=>res(!!window.Peer);s.onerror=next;document.head.appendChild(s);};
    load("https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js",()=>load("https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js",()=>res(false)));
  });
  function makeRoom(name){
    const relayId=PREFIX+name.toLowerCase().replace(/[^a-z0-9-]/g,"-");
    let role=null,peer=null,guestConn=null,open=false,closed=false,myKey=null,queued=false,attempt=0,watchdog=null;
    const mine={},peers=new Map(),conns=new Map(),listeners=new Set(),connL=new Set(),leftQ=[];
    const snapshot=()=>{const out=[{peer:myKey||"me",by:null,isMe:true,sameTab:true,kind:"viewer",guest:false,presence:{...mine},updatedAt:Date.now()}];
      for(const [k,v] of peers)out.push({peer:k,by:null,isMe:false,sameTab:false,kind:"viewer",guest:false,presence:v.presence,updatedAt:v.at});return out;};
    const notify=()=>{if(queued)return;queued=true;setTimeout(()=>{queued=false;const ch={peers:snapshot(),joined:[],left:leftQ.splice(0),updated:[]};
      listeners.forEach(fn=>{try{fn(ch);}catch(e){console.error(e);}});},0);};
    const setOpen=v=>{if(open===v)return;open=v;connL.forEach(fn=>{try{fn(v);}catch(e){}});};
    const send=(c,m)=>{try{if(c&&c.open)c.send(m);}catch(e){}};
    const broadcast=(m,except)=>{for(const [k,e] of conns)if(k!==except)send(e.conn,m);};
    const dropAll=()=>{for(const [k,v] of peers)leftQ.push({peer:k,presence:v.presence});peers.clear();notify();};
    const cleanup=()=>{clearTimeout(watchdog);try{guestConn&&guestConn.close();}catch(e){}guestConn=null;conns.clear();try{peer&&peer.destroy();}catch(e){}peer=null;role=null;};
    function lost(){if(closed)return;setOpen(false);cleanup();dropAll();
      const wait=Math.min(6000,800+attempt*700)+Math.random()*1200;attempt++;setTimeout(start,wait);}
    async function start(){
      if(closed)return;
      if(!(await ready)){setOpen(false);setTimeout(start,5000);return;}
      // try to become the relay; if the code is taken, someone else is relaying: join them
      const p=new Peer(relayId,{debug:0});peer=p;
      p.on("open",()=>{if(peer!==p)return;role="relay";myKey=relayId;attempt=0;setOpen(true);
        broadcast({t:"peer",peer:relayId,presence:mine});notify();});
      p.on("connection",c=>{if(peer!==p)return;
        c.on("open",()=>{conns.set(c.peer,{conn:c});
          send(c,{t:"welcome",you:c.peer,peers:[{peer:relayId,presence:mine},...[...peers].map(([k,v])=>({peer:k,presence:v.presence}))]});});
        c.on("data",m=>{if(!m||m.t!=="presence"||!m.patch||typeof m.patch!=="object")return;
          const cur=m.full?{}:{...((peers.get(c.peer)||{}).presence||{})};
          for(const k in m.patch){if(m.patch[k]===null)delete cur[k];else cur[k]=m.patch[k];}
          if(JSON.stringify(cur).length>MAX)return;
          peers.set(c.peer,{presence:cur,at:Date.now()});broadcast({t:"peer",peer:c.peer,presence:cur},c.peer);notify();});
        const gone=()=>{if(!conns.has(c.peer))return;conns.delete(c.peer);const v=peers.get(c.peer);peers.delete(c.peer);
          leftQ.push({peer:c.peer,presence:v?v.presence:{}});broadcast({t:"left",peer:c.peer});notify();};
        c.on("close",gone);c.on("error",gone);});
      p.on("disconnected",()=>{if(peer===p&&role==="relay"&&!closed){try{p.reconnect();}catch(e){}}});
      p.on("error",e=>{if(peer!==p)return;
        if(e.type==="unavailable-id"){try{p.destroy();}catch(err){}peer=null;joinAsGuest();}
        else if(role!=="relay")lost();});
    }
    function joinAsGuest(){
      if(closed)return;
      const p=new Peer({debug:0});peer=p;
      p.on("open",id=>{if(peer!==p)return;myKey=id;
        const c=p.connect(relayId,{reliable:true});
        watchdog=setTimeout(()=>{if(!guestConn)lost();},15000);
        c.on("open",()=>{clearTimeout(watchdog);guestConn=c;role="guest";attempt=0;setOpen(true);send(c,{t:"presence",patch:mine,full:true});});
        c.on("data",m=>{if(!m||typeof m!=="object")return;
          if(m.t==="welcome"){peers.clear();(m.peers||[]).forEach(x=>{if(x.peer!==myKey)peers.set(x.peer,{presence:x.presence||{},at:Date.now()});});notify();}
          else if(m.t==="peer"&&m.peer!==myKey){peers.set(m.peer,{presence:m.presence||{},at:Date.now()});notify();}
          else if(m.t==="left"){const v=peers.get(m.peer);if(v){peers.delete(m.peer);leftQ.push({peer:m.peer,presence:v.presence});notify();}}});
        c.on("close",lost);c.on("error",lost);});
      p.on("error",e=>{if(peer!==p)return;lost();});
    }
    start();
    return{name,
      presence(patch){for(const k in patch){if(patch[k]===null)delete mine[k];else mine[k]=patch[k];}
        if(role==="relay")broadcast({t:"peer",peer:relayId,presence:mine});else if(guestConn)send(guestConn,{t:"presence",patch});
        notify();return Promise.resolve();},
      peers:snapshot,
      onPeers(fn){listeners.add(fn);notify();return()=>listeners.delete(fn);},
      onConnection(fn){connL.add(fn);setTimeout(()=>fn(open),0);return()=>connL.delete(fn);},
      connected:()=>open,emit:()=>Promise.resolve(),on:()=>()=>{},
      leave(){closed=true;listeners.clear();connL.clear();cleanup();return Promise.resolve();}};
  }
  // no central server, so there's no shared lobby: tables are found by code or invite link
  const lobby={name:"",presence:()=>Promise.resolve(),peers:()=>[{peer:"me",isMe:true,sameTab:true,kind:"viewer",guest:false,presence:{},updatedAt:Date.now()}],
    onPeers:fn=>{setTimeout(()=>fn({peers:lobby.peers(),joined:[],left:[],updated:[]}),0);return()=>{};},onConnection:fn=>{setTimeout(()=>fn(true),0);return()=>{};},
    connected:()=>true,emit:()=>Promise.resolve(),on:()=>()=>{},leave:()=>Promise.resolve(),
    join:n=>Promise.resolve(makeRoom(n))};
  window.claude={use:async n=>n==="room"?((await ready)?lobby:null):null};
})();
</script>

</head>
<body>
<title>Card Game Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Montserrat:wght@500;600;700;800;900&display=swap">
<style>
/* Layout: same-phone mode = seats on two long edges around a center pile; online mode = opponents strip on top, pile in the middle, your own Flip/SLAP at the bottom. Lapis felt, gold leaf. */
:root{
  --felt:#0b4527; --felt-2:#1a7a44; --ink:#fff8e7; --muted:#cfe3d4;
  --gold:#f2d27a; --card:#fffdf8; --card-ink:#1a1a1a; --red:#b3141c; --warn:#ffa07a;
  --display:"Cinzel", "Palatino Linotype", Georgia, serif;
  --body:"Montserrat", system-ui, -apple-system, "Segoe UI", sans-serif;
  --wood:linear-gradient(#70401f,#4a2513); --wood-edge:#b8892f;
  --tex:radial-gradient(rgba(255,255,255,.07) .8px,transparent 1.2px) 0 0/4px 4px;
  --lamp:radial-gradient(ellipse 80% 45% at 50% 0%,rgba(255,236,190,.17),transparent 72%);
  --back:repeating-linear-gradient(45deg,#a3202a 0 4px,#8a1922 4px 8px); --back-edge:#fff;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--felt);color:var(--ink);font-family:var(--body);font-size:15px;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;overflow:hidden}
#app{height:100%}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.screen{height:100%;box-sizing:border-box;overflow:auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px;
  background:var(--lamp),var(--tex),radial-gradient(ellipse at 50% 35%,var(--felt-2),var(--felt) 70%)}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
h1{font-family:var(--display);font-weight:400;font-size:clamp(32px,9vw,46px);line-height:1.05;margin:4px 0 6px;text-wrap:balance}
h2{font-family:var(--display);font-weight:400;font-size:24px;margin:0;text-wrap:balance}
p{margin:0;line-height:1.5;color:var(--muted)}
.note{font-size:13px;color:var(--muted);line-height:1.45}
.note.warn{color:var(--warn)}
.game-tile,.mode{display:flex;gap:14px;align-items:center;text-align:left;width:100%;padding:16px;border-radius:16px;
  background:rgba(255,255,255,.04);border:1px solid rgba(242,210,122,.45)}
.game-tile:hover,.mode:hover:not(:disabled){background:rgba(242,210,122,.08)}
.mode .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(242,210,122,.15);color:var(--gold);font-family:var(--display);font-size:20px;flex:none}
.mini-fan{position:relative;width:70px;height:72px;flex:none}
.mini-fan .card{position:absolute;--w:44px;top:6px}
.meta{display:flex;flex-direction:column;gap:3px;min-width:0}
.meta span{font-size:13px;color:var(--muted)}
.btn{border:0;border-radius:12px;padding:14px 18px;font-weight:800;letter-spacing:.02em}
.btn.gold{background:var(--gold);color:#1a1405}
.btn.ghost{background:transparent;border:1px solid rgba(243,234,214,.3)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.count-pick{display:flex;gap:8px}
.count-pick button{flex:1;padding:12px 0;border-radius:10px;border:1px solid rgba(243,234,214,.25);background:transparent;font-weight:800;font-variant-numeric:tabular-nums}
.count-pick button[aria-pressed="true"]{background:var(--gold);color:#1a1405;border-color:var(--gold)}
.names{display:flex;flex-direction:column;gap:8px}
.names label,.field{display:flex;align-items:center;gap:10px}
.dot{width:14px;height:14px;border-radius:50%;flex:none}
input.txt{flex:1;min-width:0;padding:12px;border-radius:10px;border:1px solid rgba(243,234,214,.2);background:rgba(0,0,0,.2);color:var(--ink);font:inherit;-webkit-user-select:text;user-select:text}
input.code{text-transform:uppercase;letter-spacing:.3em;font-family:var(--display);font-size:22px;text-align:center}
.label{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.back{align-self:flex-start;background:none;border:0;color:var(--muted);padding:4px 0;font-weight:600}
.bigcode{font-family:var(--display);font-size:56px;letter-spacing:.25em;color:var(--gold);text-align:center;padding:10px 0 4px;-webkit-user-select:text;user-select:text}
.roster{display:flex;flex-direction:column;gap:6px}
.roster div{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.04)}
.roster em{margin-left:auto;font-style:normal;font-size:12px;color:var(--muted)}

/* Cards */
.card{--w:68px;width:var(--w);height:calc(var(--w)*1.4);border-radius:calc(var(--w)*.1);background:var(--card);color:var(--card-ink);
  box-shadow:0 2px 0 rgba(0,0,0,.15),0 8px 18px rgba(0,0,0,.35);position:relative;box-sizing:border-box;font-family:var(--display)}
.card.red{color:var(--red)}
.card .c{position:absolute;display:flex;flex-direction:column;align-items:center;line-height:.95;font-size:calc(var(--w)*.24)}
.card .c small{font-size:calc(var(--w)*.2)}
.card .tl{top:6%;left:8%}.card .br{bottom:6%;right:8%;transform:rotate(180deg)}
.card .mid{position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--w)*.5)}
.card.royal .mid{font-size:calc(var(--w)*.56)}
.card.royal{box-shadow:inset 0 0 0 calc(var(--w)*.045) var(--card),inset 0 0 0 calc(var(--w)*.065) var(--gold),0 8px 18px rgba(0,0,0,.35)}

/* Table */
#game{height:100%;display:grid;grid-template-rows:auto 1fr auto;
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-block:8px;box-sizing:border-box;gap:6px;
  background:var(--lamp),var(--tex),radial-gradient(ellipse at 50% 50%,var(--felt-2),var(--felt) 75%)}
.seats{display:flex;gap:6px}
.seat{flex:1;min-width:0;border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:6px;
  background:rgba(0,0,0,.18);border:1.5px solid color-mix(in srgb,var(--pc) 40%,transparent);transition:box-shadow .2s,border-color .2s}
.seats.top .seat{transform:rotate(180deg)}
.seat.turn,.opp.turn{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold),0 0 22px rgba(242,210,122,.35)}
.seat.out,.opp.out{opacity:.45}
.head{display:flex;align-items:center;gap:6px;min-width:0}
.nm{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.ct{font-variant-numeric:tabular-nums;font-weight:800;font-size:13px;background:rgba(255,255,255,.08);padding:2px 7px;border-radius:99px}
.st{font-size:12px;color:var(--muted);min-height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st b{color:var(--gold)}
.acts{display:flex;gap:6px}
.flip,.slap{border:0;border-radius:12px;font-weight:800;height:58px}
.flip{flex:1;background:rgba(255,255,255,.07);color:var(--muted);font-size:14px}
.flip.on{background:var(--gold);color:#1a1405}
.slap{flex:1.4;background:var(--pc);color:#141414;font-size:17px;letter-spacing:.06em}
.slap:active,.flip.on:active{transform:scale(.96)}
.acts kbd{display:none;margin-left:6px;font:700 10px/1 var(--body);letter-spacing:.04em;padding:3px 5px;border-radius:5px;
  background:rgba(0,0,0,.18);border:1px solid rgba(0,0,0,.25);vertical-align:middle}
.flip:not(.on) kbd{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18)}
@media (hover:hover) and (pointer:fine){.acts kbd{display:inline-block}
  /* on a computer everyone sits on the same side, so nothing is flipped upside down */
  .seats.top .seat{transform:none}.center .flip180{display:none}}
.seats.n3 .slap,.seats.n3 .flip{height:52px}
.pips{display:inline-flex;gap:3px;vertical-align:middle;margin-left:4px}
.pips i{width:7px;height:7px;border-radius:50%;background:var(--gold)}
/* online */
.opps{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:6px}
.opp{min-width:0;border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:3px;background:rgba(0,0,0,.18);border:1.5px solid color-mix(in srgb,var(--pc) 40%,transparent)}
.seat.me .flip,.seat.me .slap{height:84px}
.seat.me .slap{font-size:22px}
.watch{text-align:center;padding:14px;color:var(--muted)}

.center{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:0;border-radius:18px;transition:background .25s}
.center.flash{background:color-mix(in srgb,var(--flash) 22%,transparent)}
.msg{font-family:var(--display);font-size:clamp(15px,4.4vw,20px);text-align:center;min-height:1.3em;max-width:88%;text-wrap:balance}
.toast{font-size:13px;color:var(--gold);font-weight:600;text-align:center;min-height:1.2em;max-width:88%}
.flip180{transform:rotate(180deg)}
.pile{position:relative;width:180px;height:120px;flex:none}
.pile .card{position:absolute;top:8px;left:50%;--w:clamp(58px,17vw,78px)}
.pile .empty{position:absolute;inset:8px 50px;border:2px dashed rgba(242,210,122,.35);border-radius:10px;display:grid;place-items:center;color:var(--muted);font-size:12px;text-align:center}
.pilecount{position:absolute;left:4px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;writing-mode:vertical-rl}

.card.enter{animation:enter .22s ease-out}
@keyframes sweep{to{transform:translateY(calc(var(--dy)*220px)) scale(.6);opacity:0}}
.pile-sweep{position:absolute;pointer-events:none;animation:sweep .45s ease-in forwards}
.menu-btn{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;border:1px solid rgba(243,234,214,.25);background:rgba(0,0,0,.2);font-size:18px;line-height:1}
.net{position:absolute;left:50%;top:4px;transform:translateX(-50%);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--warn);background:rgba(0,0,0,.35);padding:3px 8px;border-radius:99px;white-space:nowrap}

.overlay{position:fixed;inset:0;background:rgba(4,20,10,.78);display:grid;place-items:center;z-index:20;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px}
.sheet{background:var(--felt);border:1px solid rgba(242,210,122,.5);border-radius:18px;padding:20px;max-width:480px;width:100%;max-height:100%;overflow:auto;box-sizing:border-box;display:flex;flex-direction:column;gap:14px}
.sheet h3{font-family:var(--display);font-weight:400;font-size:18px;margin:6px 0 0;color:var(--gold)}
.sheet ul{margin:0;padding-left:18px;color:var(--muted);line-height:1.5}
.sheet li b{color:var(--ink)}
.chances{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.chances div{background:rgba(255,255,255,.05);border-radius:10px;padding:8px 0}
.chances strong{display:block;font-family:var(--display);font-size:22px;color:var(--gold)}
.chances span{font-size:12px;color:var(--muted)}
.win{text-align:center;align-items:center}
.win .btn{width:100%}
/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--gold);white-space:nowrap}
.chip::before{content:"";width:12px;height:12px;border-radius:50%;background:radial-gradient(circle,var(--felt) 0 30%,var(--gold) 32% 100%);box-shadow:0 0 0 1.5px var(--gold) inset;flex:none}
.chip.short{color:var(--warn)}
.wallet{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:12px;background:rgba(242,210,122,.08);border:1px solid rgba(242,210,122,.3)}
.wallet .chip{font-size:20px}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:13px;padding:4px}
.stakes{display:flex;gap:6px;flex-wrap:wrap}
.stakes button{flex:1;min-width:52px;padding:10px 0;border-radius:10px;border:1px solid rgba(242,210,122,.4);background:transparent;font-weight:800;font-variant-numeric:tabular-nums}
.stakes button[aria-pressed="true"]{background:var(--gold);color:#1a1405}
.potline{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.pot{position:absolute;right:46px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.pot .chip{font-size:15px}
.roster .ok{color:#9fd46b}
.delta{font-family:var(--display);font-size:26px}
.delta.up{color:#9fd46b}.delta.down{color:var(--warn)}
/* Blackjack table: dealer arc at top, felt print, player boxes, action rail */
.card.down{background:var(--back);box-shadow:inset 0 0 0 max(2px,calc(var(--w)*.06)) var(--back-edge),0 6px 14px rgba(0,0,0,.35)}

#bj{height:100%;display:grid;grid-template-rows:auto auto auto minmax(0,1fr) auto;gap:8px;box-sizing:border-box;
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));padding-block:8px;
  background:var(--lamp),var(--tex),radial-gradient(ellipse at 50% -10%,var(--felt-2),var(--felt) 72%)}
.bj-top{display:flex;align-items:center;gap:8px;min-width:0}
.codepill{font-family:var(--display);letter-spacing:.2em;color:var(--gold);border:1px solid rgba(242,210,122,.45);border-radius:99px;padding:2px 10px;font-size:13px}
.shoe{margin-left:auto;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.menu-btn2{width:36px;height:36px;border-radius:50%;border:1px solid rgba(243,234,214,.25);background:rgba(0,0,0,.2);font-size:18px;line-height:1;flex:none}
.dealer{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:4px}
.dealer .net{top:-2px}
.hand{display:flex;align-items:flex-start;min-height:calc(var(--cw,40px)*1.4)}
.hand .card{--w:var(--cw,40px)}
.hand .card+.card{margin-left:calc(var(--w)*-.5)}
.dealer .hand{--cw:clamp(52px,15vw,68px)}
.dealer .hand .card+.card{margin-left:calc(var(--w)*-.3)}
.slot{width:var(--cw);height:calc(var(--cw)*1.4);border:2px dashed rgba(242,210,122,.3);border-radius:8px;box-sizing:border-box}
.slot+.slot{margin-left:8px}
.dmeta{display:flex;align-items:center;gap:8px}
.felt-line{font-family:var(--display);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);opacity:.75;text-align:center;
  padding:5px 14px;border-block:1px solid rgba(242,210,122,.3);max-width:100%;box-sizing:border-box}
.bj-msg{display:flex;flex-direction:column;align-items:center;gap:2px}
.bj-players{overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;align-content:start;min-height:0}
.pbox{min-width:0;border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:6px;background:rgba(0,0,0,.18);
  border:1.5px solid color-mix(in srgb,var(--pc) 40%,transparent);transition:box-shadow .2s,border-color .2s}
.pbox.turn{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold),0 0 20px rgba(242,210,122,.3)}
.pbox.me{background:rgba(242,210,122,.07)}
.pbox.out{opacity:.55}
.st2{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.warnt{color:var(--warn)}
.phand{display:flex;flex-direction:column;gap:4px;padding:4px;border-radius:10px}
.phand.active{background:rgba(242,210,122,.16)}
.phand .hand{--cw:38px}
.phand .card .br{display:none}
.hmeta{display:flex;align-items:center;gap:6px;font-size:12px;flex-wrap:wrap}
.tot{font-weight:800;font-variant-numeric:tabular-nums;background:rgba(255,255,255,.1);padding:1px 8px;border-radius:99px;font-size:13px;white-space:nowrap}
.tot.over{color:var(--warn)}
.res{font-weight:800;font-size:12px;margin-left:auto;white-space:nowrap}
.res.win{color:#9fd46b}.res.lose{color:var(--warn)}.res.push{color:var(--muted)}
.tokens{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.token{--tc:var(--gold);width:46px;height:46px;border-radius:50%;border:0;padding:0;display:grid;place-items:center;font-weight:800;font-size:13px;color:#141414;flex:none;
  background:radial-gradient(circle,var(--tc) 0 50%,#f3ead6 51% 55%,transparent 56%),repeating-conic-gradient(var(--tc) 0 22.5deg,#f3ead6 22.5deg 45deg);
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.2),0 3px 0 rgba(0,0,0,.3)}
.token.sm{width:34px;height:34px;font-size:11px}
.token:active:not(:disabled){transform:translateY(2px);box-shadow:inset 0 0 0 2px rgba(0,0,0,.2),0 1px 0 rgba(0,0,0,.3)}
.token:disabled{opacity:.28}
.token.clear{background:transparent;box-shadow:none;border:1.5px solid rgba(243,234,214,.35);color:var(--muted)}
.bj-bar{display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:16px;background:rgba(0,0,0,.25)}
.betrow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.who{display:flex;align-items:center;gap:8px;min-width:0}
.who .tot{margin-left:auto}
.bj-acts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.bj-acts button{height:58px;border:0;border-radius:12px;font-weight:800;background:rgba(255,255,255,.09);font-size:15px}
.bj-acts .hit{background:var(--gold);color:#1a1405}
.bj-acts button:active:not(:disabled){transform:scale(.96)}
.payouts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.payouts div{background:rgba(255,255,255,.05);border-radius:10px;padding:8px 0}
.payouts strong{display:block;font-family:var(--display);font-size:20px;color:var(--gold)}
.payouts span{font-size:12px;color:var(--muted)}
/* Baccarat: Player and Banker boxes side by side, third card dealt sideways, bead road of results */
:root{--p-side:#5fb4f0;--b-side:#f08a6c}
#bc{height:100%;display:grid;grid-template-rows:auto auto auto minmax(0,1fr) auto;gap:8px;box-sizing:border-box;
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));padding-block:8px;
  background:var(--lamp),var(--tex),radial-gradient(ellipse at 50% -10%,var(--felt-2),var(--felt) 72%)}
.board{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
.bside{--sc:var(--gold);min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:16px;
  border:1.5px solid color-mix(in srgb,var(--sc) 35%,transparent);transition:background .3s,box-shadow .3s}
.bside.player{--sc:var(--p-side)}.bside.banker{--sc:var(--b-side)}
.bside.win{background:color-mix(in srgb,var(--sc) 16%,transparent);border-color:var(--sc);box-shadow:0 0 22px color-mix(in srgb,var(--sc) 30%,transparent)}
.bside .label{color:var(--sc)}
.bhand{--cw:clamp(40px,11.5vw,58px);display:flex;align-items:center;justify-content:center;min-height:calc(var(--cw)*1.4)}
.bhand .card{--w:var(--cw)}
.bhand .card+.card{margin-left:calc(var(--w)*-.22)}
.bhand .card.third{margin-left:calc(var(--w)*.12);margin-right:calc(var(--w)*.2)}
.score{font-family:var(--display);font-size:32px;line-height:1;font-variant-numeric:tabular-nums}
.road{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;min-height:20px}
.bead{--sc:var(--gold);width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:800;color:#141414;background:var(--sc);flex:none}
.bead.p{--sc:var(--p-side)}.bead.b{--sc:var(--b-side)}
.sides{display:grid;grid-template-columns:1fr .8fr 1fr;gap:6px}
.side{--sc:var(--gold);min-width:0;border-radius:12px;border:1.5px solid color-mix(in srgb,var(--sc) 55%,transparent);background:transparent;padding:9px 4px;
  display:flex;flex-direction:column;align-items:center;gap:2px}
.side.player{--sc:var(--p-side)}.side.banker{--sc:var(--b-side)}
.side strong{font-family:var(--display);font-weight:400;font-size:17px;color:var(--sc)}
.side span{font-size:11px;color:var(--muted)}
.side[aria-pressed="true"]{background:var(--sc)}
.side[aria-pressed="true"] strong,.side[aria-pressed="true"] span{color:#141414}
.sides.sm{gap:4px}.sides.sm .side{padding:5px 2px;border-radius:9px}.sides.sm strong{font-size:12px;font-family:var(--body);font-weight:800}
.sidetag{--sc:var(--gold);font-weight:800;color:var(--sc)}
.sidetag.player{--sc:var(--p-side)}.sidetag.banker{--sc:var(--b-side)}
.bc-table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
.bc-table th,.bc-table td{padding:6px 8px;text-align:left;border-bottom:1px solid rgba(243,234,214,.12)}
.bc-table th{color:var(--gold);font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.bc-table td{color:var(--muted)}.bc-table td:first-child{color:var(--ink);font-weight:800}
/* Jacks or Better: a video poker cabinet. Gold paytable glass on top, five cards, button deck below */
#jb{height:100%;overflow:auto;box-sizing:border-box;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));padding-block:8px 16px;
  background:var(--lamp),var(--tex),radial-gradient(ellipse at 50% -10%,var(--felt-2),var(--felt) 72%)}
.jb-in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.paywrap{overflow-x:auto;border-radius:12px;border:1.5px solid var(--gold);background:rgba(0,0,0,.28)}
.paytable{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:12px}
.paytable th{text-align:left;font-weight:600;padding:3px 8px;white-space:nowrap;letter-spacing:.06em;text-transform:uppercase;font-size:11px;color:var(--ink)}
.paytable td{text-align:right;padding:3px 8px;color:var(--gold);white-space:nowrap}
.paytable td.on{background:rgba(242,210,122,.18);color:#fff3cf;font-weight:800}
.paytable tr.dealt th{color:var(--gold)}
.paytable tr.hit th,.paytable tr.hit td{background:var(--gold);color:#1a1405;font-weight:800}
.jcards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;justify-items:center;padding-top:8px}
.jcard{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}
.jcard:disabled{cursor:default;opacity:1}
.jcard .card{--w:min(17vw,92px);transition:transform .15s}
.jcard.held .card{transform:translateY(-8px);box-shadow:0 0 0 3px var(--gold),0 10px 20px rgba(0,0,0,.4)}
.jcard.sug .card{outline:2px dashed var(--p-side);outline-offset:4px}
.heldtag{font-size:11px;font-weight:800;letter-spacing:.16em;color:var(--gold);visibility:hidden}
.jcard.held .heldtag{visibility:visible}
.jctrl{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:8px;align-items:stretch}
.betbox{display:flex;flex-direction:column;justify-content:center;padding:6px 10px;border-radius:12px;background:rgba(0,0,0,.22)}
.betbox strong{font-family:var(--display);font-weight:400;font-size:18px;color:var(--gold)}
.coinpick{flex:0 1 200px}.coinpick button{padding:8px 0}
.jdeal{font-size:20px;padding:18px}
.jb-bots{display:flex;flex-direction:column;gap:6px}
.jb-bots>div{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:10px;background:rgba(255,255,255,.04)}
.jb-bots .nm{flex:0 1 auto;font-weight:800}
.jb-bots .res{margin-left:auto}
.coach .link{padding:0 0 0 4px;color:var(--gold)}
/* Texas Hold'em: opponents ring up top, the board and pot in the middle, your cards and actions in the rail */
#hm{height:100%;display:grid;grid-template-rows:auto minmax(0,auto) auto 1fr;gap:8px;box-sizing:border-box;overflow:auto;
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));padding-block:8px;
  background:var(--lamp),var(--tex),radial-gradient(ellipse at 50% 45%,#16391f,#0a1f10 80%)}
.hseats{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:6px;align-content:start}
.hseat{min-width:0;border-radius:12px;padding:7px;display:flex;flex-direction:column;gap:4px;background:rgba(0,0,0,.2);
  border:1.5px solid color-mix(in srgb,var(--pc) 40%,transparent);transition:box-shadow .2s,border-color .2s}
.hseat.turn{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold),0 0 18px rgba(242,210,122,.3)}
.hseat.fold{opacity:.5}
.hseat .head{gap:5px}
.badge{font-size:10px;font-weight:800;padding:1px 5px;border-radius:99px;background:rgba(255,255,255,.12);color:var(--ink);flex:none}
.badge.dealer{background:var(--ink);color:#141414}
.hrow{display:flex;align-items:center;gap:6px;min-height:42px}
.hand.mini{--cw:28px;min-height:auto}
.hand.mini .card .br,.hand.mini .card .mid{display:none}
.hand.mini .card+.card{margin-left:calc(var(--w)*-.35)}
.hinfo{display:flex;flex-direction:column;gap:2px;margin-left:auto;align-items:flex-end}
.betchip{font-size:12px;font-weight:800;color:#141414;background:var(--gold);border-radius:99px;padding:1px 8px;font-variant-numeric:tabular-nums}
.hboard{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0;border-radius:90px/40px;
  border:1.5px solid rgba(242,210,122,.3);background:rgba(0,0,0,.12)}
.hcards{display:flex;gap:5px;--cw:clamp(44px,13vw,62px)}
.hcards .card{--w:var(--cw)}
.hcards .slot+.slot{margin-left:0}
.potline2{display:flex;align-items:center;gap:8px}
.potline2 .chip{font-size:18px}
.hmine{display:flex;align-items:center;gap:12px}
.hmine .meta{gap:4px}
.hand.big{--cw:clamp(54px,15vw,70px)}
.hand.big .card+.card{margin-left:calc(var(--w)*-.2)}
.peek{padding:8px 12px;font-size:13px;touch-action:none;-webkit-touch-callout:none}
.hacts{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:6px}
.hacts button{height:56px;border:0;border-radius:12px;font-weight:800;background:rgba(255,255,255,.09);font-size:15px}
.hacts .call{background:var(--gold);color:#1a1405}
.hacts button[aria-expanded="true"]{box-shadow:inset 0 0 0 2px var(--gold)}
.hacts button:active:not(:disabled){transform:scale(.96)}
.raisebox{display:flex;flex-direction:column;gap:8px}
.presets{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.presets .btn{padding:10px 0;font-size:13px}
.raisebox .betrow .btn{width:52px;padding:10px 0;font-size:20px}
.raiseamt{display:flex;align-items:center;gap:6px;font-weight:600}
.menu-home{border-color:rgba(242,210,122,.6);color:var(--gold)}
.tsec{flex:none;font:800 11px/1 var(--body);font-variant-numeric:tabular-nums;padding:3px 7px;border-radius:99px;
  background:rgba(242,210,122,.18);color:var(--gold);margin-left:6px;transition:background .2s,color .2s}
.tsec.low{background:var(--warn);color:#141414;animation:tick 1s steps(2) infinite}
@keyframes tick{50%{opacity:.6}}
@media (prefers-reduced-motion:reduce){.tsec.low{animation:none}}
/* ===== look and feel layer ===== */
.ava{width:var(--as);height:var(--as);border-radius:50%;background:var(--ac);color:#141414;display:inline-grid;place-items:center;
  font:800 calc(var(--as)*.38)/1 var(--body);flex:none;letter-spacing:.02em;box-shadow:0 0 0 2px rgba(0,0,0,.18)}
/* main menu */
.hubhead{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hubhead h1{margin:2px 0 0}
.avabtn{border:0;background:none;padding:0;border-radius:50%;box-shadow:0 0 0 2px var(--gold)}
.bank{display:flex;align-items:center;gap:14px;padding:14px;border-radius:18px;background:rgba(0,0,0,.25);border:1px solid rgba(242,210,122,.4)}
.bank .meta{flex:1;gap:2px}
.bankamt,.meta .bankamt{font-family:var(--display);font-size:30px;line-height:1;color:var(--gold);font-variant-numeric:tabular-nums}
.bankamt small{font:800 12px var(--body)}
.collect{flex:none;width:74px;height:74px;border-radius:50%;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;color:#1a1405;
  background:radial-gradient(circle,var(--gold) 0 52%,var(--ink) 53% 57%,var(--gold) 58%);font:800 11px var(--body);
  box-shadow:0 0 0 4px rgba(242,210,122,.25),0 0 24px rgba(242,210,122,.55);animation:glow 2.4s ease-in-out infinite}
.collect b{font-size:18px}
@keyframes glow{50%{box-shadow:0 0 0 6px rgba(242,210,122,.15),0 0 34px rgba(242,210,122,.75)}}
.nextfree{flex:none;font-size:12px;color:var(--muted);text-align:right;line-height:1.35}
.stacks{display:inline-flex;align-items:flex-end;gap:3px;flex:none}
.stk{display:flex;flex-direction:column-reverse}
.stk i{display:block;width:24px;height:7px;border-radius:50%;background:var(--cc);box-shadow:inset 0 0 0 1px rgba(255,255,255,.55),0 1px 0 rgba(0,0,0,.35);margin-top:-2px}
.bank .stk i{width:40px;height:7px;margin-top:0}
.openhead{display:flex;align-items:center;gap:8px}
.live{width:8px;height:8px;border-radius:50%;background:#9fd46b;box-shadow:0 0 8px #9fd46b}
.opentable{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:rgba(159,212,107,.08);border:1px solid rgba(159,212,107,.4)}
.ot-meta{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.opentable .btn{background:#9fd46b;color:#141414;padding:10px 16px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ttile{height:128px;padding:12px;border-radius:64px 64px 16px 16px;border:2px solid #a8822f;color:var(--ink);text-align:left;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.2),0 8px 18px rgba(0,0,0,.3);transition:transform .15s}
.ttile:hover{transform:translateY(-2px)}
.ttile .tn{font-family:var(--display);font-size:18px;line-height:1.1}
.ttile .ts{font-size:11px;opacity:.85}
.ttile.bj{background:radial-gradient(ellipse at 50% 30%,#2f7a4f,#1c4f33 75%)}
.ttile.bc{background:radial-gradient(ellipse at 50% 30%,#8a2a2a,#5a1717 75%)}
.ttile.hm{background:radial-gradient(ellipse at 50% 30%,#2b54ad,#15306a 75%)}
.ttile.jb{border-radius:16px;background:linear-gradient(#2e2648,#171326)}
.ttile.ew{background:radial-gradient(ellipse at 50% 30%,#6a4a1f,#3a2810 80%)}
.ttile.om{background:radial-gradient(ellipse at 50% 30%,#7a3a5e,#4a1f38 75%)}
.ttile.rm{background:radial-gradient(ellipse at 50% 30%,#1f6f6a,#0f4643 75%)}
.ttile.wide{grid-column:span 2;height:auto;border-radius:16px;flex-direction:row;align-items:center;justify-content:space-between;padding:14px 16px}
.ttile.wide>span:first-child{display:flex;flex-direction:column;gap:2px}
.tbadge{font-size:11px;font-weight:800;padding:4px 8px;border-radius:99px;background:rgba(0,0,0,.3);color:var(--gold)}
/* profile */
.prof{display:flex;align-items:center;gap:14px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:44px;height:44px;border-radius:50%;border:0;background:var(--sc);box-shadow:inset 0 0 0 3px rgba(0,0,0,.2)}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 3px var(--felt),0 0 0 5px var(--gold)}
.card2{display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:16px;background:rgba(0,0,0,.24);border:1px solid rgba(242,210,122,.25)}
.stiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stile{display:flex;flex-direction:column;gap:4px;padding:12px;border-radius:14px;background:rgba(255,255,255,.05);min-width:0}
.stile .sv{font-family:var(--display);font-size:21px;color:var(--gold);line-height:1.1}
.grow{display:grid;grid-template-columns:minmax(0,1fr) auto 56px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid rgba(243,234,214,.08)}
.grow b{text-align:right;font-variant-numeric:tabular-nums}
.up{color:#9fd46b}.down{color:var(--warn)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;background:none;border:0;padding:4px 0;text-align:left;font-size:14px}
.switch i{flex:none;width:44px;height:26px;border-radius:99px;background:rgba(255,255,255,.15);position:relative;transition:background .2s}
.switch i::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:var(--ink);transition:transform .2s}
.switch[aria-checked="true"] i{background:var(--gold)}
.switch[aria-checked="true"] i::after{transform:translateX(18px);background:#1a1405}
/* hold'em table */
.hseats{grid-template-columns:repeat(auto-fit,minmax(96px,1fr))}
.hseat2{min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;text-align:center}
.hseat2.fold{opacity:.45}
.hseat2 .nm{font-weight:800;font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hseat2 .st2{justify-content:center;min-height:16px}
.hseat2 .thinking{color:var(--gold)}
.hseat2 .hand.mini{margin-top:2px}
.ringwrap{position:relative;width:60px;height:60px;display:grid;place-items:center}
.ringwrap .tsec{position:absolute;right:-8px;bottom:-4px;margin:0}
.ring{position:absolute;inset:0;width:60px;height:60px;transform:rotate(-90deg)}
.rbg{fill:none;stroke:rgba(255,255,255,.12);stroke-width:4}
.rfg{fill:none;stroke:var(--gold);stroke-width:4;stroke-linecap:round;stroke-dasharray:170;animation:ringdrain linear forwards;transition:stroke .3s}
.rfg.low{stroke:var(--warn)}
@keyframes ringdrain{to{stroke-dashoffset:170}}
.hseat2.turn .ava{box-shadow:0 0 18px rgba(242,210,122,.6)}

/* ===== Online casino look: dark lobby, glossy lit buttons, sleek panels, gold lettering ===== */
:root{
  --g-gold:linear-gradient(180deg,#fff2bd 0%,#f7cb4d 40%,#e2a523 60%,#b9780f 100%);--e-gold:#7a4c08;
  --g-green:linear-gradient(180deg,#86e894 0%,#33b553 42%,#1f913d 62%,#146a2b 100%);--e-green:#0b4519;
  --g-red:linear-gradient(180deg,#ff9a90 0%,#e8413b 42%,#c62828 62%,#8f1b1b 100%);--e-red:#560d0d;
  --g-blue:linear-gradient(180deg,#9cccff 0%,#3a84ee 42%,#1f62c6 62%,#144894 100%);--e-blue:#0b2a58;
  --g-dark:linear-gradient(180deg,#4a5468 0%,#2d3442 48%,#1f242f 100%);--e-dark:#0b0d12;
  --panel:linear-gradient(180deg,rgba(30,34,46,.97),rgba(13,15,21,.98));
  --goldtext:linear-gradient(180deg,#fff6d0 0%,#f7cf5c 45%,#d69a22 70%,#f3c75a 100%);
}
/* lobby and menus: dark with a warm spotlight; game tables keep their felt */
.screen{background:radial-gradient(ellipse 90% 45% at 50% -5%,rgba(247,203,77,.16),transparent 70%),radial-gradient(ellipse at 50% 0%,#23293b,#0c0f17 72%)}
html.desk body{background:radial-gradient(ellipse 70% 60% at 50% 20%,#1a1f2e,#06070b 75%)}
/* lettering */
h1,.cel-t,.bigcode{font-family:var(--display);font-weight:900;letter-spacing:.02em;background:var(--goldtext);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 2px 0 rgba(0,0,0,.45))}
h2,.sheet h3{font-family:var(--display);font-weight:700}
.eyebrow{font-family:var(--body);font-weight:800;letter-spacing:.22em;font-size:11px}
.tagline{font-weight:600;color:var(--muted);font-size:14px}
.bankamt,.potamt,.score,.delta,.betbox strong,.stile .sv{font-family:var(--body);font-weight:900;letter-spacing:-.01em}
.bankamt,.potamt{background:var(--goldtext);-webkit-background-clip:text;background-clip:text;color:transparent}
.label,.st2,.note{font-weight:600}
.felt-line{font-family:var(--display);font-style:normal;font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase}
.card{font-family:var(--body)}
.card .c{font-weight:800;letter-spacing:-.03em}
.card.royal .mid{font-family:var(--display);font-weight:900}
.msg{font-family:var(--body);font-weight:700}
/* glossy buttons */
.bj-acts button,.hacts button,.rmacts button,.btn,.flip,.slap,.mode,.stakes button,.count-pick button{
  --bg:var(--g-dark);--edge:var(--e-dark);--ink:#f5f1e6;
  background:var(--bg)!important;color:var(--ink)!important;border:0!important;border-radius:14px;font-family:var(--body);font-weight:800;
  text-shadow:0 1px 1px rgba(0,0,0,.35);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -2px 0 rgba(0,0,0,.18),0 4px 0 var(--edge),0 8px 16px rgba(0,0,0,.45);
  transition:transform .09s ease-out,box-shadow .09s ease-out,filter .15s}
.bj-acts button,.hacts button,.rmacts button,.btn.gold,.flip,.slap{text-transform:uppercase;letter-spacing:.08em}
.btn.gold,.bj-acts .hit,.hacts .call,.flip.on,.count-pick button[aria-pressed="true"],.stakes button[aria-pressed="true"],.rmacts .call{--bg:var(--g-gold);--edge:var(--e-gold);--ink:#2a1700;text-shadow:0 1px 0 rgba(255,255,255,.35)}
.btn.gold,.bj-acts .hit,.hacts .call,.flip.on{box-shadow:inset 0 1px 0 rgba(255,255,255,.8),inset 0 -2px 0 rgba(0,0,0,.15),0 4px 0 var(--edge),0 8px 18px rgba(0,0,0,.45),0 0 22px rgba(247,203,77,.35)}
.bj-acts [data-a="hit"]{--bg:var(--g-green);--edge:var(--e-green);--ink:#fff;text-shadow:0 1px 1px rgba(0,0,0,.4);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -2px 0 rgba(0,0,0,.18),0 4px 0 var(--edge),0 8px 18px rgba(0,0,0,.45),0 0 20px rgba(51,181,83,.35)}
.bj-acts [data-a="stand"],.hacts [data-a="fold"]{--bg:var(--g-red);--edge:var(--e-red);--ink:#fff;text-shadow:0 1px 1px rgba(0,0,0,.4)}
.bj-acts [data-a="double"]{--bg:var(--g-gold);--edge:var(--e-gold);--ink:#2a1700;text-shadow:0 1px 0 rgba(255,255,255,.35)}
.bj-acts [data-a="split"]{--bg:var(--g-blue);--edge:var(--e-blue);--ink:#fff}
.hacts [data-a="check"],.hacts [data-a="call"]{--bg:var(--g-green);--edge:var(--e-green);--ink:#fff;text-shadow:0 1px 1px rgba(0,0,0,.4)}
.slap{--bg:var(--g-red);--edge:var(--e-red);--ink:#fff;font-size:20px}
.btn.ghost,.mode{--bg:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.03));--edge:rgba(0,0,0,.5);box-shadow:inset 0 0 0 1px rgba(247,203,77,.35),inset 0 1px 0 rgba(255,255,255,.12),0 4px 0 var(--edge),0 8px 16px rgba(0,0,0,.35)}
@media (hover:hover){.bj-acts button:hover:not(:disabled),.hacts button:hover:not(:disabled),.rmacts button:hover:not(:disabled),.btn:hover:not(:disabled),.flip:hover,.slap:hover,.mode:hover:not(:disabled){filter:brightness(1.08) saturate(1.05)}}
.bj-acts button:active:not(:disabled),.hacts button:active:not(:disabled),.rmacts button:active:not(:disabled),.btn:active:not(:disabled),.flip:active,.slap:active,.mode:active:not(:disabled){transform:translateY(3px);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 2px 6px rgba(0,0,0,.25),0 1px 0 var(--edge),0 3px 8px rgba(0,0,0,.4)}
.bj-acts button:disabled,.hacts button:disabled,.rmacts button:disabled,.btn:disabled,.mode:disabled{filter:grayscale(.85) brightness(.6);opacity:.55;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 2px 0 var(--edge)}
.link{color:#f7cf5c;font-weight:700}
.mode .ic{background:var(--g-gold);color:#2a1700;font-family:var(--body);font-weight:900;box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 2px 0 var(--e-gold)}
.mode .meta strong{font-weight:800;font-size:16px}
/* sleek panels */
.bj-bar{background:var(--panel)!important;border-top:1px solid rgba(247,203,77,.55)!important;border-radius:20px 20px 0 0;box-shadow:0 -14px 34px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.06)!important}
.seat.me{background:var(--panel)!important;border-color:rgba(247,203,77,.55)!important}
.bank{background:var(--panel)!important;border:1px solid rgba(247,203,77,.5)!important;box-shadow:0 0 0 1px rgba(0,0,0,.5),0 10px 30px rgba(0,0,0,.45),0 0 30px rgba(247,203,77,.12),inset 0 1px 0 rgba(255,255,255,.06)}
.sheet{background:radial-gradient(ellipse 90% 40% at 50% 0%,rgba(247,203,77,.12),transparent 70%),linear-gradient(180deg,#1e2331,#10131b)!important;border:1px solid rgba(247,203,77,.55)!important;box-shadow:0 0 0 1px rgba(0,0,0,.6),0 24px 60px rgba(0,0,0,.65),0 0 40px rgba(247,203,77,.14)!important}
.overlay{background:rgba(4,6,10,.72)}
.pbox,.opp,.seat:not(.me),.card2,.stile,.wallet,.opentable,.roster div,.jb-bots>div,.betbox{background:linear-gradient(180deg,rgba(14,17,25,.62),rgba(14,17,25,.42));border-color:rgba(255,255,255,.1)}
.pbox.me{background:linear-gradient(180deg,rgba(247,203,77,.12),rgba(14,17,25,.45))}
.bj-top{padding:4px 6px 4px 10px;border-radius:16px;background:linear-gradient(180deg,rgba(0,0,0,.5),rgba(0,0,0,.22));box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}
.codepill{font-family:var(--body);font-weight:800}
.tsec{background:var(--g-gold);color:#2a1700;box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
.tsec.low{background:var(--g-red);color:#fff}
.menu-btn,.menu-btn2,.chatbtn{background:var(--g-dark);border:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 3px 0 var(--e-dark),0 6px 12px rgba(0,0,0,.4)}
input.txt{background:#0b0d13;border:1px solid rgba(255,255,255,.12);box-shadow:inset 0 2px 6px rgba(0,0,0,.6)}
input.txt:focus{border-color:rgba(247,203,77,.7)}
/* lobby tiles: glossy game cards with a big suit mark */
.ttile{position:relative;overflow:hidden;border:1px solid rgba(247,203,77,.55)!important;box-shadow:0 10px 24px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.18)!important;transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .18s}
.ttile::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.16),transparent 38%);pointer-events:none}
.ttile::before{position:absolute;right:10px;top:4px;font:900 64px/1 var(--display);color:rgba(255,255,255,.13);pointer-events:none}
.ttile.bj::before{content:"21"}.ttile.bc::before{content:"♦"}.ttile.hm::before{content:"♠"}.ttile.jb::before{content:"★"}
.ttile.rm::before{content:"♣"}.ttile.om::before{content:"Q"}.ttile.ew::before{content:"♥";top:-6px}
.ttile .tn{font-family:var(--display);font-weight:900;letter-spacing:.02em}
.ttile .ts{font-weight:600}
@media (hover:hover){.ttile:hover{transform:translateY(-3px);box-shadow:0 16px 30px rgba(0,0,0,.55),0 0 24px rgba(247,203,77,.25),inset 0 1px 0 rgba(255,255,255,.22)!important}}
.ttile:active{transform:scale(.98)}
.tbadge{background:var(--g-gold);color:#2a1700}
/* coach tips: one line until you tap */
.bj-bar .coach:not(.open):not(:has(.link,button)){white-space:nowrap;text-overflow:ellipsis;width:0;min-width:100%}
.coach{position:relative;box-sizing:border-box;padding-left:32px!important;cursor:pointer;overflow:hidden;
  background:linear-gradient(180deg,rgba(247,203,77,.14),rgba(247,203,77,.06))!important;border:1px solid rgba(247,203,77,.4)!important;border-radius:12px!important}
.coach::before{content:"";position:absolute;left:10px;top:9px;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff6d0,#f7cb4d 55%,#b9780f)}
.coach.more::after{content:"▾";position:absolute;right:10px;top:7px;color:#f7cf5c;font-size:12px}
.coach.more{padding-right:26px!important}
.coach:not(.more){cursor:default}
.coach.open::after{content:"▴"}
.coach:has(.link,button)::after{display:none}
.bj-top .eyebrow{letter-spacing:.14em;white-space:nowrap}
.felt-line{letter-spacing:.06em;font-size:12px}
/* smoother screen changes: new screen fades in on top, old one fades away underneath */
.view{position:relative;z-index:1;animation:viewin .32s cubic-bezier(.2,.8,.2,1) both}
.view.exiting{z-index:0;animation:viewout .2s ease-out forwards}
@keyframes viewin{from{opacity:0;transform:translate3d(0,14px,0)}}
@keyframes viewout{to{opacity:0}}
.flychip,.flyer{will-change:transform,opacity;backface-visibility:hidden}


/* ===== Game buttons on the main menu: a little scene of cards, name, tag and a Play button ===== */
.hubside,.hubmain{display:contents}
.gtiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.gtile{--f1:#2f8a4f;--f2:#123d26;position:relative;overflow:hidden;height:186px;padding:12px;border-radius:20px;text-align:left;color:#fff;cursor:pointer;
  display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto auto;gap:6px;border:1px solid rgba(247,203,77,.6);
  background:radial-gradient(ellipse 90% 60% at 50% 0%,rgba(255,240,200,.22),transparent 70%),var(--tex),radial-gradient(ellipse at 50% 30%,var(--f1),var(--f2) 78%);
  box-shadow:inset 0 0 0 3px rgba(0,0,0,.25),inset 0 0 0 4px rgba(247,203,77,.35),inset 0 -40px 50px rgba(0,0,0,.35),0 10px 24px rgba(0,0,0,.5);
  transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s}
.gtile::after{content:"";position:absolute;inset:-40% auto -40% -60%;width:45%;transform:rotate(18deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent);opacity:0;pointer-events:none}
.g-bj{--f1:#2f8a4f;--f2:#0f3a22}.g-bc{--f1:#9a2b33;--f2:#3d0b12}.g-hm{--f1:#2d5cbf;--f2:#0f2456}.g-jb{--f1:#4a3a80;--f2:#150f2a}
.g-rm{--f1:#1f7f78;--f2:#093634}.g-om{--f1:#8a3d6a;--f2:#2e0f22}.g-ew{--f1:#8a6224;--f2:#2f1e08}
.gart{position:relative;display:block;--w:46px;min-height:0}

  box-shadow:0 6px 14px rgba(0,0,0,.5);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.gart .card:nth-child(1):nth-last-child(2){transform:translate(-30%,0) rotate(-12deg)}.gart .card:nth-child(2):nth-last-child(1){transform:translate(30%,0) rotate(10deg)}
.gart .card:nth-child(1):nth-last-child(3){transform:translate(-62%,4%) rotate(-16deg)}.gart .card:nth-child(2):nth-last-child(2){transform:translate(0,-6%) rotate(0)}.gart .card:nth-child(3):nth-last-child(1){transform:translate(62%,4%) rotate(16deg)}
.gart .card:nth-child(1):nth-last-child(4){transform:translate(-72%,6%) rotate(-16deg)}.gart .card:nth-child(2):nth-last-child(3){transform:translate(-24%,-2%) rotate(-5deg)}.gart .card:nth-child(3):nth-last-child(2){transform:translate(24%,-2%) rotate(5deg)}.gart .card:nth-child(4):nth-last-child(1){transform:translate(72%,6%) rotate(16deg)}
.gart .card:nth-child(1):nth-last-child(5){transform:translate(-84%,10%) rotate(-20deg)}.gart .card:nth-child(2):nth-last-child(4){transform:translate(-42%,1%) rotate(-10deg)}.gart .card:nth-child(3):nth-last-child(3){transform:translate(0,-3%)}.gart .card:nth-child(4):nth-last-child(2){transform:translate(42%,1%) rotate(10deg)}.gart .card:nth-child(5):nth-last-child(1){transform:translate(84%,10%) rotate(20deg)}
.g-hm .gart,.g-rm .gart{--w:40px}html.desk .g-hm .gart,html.desk .g-rm .gart{--w:58px}
.g-om .gart .card:nth-child(2){z-index:2;box-shadow:0 0 0 2px #f7cb4d,0 0 18px rgba(247,203,77,.6),0 6px 14px rgba(0,0,0,.5)}
.g-ew .gart .card:nth-child(1){transform:translate(-14%,4%) rotate(-24deg)}.g-ew .gart .card:nth-child(2){transform:translate(10%,-2%) rotate(14deg)}.g-ew .gart .card:nth-child(3){transform:translate(-2%,6%) rotate(-4deg)}
.ginfo{display:flex;flex-direction:column;gap:2px;position:relative}

</style>

<div id="app"></div>

<script>
const SUITS=["♠︎","♥︎","♦︎","♣︎"];
const RANKS={1:"A",11:"J",12:"Q",13:"K"};
const CHANCES={1:4,13:3,12:2,11:1};
const RNAME={1:"Ace",13:"King",12:"Queen",11:"Jack"};
const COLORS=["#e8c35a","#4fc9c0","#f08a6c","#b9a1f0","#9fd46b","#f28fb6"];
const label=r=>(RANKS[r]||r);
const royal=r=>r===1||r>=11;
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const rid=n=>Array.from({length:n},()=>"abcdefghjkmnpqrstuvwxyz23456789"[Math.floor(Math.random()*31)]).join("");

/* ---------- chips ---------- */
const START_CHIPS=500, STAKES=[0,25,50,100,250];
const wallet={get(){const v=store.get("hub-chips");return Number.isFinite(v)?v:START_CHIPS},set(v){const n=Math.max(0,Math.round(v));store.set("hub-chips",n);try{stDay(n);}catch(e){}}};
const localChips={all(){return store.get("hub-local-chips")||{}},get(name){const v=this.all()[name.trim().toLowerCase()];return Number.isFinite(v)?v:START_CHIPS},
  set(name,v){const a=this.all();a[name.trim().toLowerCase()]=Math.max(0,Math.round(v));store.set("hub-local-chips",a)},reset(names){const a=this.all();names.forEach(n=>a[n.trim().toLowerCase()]=START_CHIPS);store.set("hub-local-chips",a)}};
const DAY=864e5, BONUS=50;
const bonus={
  wait(last){return last?Math.max(0,last+DAY-Date.now()):0},
  myWait(){return this.wait(store.get("hub-bonus-at"))},
  claimMine(){if(this.myWait())return;wallet.set(wallet.get()+BONUS);store.set("hub-bonus-at",Date.now());},
  localWait(name){return this.wait((store.get("hub-local-bonus")||{})[name.trim().toLowerCase()])},
  claimLocal(name){if(this.localWait(name))return;localChips.set(name,localChips.get(name)+BONUS);
    const a=store.get("hub-local-bonus")||{};a[name.trim().toLowerCase()]=Date.now();store.set("hub-local-bonus",a);},
  text(ms){const h=Math.floor(ms/36e5),m=Math.ceil((ms%36e5)/6e4);return h?`${h}h ${m}m`:`${m}m`;}
};
function settled(gid){return(store.get("hub-settled")||[]).includes(gid)}
function markSettled(gid){const a=(store.get("hub-settled")||[]).slice(-40);a.push(gid);store.set("hub-settled",a)}
const fmt=n=>Number(n).toLocaleString("en-US");

/* ---------- turn clock: 15 seconds per turn, enforced by whichever device runs the game ---------- */
const TURN_MS=15000;
const _seen=new Map();
function turnDeadline(key,tl){
  if(tl==null)return null;
  if(!_seen.has(key)){_seen.set(key,Date.now()+tl);if(_seen.size>80)_seen.delete(_seen.keys().next().value);}
  return _seen.get(key);
}
function clockHTML(key,tl,mine){
  const dl=turnDeadline(key,tl);if(!dl)return"";
  const r=Math.max(0,dl-Date.now());
  return`<span class="tsec ${r<=5000?"low":""} ${mine?"mine":""}" data-dl="${dl}" aria-label="Time left">${Math.ceil(r/1000)}s</span>`;
}
let lastTickSec=-1,buzzedFor=0;
setInterval(()=>{
  document.querySelectorAll(".tsec[data-dl]").forEach(e=>{const r=Math.max(0,+e.dataset.dl-Date.now()),sec=Math.ceil(r/1000);
    const t=sec+"s";if(e.textContent!==t)e.textContent=t;e.classList.toggle("low",r<=5000);
    if(e.classList.contains("mine")&&r>0&&r<=5000){if(sec!==lastTickSec){lastTickSec=sec;sfx("tick");}
      const dl=+e.dataset.dl;if(buzzedFor!==dl){buzzedFor=dl;buzz(80);}}});
  document.querySelectorAll(".rfg[data-dl]").forEach(e=>e.classList.toggle("low",+e.dataset.dl-Date.now()<=5000));
},250);
const clockLeft=at=>at?Math.max(0,at+TURN_MS-Date.now()):null;

/* ---------- app state ---------- */
const APP={screen:"hub",mode:"local",count:4,names:["Player 1","Player 2","Player 3","Player 4","Player 5","Player 6"],
  myName:(store.get("ew-name")||""),joinCode:"",sheet:null,err:"",buyIn:50,lastResult:null,bj:"local",bjCount:2,bc:"local",bcCount:2,jb:"mine",jbCount:2,hm:"local",om:"off",omBuy:25,omNew:null,omMsg:"",rm:"off",rmBuy:25,rmSel:[],rmSort:"suit",hmCount:3,hmBlinds:0,hmRaise:0,hmRB:false,hmKey:"",peek:false};
let G=null;            // engine state (same-phone, or host)
let V=null, prevV=null;// what's on screen
const CID=store.get("ew-cid")||(()=>{const c=rid(10);store.set("ew-cid",c);return c})();
const NET={room:undefined,nr:null,code:"",seats:[],seen:{},buyIn:50,info:{},agree:null,my:{flip:0,slap:0,nonce:rid(6)},started:false,host:null,hostGone:false,connected:true,mySeat:-1,searchTimer:null};
let timer=null;const toastSeen={};

window.claude?.use?.("room").then(r=>{NET.room=wrapRoom(r)||null;lobbyHook();render();pendingJoin();}).catch(()=>{NET.room=null;render();pendingJoin();});
setTimeout(()=>{if(NET.room===undefined){NET.room=null;render();pendingJoin();}},11000);

/* ---------- engine ---------- */
function newGame(names,buyIn){
  const deck=[];for(let s=0;s<4;s++)for(let r=1;r<=13;r++)deck.push([r,s]);
  for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]];}
  const n=names.length;
  const players=names.map((nm,i)=>({name:nm,color:COLORS[i],hand:[],out:false}));
  deck.forEach((c,i)=>players[i%n].hand.push(c));  // seat 0 sits left of the dealer and goes first
  clearTimeout(timer);
  return{players,pile:[],turn:0,challenge:null,pending:null,lastFlip:0,toast:null,slapLock:0,winner:null,seq:0,
    stake:{buyIn:buyIn|0,gid:rid(8),n}};
}
function nextWithCards(p){
  const n=G.players.length;
  for(let i=1;i<=n;i++){const q=(p+i)%n,pl=G.players[q];if(!pl.out&&pl.hand.length)return q;}
  return -1;
}
function startPending(to){
  G.pending={to};clearTimeout(timer);
  timer=setTimeout(()=>{collect(to,`${G.players[to].name} wins the pile`);changed();},1400);
}
function collect(to,why){
  clearTimeout(timer);
  const pl=G.players[to];
  pl.hand.push(...G.pile);
  G.pile=[];G.challenge=null;G.pending=null;G.turn=to;
  toast(`${why} · starts next round`,pl.color);
  if(pl.hand.length===52)G.winner=to;
}
function fixTurn(){
  if(G.pending)return;
  const cur=G.players[G.turn];
  if(cur&&cur.hand.length&&!cur.out)return;
  const d=nextWithCards(G.turn);
  if(G.challenge){if(d===-1||d===G.challenge.by)startPending(G.challenge.by);else G.turn=d;}
  else{if(d===-1)startPending(G.lastFlip);else G.turn=d;}
}
function flip(p){
  if(!G||G.winner!=null||G.pending||p!==G.turn)return;
  const pl=G.players[p];if(!pl||!pl.hand.length)return;
  const c=pl.hand.shift();G.pile.push(c);G.lastFlip=p;G.pileAt=Date.now();
  if(royal(c[0])){
    G.challenge={by:p,left:CHANCES[c[0]],r:c[0]};
    const d=nextWithCards(p);
    if(d===-1||d===p)startPending(p);else G.turn=d;
  }else if(G.challenge){
    G.challenge.left--;
    if(G.challenge.left<=0)startPending(G.challenge.by);
    else if(!pl.hand.length)fixTurn();
  }else{
    const d=nextWithCards(p);
    if(d===-1)startPending(p);else G.turn=d;
  }
  changed();
}
function combo(zero){
  const P=G.pile,n=P.length,a=P[n-1],b=P[n-2],c=P[n-3];
  if(b&&a[0]===b[0])return"double";
  if(c&&a[0]===c[0])return"sandwich";
  if(!zero&&b&&a[0]<=10&&b[0]<=10&&a[0]+b[0]===10)return"ten";
  return null;
}
function slap(p){
  if(!G||G.winner!=null)return;
  const pl=G.players[p];if(!pl||pl.out)return;
  const now=Date.now();
  if(now-G.slapLock<600)return; // someone just won a slap; near-ties aren't punished
  const zero=pl.hand.length===0,k=combo(zero);
  if(k){G.slapLock=now;
    if(APP.mode!=="local"&&p===NET.mySeat&&G.pileAt){const ms=now-G.pileAt;if(ms>80&&ms<5000)stSet(s=>{if(!s.slap||ms<s.slap)s.slap=ms;});}
    collect(p,`${pl.name} slapped a ${k}!${zero?" Back in the game":""}`);}
  else if(zero){pl.out=true;toast(`${pl.name} false-slapped with no cards and is eliminated`,pl.color);fixTurn();}
  else{const b=pl.hand.shift();G.pile.unshift(b);toast(`${pl.name} false slap · burned a ${label(b[0])} to the bottom`,pl.color);fixTurn();}
  changed();
}
function toast(text,color){G.toast={id:rid(5),text,color};}
function toView(){
  return{seq:++G.seq,players:G.players.map((p,i)=>({name:p.name,color:p.color,n:p.hand.length,out:p.out,cid:G.cids?G.cids[i]:undefined})),
    top:G.pile.slice(-3),pileN:G.pile.length,turn:G.turn,challenge:G.challenge,pending:G.pending,lastFlip:G.lastFlip,toast:G.toast,winner:G.winner,stake:G.stake,cids:G.cids||null,tl:clockLeft(G.turnAt)};
}
/* Chips change hands only when someone wins: each other player pays the buy-in to the winner. */
function settle(){
  if(APP.mode==="practice"||!V||V.winner==null||!V.stake)return;
  const {buyIn,gid,n}=V.stake;
  if(settled(gid))return;
  markSettled(gid);
  const won=buyIn*(n-1);
  if(APP.mode==="local"){
    V.players.forEach((p,i)=>localChips.set(p.name,localChips.get(p.name)+(i===V.winner?won:-buyIn)));
    APP.lastResult=null;
  }else{
    if(NET.mySeat<0)return;
    const d=NET.mySeat===V.winner?won:-buyIn;
    wallet.set(wallet.get()+d);stHand("ew",d,NET.mySeat===V.winner);
    APP.lastResult={gid,d};
    pushChips();
  }
}
function pushChips(){
  if(!NET.nr)return;
  if(APP.mode==="client")NET.nr.presence({chips:wallet.get()}).catch(()=>{});
  else if(APP.mode==="host"){NET.info[CID]={...(NET.info[CID]||{}),ch:wallet.get()};publishHost();}
}
let ewTT=null,ewTK="";
function ewTurnTimer(){
  if(!G)return;
  if(G.winner!=null||G.pending){clearTimeout(ewTT);ewTK="";G.turnAt=null;return;}
  const seat=G.turn,pl=G.players[seat];
  const key=`${G.stake&&G.stake.gid}:${seat}:${pl.hand.length}:${G.challenge?G.challenge.by+"/"+G.challenge.left:"-"}`;
  if(key===ewTK)return;
  ewTK=key;G.turnAt=Date.now();clearTimeout(ewTT);
  ewTT=setTimeout(()=>{
    if(!G||ewTK!==key||G.turn!==seat||G.pending||G.winner!=null)return;
    toast(`${G.players[seat].name} ran out of time · auto-flip`,G.players[seat].color);flip(seat);
  },TURN_MS);
}
function changed(){
  ewTurnTimer();
  V=toView();
  if(APP.mode==="host"){publishHost();saveHost();}
  render();
  if(APP.mode==="practice")ewBotTick();
}

/* ---------- online: host ---------- */
async function hostGame(resume){
  if(!NET.room)return;
  const code=resume?resume.code:rid(4);
  APP.err="";
  try{NET.nr=await NET.room.join("ew-"+code);}catch(e){APP.err="Couldn't open a game room. Try again in a moment.";render();return;}
  APP.mode="host";NET.code=code;NET.seen={};
  if(resume){NET.seats=resume.seats;NET.started=resume.started;G=resume.G;if(G){G.pending&&startPending(G.pending.to);V=toView();}}
  else{NET.seats=[{c:CID,n:APP.myName||"Host"}];NET.started=false;G=null;V=null;}
  NET.mySeat=G&&G.cids?G.cids.indexOf(CID):0;
  if(resume&&resume.buyIn!=null)NET.buyIn=resume.buyIn;
  NET.info={[CID]:{ch:wallet.get()}};
  APP.screen=NET.started?"game":"lobby";NET.hs=Date.now();
  watchConn();
  NET.unsub=NET.nr.onPeers(onPeersHost);
  publishHost();saveHost();render();
}
function publishHost(){
  if(!NET.nr)return;
  NET.nr.presence({role:"host",game:"ew",hs:NET.hs,code:NET.code,cid:CID,started:NET.started,buyIn:NET.buyIn,seats:seatList(),v:NET.started?V:null,snap:ewSnap()}).catch(()=>{});
  lobbyAnnounce(NET.started?null:{g:"ew",code:NET.code,name:myName(),n:NET.seats.length});
}
function seatList(){
  return NET.seats.map((s,i)=>{const f=NET.info[s.c]||{};return{c:s.c,n:s.n,ch:Number.isFinite(f.ch)?f.ch:START_CHIPS,ag:i===0?NET.buyIn:f.ag}});
}
function canStart(){
  const list=seatList(),b=NET.buyIn;
  if(list.length<2)return{ok:false,why:"Waiting for players…",playing:[]};
  const playing=list.filter(s=>s.ch>=b); // anyone who can't cover the buy-in sits out
  if(playing.length<2)return{ok:false,why:`Need 2 players who can cover ${fmt(b)}`,playing};
  const wait=playing.filter(s=>b>0&&s.ag!==b);
  if(wait.length)return{ok:false,why:`Waiting for ${wait.map(s=>s.n).join(", ")} to agree`,playing};
  return{ok:true,why:`Deal 52 cards · ${playing.length} playing`,playing};
}
function setStake(b){NET.buyIn=b;publishHost();saveHost();render();}
function saveHost(){store.set("ew-host",{code:NET.code,seats:NET.seats,started:NET.started,buyIn:NET.buyIn,G});}
function onPeersHost(ch){
  if(dupHost("ew",ch))return;
  let lobbyChanged=false;
  for(const p of ch.peers){
    if(p.sameTab)continue;
    const pr=p.presence||{};
    if(typeof pr.cid!=="string"||pr.role==="host")continue;
    const nm=String(pr.name||"Player").slice(0,14);
    const ch=Number.isFinite(pr.chips)?pr.chips:START_CHIPS,ag=Number.isFinite(pr.agree)?pr.agree:null;
    const old=NET.info[pr.cid]||{};
    if(old.ch!==ch||old.ag!==ag){NET.info[pr.cid]={ch,ag};if(!NET.started||V?.winner!=null)lobbyChanged=true;}
    let seat=NET.seats.findIndex(s=>s.c===pr.cid);
    if(!NET.started){
      if(seat<0&&NET.seats.length<6){NET.seats.push({c:pr.cid,n:nm});lobbyChanged=true;}
      else if(seat>=0&&NET.seats[seat].n!==nm){NET.seats[seat].n=nm;lobbyChanged=true;}
      continue;
    }
    seat=G&&G.cids?G.cids.indexOf(pr.cid):-1;
    if(seat<0)continue; // watching or sitting out
    const key=pr.cid+":"+pr.nonce,s=NET.seen[key];
    if(!s){NET.seen[key]={flip:pr.flip|0,slap:pr.slap|0};continue;}
    if((pr.slap|0)>s.slap){s.slap=pr.slap|0;slap(seat);}
    if((pr.flip|0)>s.flip){s.flip=pr.flip|0;flip(seat);}
  }
  if(!NET.started){
    for(const p of ch.left){const pr=p.presence||{};const i=NET.seats.findIndex((s,k)=>k>0&&s.c===pr.cid);
      if(i>0&&!ch.peers.some(q=>q.presence&&q.presence.cid===pr.cid)){NET.seats.splice(i,1);lobbyChanged=true;}}
  }
  if(lobbyChanged){publishHost();saveHost();render();}
}
function hostStart(){
  const cs=canStart();if(!cs.ok)return;
  NET.started=true;NET.seen={};APP.lastResult=null;
  G=newGame(cs.playing.map(s=>s.n),NET.buyIn);G.cids=cs.playing.map(s=>s.c);
  NET.mySeat=G.cids.indexOf(CID);
  APP.screen="game";APP.sheet=null;changed();
}
function hostToLobby(){
  // back to the lobby to set a new pot; nobody pays for an unfinished game
  clearTimeout(timer);NET.started=false;G=null;V=null;APP.screen="lobby";APP.sheet=null;publishHost();saveHost();render();
}

/* ---------- online: guest ---------- */
async function joinGame(){
  const code=APP.joinCode.trim().toLowerCase();
  if(!/^[a-z0-9]{4}$/.test(code)){APP.err="Enter the 4-character code from the host's screen.";render();return;}
  if(!NET.room)return;
  APP.err="";
  try{NET.nr=await NET.room.join("ew-"+code);}catch(e){APP.err="Couldn't reach that game. Check the code and try again.";render();return;}
  APP.mode="client";NET.code=code;NET.host=null;NET.hostGone=false;NET.started=false;V=null;NET.mySeat=-1;
  NET.my={flip:0,slap:0,nonce:rid(6)};
  NET.agree=null;
  NET.nr.presence({cid:CID,game:"ew",name:myName(),nonce:NET.my.nonce,flip:0,slap:0,chips:wallet.get(),agree:null}).catch(()=>{});
  watchConn();
  NET.unsub=NET.nr.onPeers(onPeersClient);
  APP.screen="lobby";
  clearTimeout(NET.searchTimer);NET.searchTimer=setTimeout(()=>{if(!NET.host){NET.hostGone=true;render();}},6000);
  render();
}
function onPeersClient(ch){
  const h=ch.peers.find(p=>p.presence&&p.presence.role==="host"&&p.presence.code===NET.code);
  if(!h){if(NET.host){NET.hostGone=true;hostMissing("ew");render();}return;}
  NET.hostGone=false;hostSeen("ew");
  const pr=h.presence;NET.host=pr;
  NET.started=!!pr.started;
  NET.buyIn=Number.isFinite(pr.buyIn)?pr.buyIn:0;
  NET.seats=Array.isArray(pr.seats)?pr.seats:[];
  NET.mySeat=NET.started&&pr.v&&Array.isArray(pr.v.cids)?pr.v.cids.indexOf(CID):NET.seats.findIndex(s=>s&&s.c===CID);
  if(NET.started&&pr.v){if(!V||pr.v.seq!==V.seq){V=pr.v;}if(APP.screen==="lobby")APP.screen="game";}
  if(!NET.started&&APP.screen==="game"){APP.screen="lobby";V=null;}
  render();
}
function guestAct(kind){
  if(!NET.nr||NET.mySeat<0)return;
  NET.my[kind]++;
  NET.nr.presence({[kind]:NET.my[kind]}).catch(()=>{});
}
function guestAgree(on){
  if(!NET.nr)return;
  NET.agree=on?NET.buyIn:null;
  NET.nr.presence({agree:NET.agree,chips:wallet.get()}).catch(()=>{});
  render();
}
function watchConn(){

  if(v.challenge){const c=v.challenge;return`${RNAME[c.r]} from ${who(c.by)} · ${who(v.turn)} ${v.turn===me?"have":"has"} ${c.left} ${c.left===1?"chance":"chances"}`;}
  return v.turn===me?"Your flip":`${esc(P[v.turn].name)}'s flip`;
}
function seatStatus(v,p){
  const pl=v.players[p],ch=v.challenge;
  const turn=v.turn===p&&!v.pending&&!pl.out&&pl.n>0;
  if(pl.out)return["Eliminated",turn];
  if(v.pending&&v.pending.to===p)return["<b>Taking the pile…</b>",turn];
  const clk=turn?clockHTML((v.stake&&v.stake.gid)+":"+v.seq,v.tl,APP.mode!=="local"&&p===NET.mySeat):"";
  if(turn&&ch)return[`<b>Defend!</b><span class="pips">${"<i></i>".repeat(ch.left)}</span>${clk}`,turn];
  if(turn)return[`<b>Flip!</b>${clk}`,turn];
  if(!pl.n)return["No cards · slap doubles or sandwiches",turn];
  if(ch&&ch.by===p)return[`Their ${RNAME[ch.r]} is out`,turn];
  return["",turn];
}
